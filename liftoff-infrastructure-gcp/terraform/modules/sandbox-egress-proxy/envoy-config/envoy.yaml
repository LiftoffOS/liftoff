# Envoy proxy configuration for sandbox egress audit.
#
# This config is stored in GCS and mounted into the audit-proxy sidecar
# alongside sandbox-executor Cloud Run containers. Envoy intercepts all
# outbound HTTP/HTTPS from the sandbox container via the HTTP_PROXY /
# HTTPS_PROXY env vars set on the main container.
#
# Audit flow:
#   1. Sandbox container makes any HTTP/HTTPS call
#   2. Call is routed to Envoy on port 9901 (proxy listener)
#   3. Lua filter captures method, URL, headers, body, and X-Liftoff-Invocation-Id
#   4. For write verbs (POST/PUT/PATCH/DELETE) to known vendor domains:
#      a Lua coroutine makes a preflight GET to snapshot pre-action state
#      and the request body is buffered (first 8KB) for the audit event
#   5. Request is forwarded to the original destination via ORIGINAL_DST cluster
#   6. Response is captured and a structured audit event is emitted to Pub/Sub
#      via the GCP metadata service (using the sandbox-executor SA credentials)
#
# Port layout:
#   9901 — HTTP forward proxy listener (main container proxies through here)
#   9902 — Envoy admin interface (metrics, health, config dump)
#
# KNOWN LIMITATION: HTTPS interception
# Envoy handles HTTPS via CONNECT tunnel passthrough (TCP-transparent). The Lua
# HTTP filter runs for plain HTTP only. For HTTPS calls, only the tunnel endpoint
# (domain:port) is visible in the CONNECT headers — request body, path, and
# response body are opaque. Full HTTPS interception requires TLS termination with
# a MITM certificate injected into the sandbox container, which is tracked as a
# follow-up task. Until then, this proxy audits HTTP calls only.
#
# LATENCY PRECISION: os.time() returns wall-clock seconds (integer). latency_ms
# values in audit events therefore have 1-second precision. Sub-second timing
# requires a high-resolution monotonic clock not available in Envoy's Lua sandbox.

static_resources:
  listeners:
    - name: http_proxy
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_proxy
                codec_type: AUTO

                # Upgrade HTTP CONNECT tunnels (required for HTTPS CONNECT proxying).
                upgrade_configs:
                  - upgrade_type: CONNECT

                route_config:
                  name: proxy_route
                  virtual_hosts:
                    - name: all_hosts
                      domains: ["*"]
                      routes:
                        - match:
                            connect_matcher: {}
                          route:
                            cluster: passthrough
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        - match:
                            prefix: "/"
                          route:
                            cluster: passthrough

                http_filters:
                  # Lua filter: captures audit metadata and emits Pub/Sub events.
                  # The filter runs for every proxied request. Write-verb requests to
                  # known vendor domains trigger an additional preflight GET to snapshot
                  # pre-action state and buffer the request body before forwarding.
                  # Audit events are published to the AUDIT_PUBSUB_TOPIC env var topic
                  # using the instance's SA credentials fetched from the GCE metadata server.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaHttpFilter
                      default_source_code:
                        inline_string: |
                          -- Liftoff Sandbox Egress Audit Filter v3
                          -- Logs and audits outbound HTTP calls from sandbox containers.
                          -- For write verbs to known vendor domains, captures pre-action state via
                          -- preflight GET and buffers the request body for the audit event.
                          -- NOTE: HTTPS CONNECT tunnels are a known limitation — only the tunnel
                          -- endpoint (domain:port) is visible for HTTPS. Plain HTTP is fully audited.

                          local WRITE_VERBS = { POST = true, PUT = true, PATCH = true, DELETE = true }

                          -- Pure-Lua base64 encoder (no external libraries required).
                          -- Envoy's LuaJIT sandbox does not include luasocket or other encoding libs.
                          local BASE64_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
                          local function base64_encode(data)
                            local result = {}
                            local len = #data
                            local pad = len % 3
                            for i = 1, len - pad, 3 do
                              local a, b, c = data:byte(i, i + 2)
                              local n = a * 65536 + b * 256 + c
                              result[#result + 1] = BASE64_CHARS:sub(math.floor(n / 262144) % 64 + 1, math.floor(n / 262144) % 64 + 1)
                              result[#result + 1] = BASE64_CHARS:sub(math.floor(n / 4096) % 64 + 1, math.floor(n / 4096) % 64 + 1)
                              result[#result + 1] = BASE64_CHARS:sub(math.floor(n / 64) % 64 + 1, math.floor(n / 64) % 64 + 1)
                              result[#result + 1] = BASE64_CHARS:sub(n % 64 + 1, n % 64 + 1)
                            end
                            if pad == 1 then
                              local a = data:byte(len)
                              local n = a * 65536
                              result[#result + 1] = BASE64_CHARS:sub(math.floor(n / 262144) % 64 + 1, math.floor(n / 262144) % 64 + 1)
                              result[#result + 1] = BASE64_CHARS:sub(math.floor(n / 4096) % 64 + 1, math.floor(n / 4096) % 64 + 1)
                              result[#result + 1] = '=='
                            elseif pad == 2 then
                              local a, b = data:byte(len - 1, len)
                              local n = a * 65536 + b * 256
                              result[#result + 1] = BASE64_CHARS:sub(math.floor(n / 262144) % 64 + 1, math.floor(n / 262144) % 64 + 1)
                              result[#result + 1] = BASE64_CHARS:sub(math.floor(n / 4096) % 64 + 1, math.floor(n / 4096) % 64 + 1)
                              result[#result + 1] = BASE64_CHARS:sub(math.floor(n / 64) % 64 + 1, math.floor(n / 64) % 64 + 1)
                              result[#result + 1] = '='
                            end
                            return table.concat(result)
                          end

                          -- Parse comma-separated allowlist from env var once per filter load.
                          local function get_allowlist()
                            local raw = os.getenv("VENDOR_DOMAIN_ALLOWLIST") or ""
                            local t = {}
                            for d in raw:gmatch("[^,]+") do
                              t[d:match("^%s*(.-)%s*$")] = true
                            end
                            return t
                          end
                          local ALLOWLIST = get_allowlist()

                          local function is_allowlisted(authority)
                            if next(ALLOWLIST) == nil then return true end  -- empty allowlist = allow all
                            local domain = authority:match("^([^:]+)") or authority
                            return ALLOWLIST[domain] == true
                          end

                          -- Extract entity ID from URL path (last non-empty segment that looks like an ID).
                          local function extract_entity_id(path)
                            local id = path:match("/([^/?]+)%??[^/]*$")
                            if id and id:match("^[A-Za-z0-9_%-%.]+$") and #id >= 3 then
                              return id
                            end
                            return nil
                          end

                          -- Derive entity type from URL path (first meaningful path segment after stripping API
                          -- version prefixes). e.g. /services/data/v57.0/sobjects/Lead/123 → "sobjects"
                          local function extract_entity_type(path)
                            local stripped = path:match("^([^?]+)") or path
                            stripped = stripped:gsub("/v%d+[%.%d]*/", "/")
                                               :gsub("^/api/", "/")
                                               :gsub("^/services/data/[^/]*/", "/")
                            return stripped:match("^/([^/?%.]+)") or "unknown"
                          end

                          -- Map domain keyword to connector type.
                          local function get_connector_type(authority)
                            local domain = (authority:match("^([^:]+)") or authority):lower()
                            if domain:find("salesforce", 1, true)  then return "salesforce"      end
                            if domain:find("slack",      1, true)  then return "slack"            end
                            if domain:find("graph%.microsoft") or
                               domain:find("office365", 1, true)   then return "microsoft"        end
                            if domain:find("github",    1, true)   then return "github"           end
                            if domain:find("googleapis",1, true) or
                               domain:find("google",    1, true)   then return "google"           end
                            if domain:find("atlassian", 1, true) or
                               domain:find("jira",      1, true)   then return "atlassian_jira"   end
                            if domain:find("hubspot",   1, true)   then return "hubspot"          end
                            if domain:find("notion",    1, true)   then return "notion"           end
                            if domain:find("linear",    1, true)   then return "linear"           end
                            if domain:find("stripe",    1, true)   then return "stripe"           end
                            if domain:find("zoom",      1, true)   then return "zoom"             end
                            if domain:find("airtable",  1, true)   then return "airtable"         end
                            if domain:find("asana",     1, true)   then return "asana"            end
                            if domain:find("intercom",  1, true)   then return "intercom"         end
                            if domain:find("zendesk",   1, true)   then return "zendesk"          end
                            return "unknown"
                          end

                          -- Fetch SA access token from GCE metadata server.
                          local function get_access_token(handle)
                            local headers, body = handle:httpCall(
                              "metadata_cluster",
                              {
                                [":method"]         = "GET",
                                [":path"]           = "/computeMetadata/v1/instance/service-accounts/default/token",
                                [":authority"]      = "metadata.google.internal",
                                ["Metadata-Flavor"] = "Google",
                              },
                              "", 1000
                            )
                            if headers == nil or headers[":status"] ~= "200" then return nil end
                            local ok, data = pcall(require("cjson").decode, body)
                            if not ok then return nil end
                            return data["access_token"]
                          end

                          -- Publish audit event to Pub/Sub. Uses pure-Lua base64_encode — no mime lib needed.
                          local function publish_audit_event(handle, payload_json)
                            local pubsub_topic = os.getenv("AUDIT_PUBSUB_TOPIC") or ""
                            local project      = os.getenv("GOOGLE_CLOUD_PROJECT") or ""
                            if pubsub_topic == "" or project == "" then return end

                            local token = get_access_token(handle)
                            if not token then return end

                            local cjson = require("cjson")
                            local ok, encoded = pcall(cjson.encode, {
                              messages = {{
                                data       = base64_encode(payload_json),
                                attributes = { source = "sandbox-egress-proxy" },
                              }}
                            })
                            if not ok then return end

                            handle:httpCall(
                              "pubsub_cluster",
                              {
                                [":method"]       = "POST",
                                [":path"]         = "/v1/projects/" .. project .. "/topics/" .. pubsub_topic .. ":publish",
                                [":authority"]    = "pubsub.googleapis.com",
                                ["Authorization"] = "Bearer " .. token,
                                ["Content-Type"]  = "application/json",
                              },
                              encoded, 2000
                            )
                          end

                          function envoy_on_request(request_handle)
                            local method        = request_handle:headers():get(":method") or ""
                            local path          = request_handle:headers():get(":path") or ""
                            local authority     = request_handle:headers():get(":authority") or ""
                            local invocation_id = request_handle:headers():get("x-liftoff-invocation-id") or ""

                            request_handle:streamInfo():dynamicMetadata():set("liftoff_audit", "method",        method)
                            request_handle:streamInfo():dynamicMetadata():set("liftoff_audit", "authority",     authority)
                            request_handle:streamInfo():dynamicMetadata():set("liftoff_audit", "path",          path)
                            request_handle:streamInfo():dynamicMetadata():set("liftoff_audit", "invocation_id", invocation_id)
                            -- Wall-clock start time (second precision via os.time()).
                            request_handle:streamInfo():dynamicMetadata():set("liftoff_audit", "start_time",    tostring(os.time()))

                            if WRITE_VERBS[method] and is_allowlisted(authority) then
                              -- Buffer request body (up to 8KB) for the audit event.
                              -- body() blocks until the full body is received; getBytes caps the read.
                              local ok_body, body_buf = pcall(function() return request_handle:body() end)
                              if ok_body and body_buf and body_buf:length() > 0 then
                                local body_bytes = body_buf:getBytes(0, math.min(body_buf:length(), 8192))
                                request_handle:streamInfo():dynamicMetadata():set("liftoff_audit", "request_body", body_bytes)
                              end

                              -- Preflight GET to snapshot pre-action state (best-effort).
                              local entity_id = extract_entity_id(path)
                              if entity_id then
                                local base_path  = path:match("^([^?]+)") or path
                                local auth_header = request_handle:headers():get("Authorization") or ""
                                local ok_pre, pre_headers, pre_body = pcall(function()
                                  return request_handle:httpCall(
                                    "passthrough",
                                    {
                                      [":method"]       = "GET",
                                      [":path"]         = base_path,
                                      [":authority"]    = authority,
                                      ["Authorization"] = auth_header,
                                    },
                                    "", 3000
                                  )
                                end)
                                if ok_pre and pre_headers and pre_headers[":status"] == "200" then
                                  local snapshot = pre_body and pre_body:sub(1, 4096) or ""
                                  request_handle:streamInfo():dynamicMetadata():set("liftoff_audit", "pre_action_snapshot", snapshot)
                                  request_handle:streamInfo():dynamicMetadata():set("liftoff_audit", "entity_id",           entity_id)
                                end
                              end
                            end
                          end

                          function envoy_on_response(response_handle)
                            local meta = response_handle:streamInfo():dynamicMetadata():get("liftoff_audit")
                            if not meta then return end

                            local method     = meta["method"]       or ""
                            local authority  = meta["authority"]    or ""
                            local path       = meta["path"]         or ""
                            local invocation = meta["invocation_id"] or ""
                            local start_time = tonumber(meta["start_time"] or "0")
                            local status     = response_handle:headers():get(":status") or ""
                            local latency_ms = (os.time() - start_time) * 1000
                            local pre_snap   = meta["pre_action_snapshot"]
                            local entity_id  = meta["entity_id"]
                            local req_body   = meta["request_body"]

                            local cjson = require("cjson")
                            local event = {
                              event_type     = "sandbox_egress",
                              method         = method,
                              domain         = authority,
                              path           = path,
                              status         = status,
                              latency_ms     = latency_ms,
                              invocation_id  = invocation,
                              timestamp      = os.date("!%Y-%m-%dT%H:%M:%SZ"),
                              is_write       = WRITE_VERBS[method] == true,
                              is_allowlisted = is_allowlisted(authority),
                              connector_type = get_connector_type(authority),
                              entity_type    = extract_entity_type(path),
                            }
                            if entity_id then event["entity_id"]              = entity_id  end
                            if pre_snap and pre_snap ~= "" then event["pre_action_snapshot_raw"] = pre_snap  end
                            if req_body and req_body ~= "" then event["request_body"]             = req_body  end

                            local ok, event_json = pcall(cjson.encode, event)
                            if ok then
                              publish_audit_event(response_handle, event_json)
                            end
                          end

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ORIGINAL_DST cluster: forwards to the original destination IP:port.
    # Used for both plain HTTP and HTTPS CONNECT tunnels.
    - name: passthrough
      connect_timeout: 30s
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      upstream_http_protocol_options:
        accept_http_10: true

    # GCE Metadata Service — used by the Lua filter to obtain SA access tokens.
    - name: metadata_cluster
      connect_timeout: 1s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: metadata_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 169.254.169.254
                      port_value: 80

    # Google Pub/Sub — used by the Lua filter to publish audit events.
    - name: pubsub_cluster
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: pubsub_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: pubsub.googleapis.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: pubsub.googleapis.com

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9902
