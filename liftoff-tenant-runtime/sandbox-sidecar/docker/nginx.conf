worker_processes 1;
# As 'sandbox' user we can't write /var/log/nginx — redirect to stdout/stderr.
# Cloud Logging picks them up automatically.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  log_format json escape=json '{"ts":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  # Working directories that must be writable by the sandbox user.
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  proxy_http_version 1.1;
  proxy_set_header  Host $host;
  proxy_set_header  X-Real-IP $remote_addr;
  proxy_set_header  X-Original-URI $request_uri;
  proxy_read_timeout 600s;

  upstream sidecar { server 127.0.0.1:8090; }
  upstream authbk  { server 127.0.0.1:8081; }
  upstream vscode  { server 127.0.0.1:8200; }
  upstream novnc   { server 127.0.0.1:6080; }
  upstream cdp     { server 127.0.0.1:9222; }

  server {
    listen 8080 default_server;
    client_max_body_size 50m;

    # Internal auth subrequest — validates Bearer JWT or ?ticket=
    location = /auth {
      internal;
      proxy_pass http://authbk;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Authorization $http_authorization;
    }

    location /health { proxy_pass http://sidecar; }

    # Unauthenticated liveness for the sidecar's composite /health check to
    # probe nginx itself. Avoids hitting an auth-gated /v1/ path (which 401s
    # without a Bearer and made nginx report unhealthy on cold start) and
    # avoids recursing through /health → sidecar → nginx.
    location = /nginx-up { return 200 "ok\n"; }

    location /v1/ {
      auth_request /auth;
      proxy_pass http://sidecar;
    }

    # /vscode/ /vnc/ /cdp/ require browser-style auth (ticket → session cookie).
    # auth_request does NOT propagate Set-Cookie from the subrequest by default;
    # we capture it via auth_request_set and re-add it on the parent response.
    location /vscode/ {
      auth_request /auth;
      auth_request_set $auth_set_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_set_cookie always;
      proxy_pass http://vscode/;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /vnc/ {
      auth_request /auth;
      auth_request_set $auth_set_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_set_cookie always;
      proxy_pass http://novnc/;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /cdp/ {
      auth_request /auth;
      auth_request_set $auth_set_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_set_cookie always;
      proxy_pass http://cdp/;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
