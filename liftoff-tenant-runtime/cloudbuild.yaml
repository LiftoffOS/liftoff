          --concurrency 80 \
          --timeout 30 \
          --set-env-vars "NODE_ENV=production,ENVIRONMENT=${_ENVIRONMENT},ANCHOR_WEBHOOK_UPSTREAM_URL=$$AGENT_URL_VAL"
    waitFor: ['docker-push-app', 'resolve-peer-urls']

  # After all 4 split services are up, resolve each URL and patch each service
  # with only the peer URLs it actually calls (plan §4c). Distribution:
  #   - agent-service         → TOOL_GATEWAY_SERVICE_URL, COORDINATOR_SERVICE_URL
  #   - coordinator-service   → AGENT_SERVICE_URL, TOOL_GATEWAY_SERVICE_URL,
  #                             REFLECTION_SERVICE_URL,
  #                             REFLECTION_URL (Cloud Tasks enqueue target)
  #   - tool-gateway-service  → TOOL_GATEWAY_SERVICE_URL (self — used as the
  #                             expected OIDC audience in service-auth)
  #   - reflection-service    → (no peers)
  # Every service also gets its own self-URL so service-auth.ts can verify
  # inbound OIDC tokens minted with aud == the target service URL.
  # On first deploy, one or more describe calls may return empty (race); the
  # script retries once after a short sleep, matching the TENANT_RUNTIME_URL
  # first-deploy pattern.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'patch-split-service-urls'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Single-phase deploy bootstrap (plan §4.7): on normal deploys every
        # peer URL was already resolved in resolve-peer-urls and burned into
        # each service's --set-env-vars. Skip the patch.
        # On the first-ever deploy of a tenant project, resolve-peer-urls saw
        # empty URLs for one or more services → deploys used placeholders →
        # we re-resolve here and patch the real URLs in.
        source /workspace/peer-urls.env
        if [ -n "$$AGENT_URL" ] && [ -n "$$COORD_URL" ] && [ -n "$$TOOLGW_URL" ] && [ -n "$$REFLECT_URL" ] && [ -n "$$SANDBOX_EXEC_URL" ]; then
          echo "All peer URLs were known at deploy time — nothing to patch."
          exit 0
        fi

        echo "First-deploy mode — re-resolving and patching peer URLs..."
        resolve() {
          local svc="$$1"
          gcloud run services describe "$$svc" \
            --region ${_REGION} \
            --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
            --format='value(status.url)' 2>/dev/null || echo ""
        }

        AGENT_URL=$$(resolve agent-service)
        COORD_URL=$$(resolve coordinator-service)
        TOOLGW_URL=$$(resolve tool-gateway-service)
        REFLECT_URL=$$(resolve reflection-service)
        SANDBOX_EXEC_URL=$$(resolve sandbox-executor)

        if [ -z "$$AGENT_URL" ] || [ -z "$$COORD_URL" ] || [ -z "$$TOOLGW_URL" ] || [ -z "$$REFLECT_URL" ] || [ -z "$$SANDBOX_EXEC_URL" ]; then
          echo "one or more split services have no URL yet — sleeping 10s and retrying once"
          sleep 10
          AGENT_URL=$$(resolve agent-service)
          COORD_URL=$$(resolve coordinator-service)
          TOOLGW_URL=$$(resolve tool-gateway-service)
          REFLECT_URL=$$(resolve reflection-service)
          SANDBOX_EXEC_URL=$$(resolve sandbox-executor)
        fi

        echo "AGENT_SERVICE_URL=$$AGENT_URL"
        echo "COORDINATOR_SERVICE_URL=$$COORD_URL"
        echo "TOOL_GATEWAY_SERVICE_URL=$$TOOLGW_URL"
        echo "REFLECTION_SERVICE_URL=$$REFLECT_URL"
        echo "SANDBOX_EXECUTOR_URL=$$SANDBOX_EXEC_URL"

        # Agent: needs tool-gateway + coordinator peers, plus AGENT_SERVICE_URL
        # self-ref so other receivers can verify OIDC tokens that name it.
        # REFLECTION_URL is the Cloud Tasks target for reflection enqueues
        # fired from agent-owned paths (HITL late-feedback, etc.).
        gcloud run services update agent-service \
          --region ${_REGION} \
          --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
          --update-env-vars "AGENT_SERVICE_URL=$$AGENT_URL,TOOL_GATEWAY_SERVICE_URL=$$TOOLGW_URL,COORDINATOR_SERVICE_URL=$$COORD_URL,REFLECTION_URL=$$REFLECT_URL,TENANT_RUNTIME_URL=$$AGENT_URL,SANDBOX_EXECUTOR_URL=$$SANDBOX_EXEC_URL"

        # Coordinator: needs agent + tool-gateway + reflection peers, plus
        # REFLECTION_URL for Cloud Tasks enqueue (reflection jobs target the
        # reflection-service Cloud Run URL). COORDINATOR_SERVICE_URL is self.
        # TENANT_RUNTIME_URL points at agent-service — agentLifecycleService
        # ensureSchedulerJob (invoked from handleInternalAgentCreated) builds
        # Cloud Scheduler HTTP targets against this URL. Missing this turns
        # every new-agent event into a poison message in
        # control-plane-events-${env}-coordinator-sub.
        gcloud run services update coordinator-service \
          --region ${_REGION} \
          --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
          --update-env-vars "COORDINATOR_SERVICE_URL=$$COORD_URL,AGENT_SERVICE_URL=$$AGENT_URL,TOOL_GATEWAY_SERVICE_URL=$$TOOLGW_URL,REFLECTION_SERVICE_URL=$$REFLECT_URL,REFLECTION_URL=$$REFLECT_URL,TENANT_RUNTIME_URL=$$AGENT_URL"

        # Tool-gateway: own self-URL for OIDC audience verification in
        # requireServiceAuth (src/tool-gateway/router.ts), plus TENANT_RUNTIME_URL
        # for the OIDC audience used when proxying internal-agent delegation calls
        # back to agent-service (src/tool-gateway/internal-agent-handler.ts).
        gcloud run services update tool-gateway-service \
          --region ${_REGION} \
          --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
          --update-env-vars "TOOL_GATEWAY_SERVICE_URL=$$TOOLGW_URL,TENANT_RUNTIME_URL=$$AGENT_URL,SANDBOX_EXECUTOR_URL=$$SANDBOX_EXEC_URL"

        # Reflection: self-URL for OIDC audience + REFLECTION_URL (= self) as
        # the Cloud Tasks target for scheduled-reflection enqueues fired from
        # within reflection-service itself.
        gcloud run services update reflection-service \
          --region ${_REGION} \
          --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
          --update-env-vars "REFLECTION_SERVICE_URL=$$REFLECT_URL,REFLECTION_URL=$$REFLECT_URL"

        # SANDBOX_EXECUTOR_URL is its own self-URL — used as the OIDC audience
        # for inbound calls to /v2/execute and the legacy ee surface.
        # AGENT_SERVICE_URL and TOOL_GATEWAY_SERVICE_URL are the proxy targets
        # for /internal/sandbox/{events,mcp/*}.
        gcloud run services update sandbox-executor \
          --region ${_REGION} \
          --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
          --update-env-vars "SANDBOX_EXECUTOR_URL=$$SANDBOX_EXEC_URL,AGENT_SERVICE_URL=$$AGENT_URL,TOOL_GATEWAY_SERVICE_URL=$$TOOLGW_URL,TENANT_RUNTIME_INTERNAL_URL=$$AGENT_URL"
    waitFor:
      - deploy-agent-service
      - deploy-coordinator-service
      - deploy-tool-gateway-service
      - deploy-reflection-service
      - deploy-sandbox-executor

  # Collab-eval telemetry env for agent-service. Wired here, NOT in the
  # deploy-agent-service --set-env-vars, because that single arg already sits at
  # Cloud Build's post-substitution length ceiling — appending the COLLAB_* vars
  # there makes the build invalid. --update-env-vars is additive (leaves the
  # core env untouched), so this is a durable, deploy-preserved wiring rather
  # than a manual `gcloud run services update` that the next deploy would wipe.
  #
  # Operator-flip safe: COLLAB_SESSIONS_ENABLED / COLLAB_ARTIFACT_SNAPSHOT_ENABLED
  # come from resolve-operator-flags (get_flag reads the live pre-deploy revision
  # and defaults to false), so an operator toggle survives redeploys and stays
  # per-tenant (eval tenant on, everyone else dormant). Ordered AFTER
  # patch-split-service-urls so the two agent-service updates never race on
  # first-ever deploys.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'set-collab-agent-env'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        source /workspace/operator-flags.env
        gcloud run services update agent-service \
          --region ${_REGION} \
          --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
          --update-env-vars "COLLAB_SESSIONS_ENABLED=$$AGENT_COLLAB_SESSIONS_ENABLED,COLLAB_ARTIFACT_SNAPSHOT_ENABLED=$$AGENT_COLLAB_ARTIFACT_SNAPSHOT_ENABLED,COLLAB_HITL_CORRELATION_SINCE=${_COLLAB_HITL_CORRELATION_SINCE}"
    waitFor:
      - patch-split-service-urls

  # Durable collab-grade Cloud Run JOB (created/updated here, NOT executed on deploy).
  # Runs the agentic deliverable grader IN-TENANT with a 1800s task-timeout. Rationale:
  # execution-heavy grades (rubric generation + two sandbox-backed judges that actually
  # run the deliverable) systematically exceed agent-service's 300s /harvest request
  # window and 504 there; a Cloud Run Job has no request timeout. Same runtime env as
  # agent-service (SERVICE_TYPE=agent → getToolGatewayDispatcher() is the HTTP client to
  # tool-gateway-service → sandbox). Notes:
  #   - GCP_LOCATION is DELIBERATELY UNSET so the gemini judge defaults to Vertex
  #     'global' (us-west1/us-central1 return 404 for these projects — llm/providers/google.ts).
  #   - Judges + rubric model are PINNED explicitly (deterministic, not reliant on a
  #     library default). DIAGNOSTICS_GRADER_JUDGES carries a comma, so --set-env-vars
  #     uses gcloud's ^@^ custom-delimiter form (@ separates pairs; no value contains @).
  #   - create/update share one command so resources/timeout are enforced on every build.
  #   - Cloud Run Jobs do not support --execution-environment (services-only); the job
  #     default is used.
  #   - Fanned out by the control `agent-diagnostics --collab-grade` orchestrator, one
  #     execution per ungraded run, with the work item passed as a base64 per-execution env
  #     override (COLLAB_GRADE_WORKLIST_B64) — never executed here.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-collab-grade-job'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        DB_HOST=$$(cat /workspace/db_host)
        SQL_CONN="YOUR_GCP_PROJECT:${_REGION}:control-plane-pg-${_ENVIRONMENT}"
        IMAGE="${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/${_SERVICE_NAME}:${SHORT_SHA}"
        SA="tenant-${_TENANT_ID}-runtime@tenant-${_TENANT_ID}-${_ENVIRONMENT}.iam.gserviceaccount.com"
        PROJ="tenant-${_TENANT_ID}-${_ENVIRONMENT}"
        NAME="${_SERVICE_NAME}-collab-grade"
        # Re-resolve the live peer URLs — services are deployed + patched by now.
        TOOLGW_URL=$$(gcloud run services describe tool-gateway-service --region ${_REGION} --project $$PROJ --format='value(status.url)' 2>/dev/null || echo "")
        AGENT_URL=$$(gcloud run services describe agent-service --region ${_REGION} --project $$PROJ --format='value(status.url)' 2>/dev/null || echo "")
        ENVVARS="^@^SERVICE_TYPE=agent@NODE_ENV=production@ENVIRONMENT=${_ENVIRONMENT}@TENANT_ID=${_TENANT_ID}@GCP_PROJECT_ID=$$PROJ@GCP_PROJECT=$$PROJ@CLOUD_SQL_CONNECTION_NAME=$$SQL_CONN@DB_USER=tenant_app@DB_NAME=tenant_runtime@DB_HOST=$$DB_HOST@TOOL_GATEWAY_SERVICE_URL=$$TOOLGW_URL@TENANT_RUNTIME_URL=$$AGENT_URL@AGENT_SERVICE_URL=$$AGENT_URL@SANDBOX_KMS_KEY_NAME=projects/$$PROJ/locations/${_REGION}/keyRings/sandbox-secrets/cryptoKeys/sandbox-jwt-secret@DIAGNOSTICS_RESULTS_BUCKET=trajectories-${_ENVIRONMENT}@DIAGNOSTICS_GRADER_MODE=agentic@DIAGNOSTICS_RUBRIC_MODEL=anthropic:large@DIAGNOSTICS_GRADER_JUDGES=anthropic:large,google:large"
        SECRETS="DB_PASSWORD=tenant-db-password:latest,TENANT_RUNTIME_SERVICE_TOKEN=tenant-runtime-service-token:latest,ANTHROPIC_API_KEY=anthropic-api-key-${_ENVIRONMENT}:latest,PLATFORM_CALLBACK_TOKEN=platform-callback-token:latest"
        if gcloud run jobs describe $$NAME --region ${_REGION} --project $$PROJ 2>/dev/null; then VERB=update; else VERB=create; fi
        echo "$$VERB $$NAME (collab-grade job)..."
        gcloud run jobs $$VERB $$NAME --image $$IMAGE --region ${_REGION} --project $$PROJ \
          --service-account $$SA \
          --network tenant-${_TENANT_ID}-vpc --subnet tenant-${_TENANT_ID}-subnet --vpc-egress all-traffic \
          --command node --args dist/scripts/collab-grade-worker.js \
          --set-env-vars "$$ENVVARS" --set-secrets "$$SECRETS" \
          --memory 8Gi --cpu 4 --task-timeout 1800 --max-retries 0 --parallelism 1
    waitFor:
      - patch-split-service-urls
      - migrate
      - docker-push-app

  # Phase 5 push migration: patch each control-plane push subscription's
  # push_endpoint + OIDC audience with the live coordinator-service URL.
  #
  # Why a patch step (Gap 1): pubsub_push.tf in tenant-runtime-template creates
  # the 8 push subscriptions with a *placeholder* push_endpoint guarded by
  # `lifecycle { ignore_changes = [push_config] }`. On first-ever tenant
  # deploys, coordinator-service doesn't exist yet at terraform-plan time, so
  # the URL can't be resolved in advance. This step runs AFTER coordinator-
  # service is deployed (and patched with peer URLs above), then writes the
  # real push endpoint into every subscription. Idempotent: re-running with
  # the same URL is a no-op for Pub/Sub.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'patch-push-sub-endpoints'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        COORD_URL=$$(gcloud run services describe coordinator-service \
          --region ${_REGION} \
          --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
          --format='value(status.url)' 2>/dev/null || echo "")
        if [ -z "$$COORD_URL" ]; then
          echo "ERROR: coordinator-service URL unresolved; cannot patch push subs"
          exit 1
        fi

        # Strip any trailing slash so the audience matches what Cloud Run mints
        # (`aud == <service URL>` with no trailing slash).
        COORD_URL=$${COORD_URL%/}

        # Push SA lives in the platform-control project alongside the topics.
        PUSH_SA=tenant-rt-pubsub-push-${_ENVIRONMENT}@tenant-${_TENANT_ID}-${_ENVIRONMENT}.iam.gserviceaccount.com

        # 8 control-plane topics (must match SUBSCRIBED_EVENTS in
        # src/events/subscriber.ts and the for_each list in pubsub_push.tf).
        TOPICS=(
          tenant-entitlement-updated
          tenant-suspended
          tenant-reactivated
          tenant-deployment-approved
          tenant-model-config-updated
          tenant-prompt-bundle-updated
          tenant-feature-flag-updated
          control-plane-events
        )

        # Per the cutover plan ("Order of operations"), runtime is deployed
        # FIRST and infra (which creates these push subs) follows. On that
        # first runtime deploy the subs don't exist yet — the patch step must
        # not fail the build. Check existence before each update; missing subs
        # are logged and skipped, so the next runtime deploy after the infra
        # apply picks them up. Idempotent: re-running with the same URL is a
        # no-op for Pub/Sub.
        MISSING=0
        PATCHED=0
        for TOPIC in "$${TOPICS[@]}"; do
          SUB=$${TOPIC}-${_ENVIRONMENT}-coordinator-push
          if ! gcloud pubsub subscriptions describe "$$SUB" \
               --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
               --format='value(name)' > /dev/null 2>&1; then
            echo "SKIP: $$SUB does not exist yet (infra apply pending). Will patch on next runtime deploy."
            MISSING=$$((MISSING + 1))
            continue
          fi
          echo "Patching $$SUB → $$COORD_URL/internal/pubsub/$$TOPIC"
          gcloud pubsub subscriptions update "$$SUB" \
            --project tenant-${_TENANT_ID}-${_ENVIRONMENT} \
            --push-endpoint "$$COORD_URL/internal/pubsub/$$TOPIC" \
            --push-auth-service-account "$$PUSH_SA" \
            --push-auth-token-audience "$$COORD_URL"
          PATCHED=$$((PATCHED + 1))
        done
        echo "patch-push-sub-endpoints: patched=$$PATCHED skipped=$$MISSING (of $${#TOPICS[@]} total)"
    waitFor:
      - patch-split-service-urls

  # Update the push-endpoint-healthcheck + dlq-drainer Job images to the
  # deploy SHA. Terraform creates these Jobs with the data-source-resolved
  # coordinator image (which can be stale by the time the next runtime
  # deploy runs); lifecycle.ignore_changes on the image attribute means
  # subsequent applies don't refresh it. Mirror of update-slack-rotator-job
  # / update-orphan-scan-job in platform-backend/cloudbuild.yaml.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-pubsub-bulletproof-jobs'
    waitFor: ['docker-push-app', 'docker-push-framer-rotate', 'patch-push-sub-endpoints']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        IMG=${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/${_SERVICE_NAME}:${SHORT_SHA}
        TENANT_PROJECT=tenant-${_TENANT_ID}-${_ENVIRONMENT}

        if gcloud run jobs describe push-endpoint-healthcheck-${_ENVIRONMENT} \
             --region=${_REGION} --project=$$TENANT_PROJECT >/dev/null 2>&1; then
          echo "Updating push-endpoint-healthcheck-${_ENVIRONMENT} → $$IMG"
          gcloud run jobs update push-endpoint-healthcheck-${_ENVIRONMENT} \
            --region=${_REGION} --project=$$TENANT_PROJECT --image=$$IMG
        else
          echo "push-endpoint-healthcheck-${_ENVIRONMENT} not found — skipping (Terraform creates it on first apply)"
        fi

        # Same SHA pump for every per-topic DLQ drainer.
        TOPICS=(
          tenant-entitlement-updated tenant-suspended tenant-reactivated
          tenant-deployment-approved tenant-model-config-updated
          tenant-prompt-bundle-updated tenant-feature-flag-updated
          control-plane-events
        )
        # ...and every per-topic DLQ replayer, which Terraform created from the
        # coordinator's image of the day and never refreshed: the registry
        # deletes any version older than 30 days that is not among the 20
        # newest, and a replayer left on that image fails "image not found"
        # the day it is needed. Same image: the coordinator runs this one.
        for TOPIC in "$${TOPICS[@]}"; do
          for JOB in pubsub-dlq-drainer-$${TOPIC}-${_ENVIRONMENT} pubsub-dlq-replayer-$${TOPIC}-${_ENVIRONMENT}; do
            if gcloud run jobs describe "$$JOB" \
                 --region=${_REGION} --project=$$TENANT_PROJECT >/dev/null 2>&1; then
              echo "Updating $$JOB → $$IMG"
              gcloud run jobs update "$$JOB" \
                --region=${_REGION} --project=$$TENANT_PROJECT --image=$$IMG
            else
              echo "$$JOB not found — skipping"
            fi
          done
        done

        # framer-secret-rotate runs quarterly from its own image, built and
        # pushed above on every build. Terraform's pin is a `latest` tag no
        # build pushes, so without this step the job is not runnable.
        FRAMER_IMG=${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/framer-secret-rotate:${SHORT_SHA}
        if gcloud run jobs describe framer-secret-rotate \
             --region=${_REGION} --project=$$TENANT_PROJECT >/dev/null 2>&1; then
          echo "Updating framer-secret-rotate → $$FRAMER_IMG"
          gcloud run jobs update framer-secret-rotate \
            --region=${_REGION} --project=$$TENANT_PROJECT --image=$$FRAMER_IMG
        else
          echo "framer-secret-rotate not found — skipping"
        fi

  # Verify every control-plane-events push subscription points at the live
  # coordinator-service and that /healthz returns 2xx. Fails the deploy if not.
  # Closes the placeholder-endpoint failure mode (Fix G).
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'verify-push-endpoints'
    waitFor: ['patch-push-sub-endpoints', 'update-pubsub-bulletproof-jobs']
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'push-endpoint-healthcheck-${_ENVIRONMENT}'
      - '--project=tenant-${_TENANT_ID}-${_ENVIRONMENT}'
      - '--region=${_REGION}'
      - '--wait'

  # Step 11: Run fault injection tests (staging only)
  # Per Section 22 Phase 3: Explicitly test fault scenarios
  - name: 'node:20-slim'
    id: 'fault-injection-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENVIRONMENT}" = "staging" ]; then
          echo "Running fault injection tests for tenant ${_TENANT_ID}..."
          export API_BASE_URL="https://${_SERVICE_NAME}-${_REGION}.run.app"
          export TENANT_ID="${_TENANT_ID}"
          npm run test:fault-injection -- --ci
        else
          echo "Skipping fault injection tests for ${_ENVIRONMENT}"
        fi
    waitFor: ['deploy-agent-service']

  # Step 12: Run validation rig (staging only)
  # Per Section 23: End-to-end workflow validation
  - name: 'node:20-slim'
    id: 'validation-rig'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENVIRONMENT}" = "staging" ]; then
          echo "Running validation rig for tenant ${_TENANT_ID} per Section 23..."
          export API_BASE_URL="https://${_SERVICE_NAME}-${_REGION}.run.app"
          export TENANT_ID="${_TENANT_ID}"
          npm run test:validation -- --ci
        else
          echo "Skipping validation rig for ${_ENVIRONMENT}"
        fi
    waitFor: ['fault-injection-tests']

  # C.1 — Post-deploy smoke against a canary tenant. Runs the harness CLI
  # against the freshly-deployed Cloud Run revision. If any scenario fails,
  # we shift traffic back to the previous revision and mark the build
  # failed so operators get paged. The image is pre-built (Dockerfile.smoke)
  # and pushed to Artifact Registry; we reference it via _SMOKE_IMAGE so
  # there's zero install latency on every deploy.
  #
  # Substitutions required:
  #   _CANARY_TENANT_ID — UUID of the prod tenant we run smoke against
  #   _CANARY_AGENT_ID  — UUID of the agent within that tenant
  #   _SMOKE_IMAGE      — Artifact Registry URL of the pre-built smoke image
  # Cloud Build doesn't natively propagate per-step exit codes via env,
  # so we use a shared file:
  #   1. Smoke step writes /workspace/smoke.exit on exit (success=0, fail!=0)
  #      via `allowFailure: true` so the build keeps going even on failure.
  #   2. Rollback step reads /workspace/smoke.exit and either no-ops (on
  #      success) or runs smoke-rollback.sh (on failure).
  #   3. Final gate step also reads /workspace/smoke.exit and exits with
  #      the smoke step's exit code so the BUILD itself is marked FAILED
  #      whenever smoke failed (otherwise allowFailure would mask it).
  - name: '${_SMOKE_IMAGE}'
    id: 'post-deploy-smoke'
    waitFor: ['validation-rig']
    entrypoint: 'bash'
    env:
      - 'TR_SERVICE_TOKEN_PROJECT=tenant-${_TENANT_ID}-${_ENVIRONMENT}'
    args:
      - '-c'
      - |
        # Skip when no canary tenant is configured (initial state /
        # disabled by an empty Terraform substitution). Write exit=0 so
        # the gate step doesn't trip.
        if [[ -z "${_CANARY_TENANT_ID}" || -z "${_CANARY_AGENT_ID}" ]]; then
          echo "post-deploy-smoke: canary tenant/agent not configured; skipping."
          echo "0" > /workspace/smoke.exit
          exit 0
        fi
        set +e
        /smoke/tools/agent-test-harness/smoke-entrypoint.sh \
          --mode=tr \
          --base=https://${_SERVICE_NAME}-${_REGION}.run.app \
          --tenant=${_CANARY_TENANT_ID} \
          --agent=${_CANARY_AGENT_ID} \
          --tag=${_SMOKE_TAGS} \
          --secret-project=tenant-${_TENANT_ID}-${_ENVIRONMENT}
        echo "$?" > /workspace/smoke.exit
    allowFailure: true

  # B3 — active deploy canary. Executes the control-project agent-diagnostics job
  # in --run mode: it drives the canary agent through its scenario set against the
  # just-deployed revision (via DIAGNOSTICS_TR_HARNESS_URL) and EXITS NONZERO on a
  # deterministic gating failure. --wait propagates that exit through the execution.
  # allowFailure so the build continues to the gate regardless; the gate + rollback
  # decide what to do with canary.exit (log-only unless _CANARY_ENFORCE=true).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'agent-canary'
    waitFor: ['post-deploy-smoke']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Skip when no canary is configured (same guard as the smoke step) — write
        # exit=0 so neither the gate nor rollback trips on an unconfigured canary.
        if [[ -z "${_CANARY_TENANT_ID}" || -z "${_CANARY_AGENT_ID}" ]]; then
          echo "agent-canary: canary tenant/agent not configured; skipping."
          echo "0" > /workspace/canary.exit
          exit 0
        fi
        # The agent-diagnostics job lives in the control project; the build SA holds
        # run.developer on it (cloud_build_updates_diagnostics). Skip cleanly if the
        # job is absent in this project (same NOT_FOUND handling as update-diagnostics-image)
        # so a not-yet-provisioned evaluator doesn't produce a spurious canary failure.
        DESCRIBE_ERR=$$(gcloud run jobs describe agent-diagnostics \
             --project YOUR_GCP_PROJECT --region ${_REGION} 2>&1 >/dev/null) || {
          if echo "$$DESCRIBE_ERR" | grep -q "NOT_FOUND"; then
            echo "agent-canary: agent-diagnostics job absent; skipping (non-gating)."
            echo "0" > /workspace/canary.exit; exit 0
          fi
          echo "agent-canary: describe failed (NOT a not-found): $$DESCRIBE_ERR"
          echo "1" > /workspace/canary.exit; exit 0
        }
        # Execute the active canary (--run overrides the job's default --harvest args)
        # and capture the job's exit code. --wait propagates the execution result.
        set +e
        gcloud run jobs execute agent-diagnostics \
          --project YOUR_GCP_PROJECT --region ${_REGION} \
          --args="^@^--run@--agents@user-created" --wait
        echo "$?" > /workspace/canary.exit
        set -e
        echo "agent-canary exit: $(cat /workspace/canary.exit)"
    allowFailure: true

  - name: '${_SMOKE_IMAGE}'
    id: 'auto-rollback-on-gate-fail'
    waitFor: ['agent-canary']
    entrypoint: 'bash'
    env:
      - 'PROJECT_ID=tenant-${_TENANT_ID}-${_ENVIRONMENT}'
      - 'REGION=${_REGION}'
      - 'SERVICE_NAME=${_SERVICE_NAME}'
    args:
      - '-c'
      - |
        SMOKE_EXIT="$(cat /workspace/smoke.exit 2>/dev/null || echo unknown)"
        CANARY_EXIT="$(cat /workspace/canary.exit 2>/dev/null || echo unknown)"
        echo "gate signals: smoke=$$SMOKE_EXIT canary=$$CANARY_EXIT enforce_canary=${_CANARY_ENFORCE}"
        # Smoke always gates. The canary gates only when _CANARY_ENFORCE=true
        # (log-only otherwise), so a live-canary hiccup can't block deploys until
        # it is observed stable and deliberately switched on.
        NEED_ROLLBACK=0
        if [[ "$$SMOKE_EXIT" != "0" ]]; then NEED_ROLLBACK=1; fi
        if [[ "${_CANARY_ENFORCE}" == "true" && "$$CANARY_EXIT" != "0" ]]; then NEED_ROLLBACK=1; fi
        if [[ "$$NEED_ROLLBACK" == "0" ]]; then
          echo "gate passed (smoke=$$SMOKE_EXIT canary=$$CANARY_EXIT); no rollback needed."
          exit 0
        fi
        echo "gate failed (smoke=$$SMOKE_EXIT canary=$$CANARY_EXIT enforce=${_CANARY_ENFORCE}); rolling back to prior revision."
        /smoke/tools/smoke-rollback.sh
    # allowFailure so gate-exit always runs even when the rollback itself fails
    # (e.g. only one revision exists yet). The gate re-surfaces the failing exit
    # as the build's terminal code, so failed-AND-rollback-failed still marks the
    # build FAILED via the gate.
    allowFailure: true

  # Final gate: re-surface the failing signal so the build is FAILED when the gate
  # tripped (otherwise allowFailure would let the whole cloudbuild report SUCCESS
  # even though the revision was just rolled back). Smoke always counts; the canary
  # counts only when _CANARY_ENFORCE=true.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'gate-exit'
    waitFor: ['auto-rollback-on-gate-fail']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SMOKE_EXIT="$(cat /workspace/smoke.exit 2>/dev/null || echo 99)"
        CANARY_EXIT="$(cat /workspace/canary.exit 2>/dev/null || echo 0)"
        echo "gate: smoke=$$SMOKE_EXIT canary=$$CANARY_EXIT enforce_canary=${_CANARY_ENFORCE}"
        FINAL=$$SMOKE_EXIT
        if [[ "${_CANARY_ENFORCE}" == "true" && "$$CANARY_EXIT" != "0" ]]; then FINAL=$$CANARY_EXIT; fi
        echo "gate terminal exit code: $$FINAL"
        exit "$$FINAL"

  # C4 — SWE external-checks smoke (NON-GATING, log-only). Runs only after the gate
  # passes (waitFor gate-exit → skipped whenever the deploy was rolled back) and only
  # when configured. It drives a code-capable software-engineer agent through the SWE
  # suite (--tag=swe) against the deployed revision, then polls the fixture repo for the
  # run's side effects (branch cut / PR open / checks green) and tears the run down. Its
  # exit is NEVER read by the gate/rollback steps above, so a SWE hiccup can neither roll
  # back nor fail the build — pure observability until the suite is proven stable and
  # deliberately promoted. The GitHub fixture token is fetched from Secret Manager by the
  # runner (--fixture-token-secret), same mechanism as the service token.
  - name: '${_SMOKE_IMAGE}'
    id: 'swe-external-checks'
    waitFor: ['gate-exit']
    entrypoint: 'bash'
    env:
      - 'BUILD_ID=${BUILD_ID}'
    args:
      - '-c'
      - |
        # DORMANT unless the fixture repo, a code-capable agent, and the harness base URL are all set.
        if [[ -z "${_SWE_FIXTURE_REPO}" || -z "${_SWE_AGENT_ID}" || -z "${_SWE_HARNESS_BASE}" ]]; then
          echo "swe-external-checks: fixture repo / swe agent / harness base not configured; skipping (non-gating)."
          exit 0
        fi
        SWE_TENANT="${_SWE_TENANT_ID}"
        if [[ -z "$$SWE_TENANT" ]]; then SWE_TENANT="${_CANARY_TENANT_ID}"; fi
        if [[ -z "$$SWE_TENANT" ]]; then
          echo "swe-external-checks: no tenant (_SWE_TENANT_ID and _CANARY_TENANT_ID both empty); skipping."
          exit 0
        fi
        set +e
        /smoke/tools/agent-test-harness/smoke-entrypoint.sh \
          --mode=tr \
          --oidc \
          --base=${_SWE_HARNESS_BASE} \
          --tenant=$$SWE_TENANT \
          --agent=${_SWE_AGENT_ID} \
          --tag=swe \
          --external-checks=github \
          --fixture-repo=${_SWE_FIXTURE_REPO} \
          --fixture-token-secret=${_SWE_FIXTURE_TOKEN_SECRET} \
          --secret-project=tenant-${_TENANT_ID}-${_ENVIRONMENT}
        echo "swe-external-checks exit: $?  (non-gating — not consumed by the gate)"
    # Non-gating: its exit is never read by auto-rollback-on-gate-fail or gate-exit.
    allowFailure: true

  # Keep the agent-diagnostics evaluator job on the image that just deployed, so a
  # scheduled or manual run exercises current code instead of a stale build. The job
  # may not exist in every tenant project: a genuine NOT_FOUND is a skip, but any other
  # describe failure (IAM, API, transient) is fatal so a broken evaluator can't hide.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-diagnostics-image'
    waitFor: ['docker-push-app']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        DESCRIBE_ERR=$$(gcloud run jobs describe agent-diagnostics \
             --project YOUR_GCP_PROJECT --region ${_REGION} 2>&1 >/dev/null) || {
          if echo "$$DESCRIBE_ERR" | grep -q "NOT_FOUND"; then
            echo "agent-diagnostics job absent; skipping image update"; exit 0
          fi
          echo "describe failed (NOT a not-found): $$DESCRIBE_ERR"; exit 1
        }
        gcloud run jobs update agent-diagnostics \
          --image ${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/tenant-runtime:${SHORT_SHA} \
          --project YOUR_GCP_PROJECT --region ${_REGION}

  # No deploy-coupled canary yet — the evaluator runs on schedule or on demand
  # (see platform-ci main.tf); the step above only keeps its image current.

images:
  - '${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/${_SERVICE_NAME}-migrate:${SHORT_SHA}'

# 5400s (90min) is too short — the test step alone takes ~70min on a cold
# runner, plus install (~4m), docker-build-app (~12m), and docker-build-migrate
# (~10m) eat the remaining budget before the deploy steps fire.
# 7200s (2h) is also tight: tests run closer to ~90min on the standard
# runner, which can time a build out before the migrate step fires.
# 10800s (3h) gives the post-test pipeline
# (docker push + migrate + backfill + deploy + verify) reliable headroom.
timeout: '10800s'
