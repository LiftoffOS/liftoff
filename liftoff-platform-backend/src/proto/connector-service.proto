syntax = "proto3";

package liftoff.connector.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/liftoffos/liftoff-proto/connector/v1;connectorv1";
option java_multiple_files = true;
option java_outer_classname = "ConnectorServiceProto";
option java_package = "com.liftoffos.connector.v1";

// ConnectorService — executes connector operations on behalf of tenant agents.
// Extracted from tenant-runtime.
// This service owns all outbound connector I/O: credential resolution, rate limiting,
// retry logic, and compensation (rollback) bookkeeping.
//
// NOTE: This file is the canonical proto scaffold. It will be moved to the
// liftoff-proto when that repo is created. The buf toolchain
// (buf.yaml, buf.gen.yaml) will be added at that point.
service ConnectorService {
  // Execute a single connector operation synchronously.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // Execute multiple operations in a single RPC round-trip (fan-out).
  rpc ExecuteBatch(ExecuteBatchRequest) returns (ExecuteBatchResponse);

  // Warm the credential cache and connection pool for a connector.
  // Called proactively before an agent starts a workflow to reduce first-call latency.
  rpc Warm(WarmRequest) returns (WarmResponse);

  // Retrieve resolved (decrypted + refreshed) credentials for a connector.
  // Used by agents that need to hand credentials to a sub-process or external call.
  rpc GetCredentials(GetCredentialsRequest) returns (GetCredentialsResponse);
}

// ─── TenantContext ────────────────────────────────────────────────────────────

// TenantContext is minted by Platform Backend as a short-lived signed JWT
// and forwarded by tenant-runtime with every connector call.
// The Connector Service MUST derive tenant_id from the verified JWT claim —
// never from a separate request-body field — per Phase 4A security requirement.
message TenantContext {
  string tenant_id = 1; // Extracted from verified JWT, not caller-supplied
  string agent_id = 2; // Agent making the call
  string invocation_id = 3; // Unique per agent invocation
  string signed_jwt = 4; // Short-lived JWT signed by Platform Backend OIDC key (≤5 min TTL)
}

// ─── Execute ─────────────────────────────────────────────────────────────────

message ExecuteRequest {
  // Tenant context (replaces flat tenant_id; agent identity derived from JWT).
  TenantContext tenant_context = 1;

  // Connector type (e.g. "google_mail", "slack", "perplexity").
  string connector_type = 2;

  // MCP function name (e.g. "send_email", "list_tickets")
  string function_name = 3;

  // Function parameters as a JSON object (tool-call arguments)
  google.protobuf.Struct parameters = 4;

  // Correlation ID for distributed tracing.
  string correlation_id = 5;

  // Whether to record this operation for compensation (rollback) purposes.
  bool record_for_compensation = 6;
}

message ExecuteResponse {
  // Whether the operation succeeded.
  bool success = 1;

  // JSON-encoded result data.
  bytes data = 2;

  // External entity ID returned by the connector (for creates).
  string entity_id = 3;

  // Opaque version token for optimistic concurrency control.
  string version_token = 4;

  // Human-readable error message if success is false.
  string error = 5;

  // Structured error code for programmatic handling.
  ErrorCode error_code = 6;
}

// ─── ExecuteBatch ─────────────────────────────────────────────────────────────

message BatchCall {
  string call_id = 1; // Client-assigned ID for correlating results
  string function_name = 2;
  string connector_type = 3;
  google.protobuf.Struct parameters = 4;
}

message ExecuteBatchRequest {
  // Tenant context (replaces flat tenant_id; agent identity derived from JWT).
  TenantContext tenant_context = 1;

  // Ordered list of calls to execute.
  repeated BatchCall calls = 2;

  // If true, stop on first failure. Default: false (run all, collect errors).
  bool stop_on_first_error = 3;

  // Correlation ID for the batch.
  string correlation_id = 4;
}

message ExecuteBatchResponse {
  // Results in the same order as the request operations.
  repeated ExecuteResponse results = 1;

  // True only if all operations succeeded.
  bool all_succeeded = 2;
}

// ─── Warm ─────────────────────────────────────────────────────────────────────

message WarmRequest {
  TenantContext tenant_context = 1;
  repeated string connector_types = 2;
  string correlation_id = 3;
}

message WarmStatus {
  string connector_type = 1;
  bool ready = 2;
  string error = 3; // empty if ready
}

message WarmResponse {
  repeated WarmStatus statuses = 1;
}

// ─── GetCredentials ───────────────────────────────────────────────────────────

message GetCredentialsRequest {
  TenantContext tenant_context = 1;
  string connector_type = 2;
  string correlation_id = 3;
}

message GetCredentialsResponse {
  bool success = 1;

  // Sanitized credentials as a JSON object. Raw tokens are NEVER returned over the wire.
  // This map contains only safe metadata needed by callers (e.g. "instance_url", "scope").
  // Actual token usage happens within the Connector Service only.
  google.protobuf.Struct credentials = 2;

  string error = 3;
}

// ─── Shared types ─────────────────────────────────────────────────────────────

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_AUTH_FAILED = 1;
  ERROR_CODE_RATE_LIMITED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_VALIDATION = 4;
  ERROR_CODE_CONNECTOR_UNAVAILABLE = 5;
  ERROR_CODE_TIMEOUT = 6;
  ERROR_CODE_INTERNAL = 7;
}
