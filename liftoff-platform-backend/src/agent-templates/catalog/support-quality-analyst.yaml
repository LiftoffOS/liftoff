requiredConnectors:
  - id: req-support-ticketing
    capability: support_ticketing
    role: data_source
    description: The helpdesk whose resolved tickets are scored
  - id: req-documents
    capability: documents
    role: tool
    description: Where the checklist, the weekly report and the scores live
    objects:
      - id: working-folder
        kind: destination
        direction: write
        required: true
        label: Where this team should save its work
        fallback: your working folder

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post the weekly summary to the support lead
    objects:
      - id: lead-channel
        kind: channel
        direction: write
        required: false
        label: Where the weekly quality summary should be posted
        fallback: the support lead's channel
    prose:
      whenBound: post the summary to {{pick:lead-channel}}
      whenUnbound: open a chat thread carrying the summary

defaultAgentType: agent
producesDocument: true
requiresIdempotencyCheck: true
comparesWithLastRun: true
defaultMemoryScope:
  readableLayers:
    - global
    - role
  writableLayers:
    - role
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1"
