requiredConnectors:
  - id: req-crm
    capability: crm
    role: tool
    description: Target accounts in, activity and sequence status out
  - id: req-email
    capability: email_communication
    role: tool
    description: Send sequences and replies, and read what comes back

optionalConnectors:
  - id: opt-calendar
    capability: calendar
    role: tool
    description: Schedule AE discovery calls directly when a prospect confirms interest
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post qualified-reply alerts and AE hand-off notifications to the sales channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where qualified replies and AE hand-offs should be posted"
        fallback: your sales channel
    prose:
      whenBound: "post a notification to {{pick:alert-channel}}"
      whenUnbound: "record the gap on the CRM account"

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [individual, role, conversation]
  writableLayers: [individual, role, conversation]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1-5"