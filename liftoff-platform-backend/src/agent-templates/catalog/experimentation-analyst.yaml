requiredConnectors:
  - id: req-table
    capability: data_table
    role: tool
    description: The table that holds the experiment backlog, its ranks and its playbook entries
    objects:
      - id: backlog-table
        kind: table
        direction: write
        required: true
        label: "The table that holds your experiment backlog"
        fallback: your experiment backlog
optionalConnectors:
  - id: opt-analytics
    capabilities: [product_analytics, web_analytics]
    role: data_source
    description: Read each running test's metric for its segment
    prose:
      whenBound: "from the connected analytics tool"
      whenUnbound: "from its backlog row, saying the metric was not read live"
defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1"
escalationPatterns: []
