requiredConnectors:
  - id: req-document-source
    capabilities: [cloud_storage, documents]
    role: tool
    description: Read source documents from your connected storage or documents workspace, and save the output there

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post the memo and flagged covenants to your legal channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where the memo and flagged covenants should be posted"
        fallback: your legal channel
    prose:
      whenBound: "post to {{pick:alert-channel}} that it is ready"
      whenUnbound: "open a chat thread saying it is ready"
  - id: opt-email
    capability: email_communication
    role: tool
    description: Email the completed memo to legal and treasury

defaultAgentType: agent
# The deliverable is a file. With a documents or cloud-storage connector bound
# the graph must write it there; with neither, the obligation lapses.
producesDocument: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: file.created
  # A contract arrives as a Drive file or as a Notion page, and this team reads
  # either. Each bound connector delivers only the topic it emits.
  eventTopics: [file.created, document.created]

# The 21 topics the description sells, as a contract rather than a paragraph.
#
# The memo is a narrative and the Analyst's output is a grid, but the EXTRACTION
# underneath is the same shape: one answer per topic, per document. Declaring it
# here is what compiles the "21 topic areas" promise into a step; without it a
# memo missing five topics reads exactly like one that has them all.
extractionSchema:
  - index: 0
    name: Lenders
    format: text
    prompt: "Who are the lenders or members of the lender syndicate? Give each full legal name and role, such as mandated lead arranger, original lender, or agent bank."
  - index: 1
    name: Borrowers
    format: text
    prompt: "Who are the borrowers? Give each full legal name and jurisdiction of incorporation."
  - index: 2
    name: Guarantors
    format: text
    prompt: "Who are the guarantors? Give each full legal name and the scope of its guarantee obligation."
  - index: 3
    name: Other Parties
    format: text
    prompt: "Which other material parties are named, such as facility agent, security agent, hedge counterparties or issuing bank, and what is each one's role?"
  - index: 4
    name: Date of Agreement
    format: date
    prompt: "What is the date of the credit agreement?"
  - index: 5
    name: Facilities
    format: bulleted_list
    prompt: "Which facilities are available, such as Revolving Credit Facility, Term Loan A, Term Loan B? For each, give the facility type, tranche name, and any key structural features."
  - index: 6
    name: Amount
    format: monetary_amount
    prompt: "What is the total committed amount across all facilities, in what currency, and how does it break down by tranche where applicable?"
  - index: 7
    name: Purpose
    format: text
    prompt: "What is the stated purpose for which borrowings may be used, and what restrictions apply to the use of proceeds?"
  - index: 8
    name: Interest
    format: text
    prompt: "What is the applicable reference rate, such as SOFR, EURIBOR or base rate? State the margin, any margin ratchet mechanism, and how interest periods are structured."
  - index: 9
    name: Commitment Fee
    format: text
    prompt: "What commitment or utilisation fees apply? State the rate, how they are calculated, and the basis, such as undrawn commitment or average utilisation."
  - index: 10
    name: Repayment Schedule
    format: text
    prompt: "What is the repayment profile for each facility? State whether repayment is by scheduled instalments or bullet, and give the repayment dates and amounts."
  - index: 11
    name: Maturity
    format: text
    prompt: "What is the final maturity date for each facility?"
  - index: 12
    name: Security
    format: bulleted_list
    prompt: "Which classes of security are granted or required, such as share pledges, fixed and floating charges, real estate mortgages or account pledges, and over which assets or entities is security taken?"
  - index: 13
    name: Guarantees
    format: text
    prompt: "What guarantee obligations apply, who gives them, what is their scope, and what limitations apply, such as up-stream guarantee limitations or a guarantor coverage test?"
  - index: 14
    name: Financial Covenants
    format: bulleted_list
    prompt: "What financial covenants apply? For each, give the metric such as leverage ratio, interest cover or cashflow cover, the applicable test, the testing frequency, and any equity cure rights."
  - index: 15
    name: Events of Default
    format: bulleted_list
    prompt: "What events of default are specified? For each, note any grace period, materiality threshold, or cross-default provision."
  - index: 16
    name: Assignment
    format: text
    prompt: "What restrictions or permissions apply to assignment or transfer, such as white or black lists, borrower consent for lender transfers, and restrictions on borrower assignment?"
  - index: 17
    name: Change of Control
    format: text
    prompt: "What constitutes a change of control, what obligations does it trigger such as mandatory prepayment, cancellation or lender consent, and is there a cure period?"
  - index: 18
    name: Prepayment Fee
    format: text
    prompt: "What prepayment fees, make-whole premiums or soft-call protections apply? State the fee, the period during which it applies, and any exceptions such as prepayment from insurance proceeds or asset disposals."
  - index: 19
    name: Governing Law
    format: text
    prompt: "What is the governing law of the agreement?"
  - index: 20
    name: Dispute Resolution
    format: text
    prompt: "Do disputes go to litigation or arbitration? State the chosen forum or seat and any submission to jurisdiction provisions."
