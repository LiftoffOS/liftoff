      rubric: >-
        The Interest and Financial Covenants sections include and describe the Schedule 4 ratchet
        figures rather than referring the reader to the schedule.
  # A non-English jurisdiction: extract everything and note that local law input may be required.
  - id: governed-by-a-non-english-jurisdiction-extract-everything
    turns:
      - |-
        FACILITY AGREEMENT
        Lenders: Northgate Bank plc and Selwyn Capital LLP. Borrower: Marlow Foods Ltd. Guarantors: Marlow Group Holdings Ltd. Agent: Northgate Bank plc. Dated 20 February 2026.

