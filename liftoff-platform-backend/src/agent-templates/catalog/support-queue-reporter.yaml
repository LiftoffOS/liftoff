requiredConnectors:
  - id: req-support-ticketing
    capability: support_ticketing
    role: data_source
    description: Read open tickets, status, priority, assignee, last reply time

optionalConnectors:
  - id: opt-backlog-sheet
    capability: data_table
    role: tool
    description: Append each digest as a row, and read yesterday's back, so the queue can be charted over time
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post the daily backlog digest and breach alerts to support
    objects:
      - id: digest-channel
        kind: channel
        direction: write
        required: false
        label: "Where the daily backlog digest and breach alerts should be posted"
        fallback: your support channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1-5"
  # The morning digest is the 9am run. The same-day breach alert is a second
  # thing on a second clock: nothing arrives mid-afternoon to trigger it, and a
  # promise to alert "during the day" with only a morning cron behind it is an
  # alert that never comes.
  companionCrons:
    - label: same-day-breach-check
      cronExpr: "0 12,15 * * 1-5"
      objective: "Check open tickets for an SLA-breach spike against the prior-day baseline in the running backlog sheet. Where breaches have risen sharply, post the alert to your digest channel now with the breach count, the affected tickets and the change against baseline. Take no action on the tickets. Where they have not, do nothing and wait for the morning digest."