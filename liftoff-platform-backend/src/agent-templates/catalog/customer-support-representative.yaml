# Capability tri-state. `absent` is a fact about the PLATFORM, not about this
# tenant's bindings: there is no SMS or telephony connector at all, and there is
# no "connect one later". Declared so the agent is told plainly rather than
# offering to text a customer and then failing, or promising to try again.
#
# Verified rather than assumed: connectorTypesForRequirement returns zero
# connector types for both.
capabilities:
  sms: absent
  telephony: absent
  support_helpdesk: live
  team_chat: unwired
  documents: unwired
  cloud_storage: unwired
  project_management: unwired
  crm: unwired

requiredConnectors:
  - id: req-support-channel
    capability: support_helpdesk
    role: tool
    description: Your primary support channel for receiving and responding to customer inquiries

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post escalation alerts and bug hand-offs to your support channel
    objects:
      # One channel, because a binding holds one. The escalations and the bug
      # hand-offs both land here rather than one going to a second channel this
      # team would have to find by name on every run.
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where escalations and bug hand-offs should be posted"
        fallback: your support channel
    prose:
      whenBound: "post to {{pick:alert-channel}}"
      whenUnbound: "carry, in the acknowledgement itself,"
  - id: opt-documents
    capability: documents
    role: data_source
    description: Knowledge base articles and resolution procedures
    objects:
      # A folder, not a file: which article answers the ticket is the job.
      # Naming the library is what stops the search starting from the whole
      # drive, where an outdated copy is as findable as the live article.
      - id: knowledge-base
        kind: folder
        direction: read
        required: false
        label: "Where your knowledge base articles live"
        fallback: your knowledge base
    prose:
      whenBound: "search {{pick:knowledge-base}}"
      whenUnbound: "search the support material you can reach"
  - id: opt-cloud-storage
    capability: cloud_storage
    role: data_source
    description: Search files and documents in connected cloud drives
  - id: opt-project-management
    capability: project_management
    role: tool
    description: File bug issues and feature requests linked back to the support thread
  - id: opt-crm
    capability: crm
    role: data_source
    description: Read the account, its subscription and its recent invoices behind a billing question

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [role, global, conversation]
  writableLayers: [individual, conversation]
defaultTriggerConfig:
  type: event
  eventTopic: email.received