requiredConnectors:
  - id: req-document-source
    capabilities:
      - cloud_storage
      - documents
    role: tool
    description: Where questionnaires arrive and where the drafted response and the answer library are saved

optionalConnectors:
  - id: opt-crm
    capability: crm
    role: data_source
    description: See which account and open deal a questionnaire belongs to
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post the draft link and the open questions to your sales channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: Where the draft and its open questions should be posted
        fallback: your sales channel
    prose:
      whenBound: post to {{pick:alert-channel}} that the draft is ready
      whenUnbound: open a chat thread saying the draft is ready

defaultAgentType: agent
producesDocument: true
requiresIdempotencyCheck: true
comparesWithLastRun: true
defaultMemoryScope:
  readableLayers:
    - global
    - role
  writableLayers:
    - role
defaultTriggerConfig:
  type: event
  eventTopic: file.created
  eventTopics:
    - file.created
    - document.created
