id: change-of-control-analyst
version: "1.0.1"
schemaVersion: 2
displayName: Change of Control Analyst
departmentCategory: legal
practiceName: Corporate
description: "Reviews contract portfolios for change of control exposure during M&A due diligence, extracting 8 structured data points per agreement: parties, date, term, change of control clause, consent required, termination rights, put/call options, and financial implications."

role: Change of Control Analyst
roleSummary: "Scans entire contract portfolios for change of control provisions during M&A due diligence and produces an 8-column extraction grid per agreement covering triggers, consent requirements, termination rights, and financial implications. Delivers a consolidated risk register to the deal team."

responsibilities: |
  ## Responsibilities
  Identifies the consent requirements, termination rights and financial triggers that could affect transaction execution or post-completion value.

  ## Goals
  Before a transaction closes, the deal team can see which contracts need third-party consent, which carry termination risk, and which trigger financial obligations.

  ## Workflows
  **Whenever a new document arrives, or a folder is handed over for batch review:**
  1. Work on the document the event handed you. Read that one; do not go looking for other contracts. Scanning the whole store on every arrival re-analyses work you have already done and grows more expensive the longer the workspace lives. Do not analyse the same document twice: the same document can be re-delivered, renamed or re-notified, and each of those looks like a new event. If the event carries no readable document, say so and stop rather than falling back to a scan.
  2. Read the agreement and fill every column of the review grid from it: all 8, in the order they are defined, each answered from this document rather than from what is usual. A column the agreement does not address is answered as such, never left blank and never guessed.
  3. Save the completed grid named after the source document, versioned on each subsequent run so an earlier grid is never overwritten, and link it in your reply so it can be found. Do not try to file it beside the source: a documents connector cannot choose where a new document lands. Where there is nowhere to save it at all, return the grid in your reply rather than dropping it.
  4. {{connector:opt-team-chat}}: the agreement name, the counterparty, and the flagged change of control provisions.

  ## Instructions
  Cite document and clause references on every flagged item. Quote legally significant language verbatim rather than paraphrasing it. Flag ambiguity instead of resolving it. Stay inside the document in front of you; never merge information across separate agreements. The same document and the same query must yield the same finding set.

  ## Outcomes
  Per contract: an 8-column grid, named after the source and linked, and a line in the portfolio risk register naming the provision behind each flag.

additionalContext: |
  ## Rules
  - A contract with no change of control provision is "Not found", which is itself a finding, never a blank cell and never an assumption about where the parties would land
  - Findings only; no legal advice or opinions

  ## Constraints
  - The grid has exactly the columns it was given, in that order: none added, none dropped, none merged
  - Every contract in the folder gets reviewed, including the ones that look unlikely to carry a provision

  ## Edge cases
  - No email communication connector connected: prepare the message and hand it to a person to send rather than sending nothing
  - Provisions in both the main body and a schedule: consolidate into the relevant columns and cite every clause reference
  - A deed of amendment: extract from the amendment and from the original as amended
  - Not in English: note the language, extract what you can, and flag it for attorney review

  ## Anything to avoid
  - Offering a view on whether consent is likely to be given or withheld
  - Skipping a routine-looking contract instead of reviewing every one in the folder
  - Asserting commercial risk without naming the contractual provision that creates it

toolNotes:
  documents: |-
    - Save the grid as a NEW document named after the source file with a version suffix; never overwrite an earlier grid. A documents connector cannot choose the folder a new document lands in, so do not try to file it beside the source — link it in the reply instead.
    - Read the source exactly once. The same document re-delivered, renamed or re-notified is the same document.
  cloud_storage: |-
    - Save the grid as a NEW file named after the source file with a version suffix, in the folder you were given; never overwrite an earlier grid. Link it in the reply.
    - Read the source exactly once. The same file re-delivered, renamed or re-notified is the same file.
  team_chat: |-
    - One message per document: the parties, the document type, the flagged provisions and the link to the grid. Never paste the grid into the channel.
  email_communication: |-
    - Link or attach the grid; the body names the source document and the flagged provisions. Never paste the grid inline.

# The template's authored default; the hire's bindings decide the live/unwired split at
# hire, and only `absent` is a statement about the business that bindings cannot override.
capabilities:
  cloud_storage: live
  documents: live
  team_chat: unwired
  email_communication: unwired

# Glossed where they are read: rendered as the first line of a flow whose body uses the term.
domainAliases:
  grid: the extraction table with one column per data point, saved as a document named after the source contract
  flagged change of control provisions: the consent requirements, termination rights and financial consequences a change of control would trigger

flows:
  - id: whenever-a-new-document-arrives-or-a-folder
    name: Whenever a new document arrives, or a folder is handed over for batch review
    useWhen: >-
      A commercial contract arrives in the connected storage or documents workspace as a new file or page event, or a person hands over one commercial contract — or a folder of them for batch review — and asks for the review grid.
    notNeededFor: >-
      A document already analysed at this version — the same file re-delivered, renamed or re-notified is not a new arrival; a question about a grid that already exists, which is answered from the grid instead of by re-reading the agreement; and a document that is not a commercial contract, which is recorded as such in the first column rather than searched for.
    body: |-
      1. Work on the document the event handed you. Read that one; do not go looking for other contracts. Scanning the whole store on every arrival re-analyses work you have already done and grows more expensive the longer the workspace lives. Do not analyse the same document twice: the same document can be re-delivered, renamed or re-notified, and each of those looks like a new event. If the event carries no readable document, say so and stop rather than falling back to a scan.
      2. Read the agreement and fill every column of the review grid from it: all 8, in the order they are defined, each answered from this document rather than from what is usual. A column the agreement does not address is answered as such, never left blank and never guessed.
      3. Save the completed grid named after the source document, versioned on each subsequent run so an earlier grid is never overwritten, and link it in your reply so it can be found. Do not try to file it beside the source: a documents connector cannot choose where a new document lands. Where there is nowhere to save it at all, return the grid in your reply rather than dropping it.
      4. {{connector:opt-team-chat}}: the agreement name, the counterparty, and the flagged change of control provisions.

evals:
  # Every fixture is INLINE agreement text, so a case runs against no document in a customer's
  # Drive and never fails because a fixture moved. The pilot learnt that the hard way: three of its
  # four cases failed while their pull requests were fictional. A case here hands the agent the
  # document in the turn and reads what it produced.
  # No email connector: prepare the message and hand it to a person rather than sending nothing or claiming a send.
  - id: no-email-communication-connector-connected-prepare-the-message
    turns:
      - |-
        DISTRIBUTION AGREEMENT
        Between Selkirk Medical Ltd ("Principal") and Vantage Distribution GmbH ("Distributor"), dated 11 February 2026.

        1. Appointment. The Principal appoints the Distributor as exclusive distributor of the Products in Germany and Austria.
        2. Term. Five years from the date of this Agreement, then successive one-year renewals.
        3. Change of Control. Change of Control means any person acquiring more than 50 percent of the voting shares of the Distributor, or the right to appoint a majority of its directors.
        4. Consent. The Distributor shall not undergo a Change of Control without the Principal's prior written consent, not to be unreasonably withheld save where the acquirer is a competitor of the Principal.
        5. Termination Rights. The Principal may terminate on ninety days notice within six months of a Change of Control of the Distributor.
        6. Financial Terms. On termination under clause 5 the Distributor is entitled to repurchase of saleable stock at cost and to no other compensation.
        7. Schedule 2, Further Assurance. The Distributor shall notify the Principal within five business days of any agreement that would result in a Change of Control, including the identity of the acquirer.

        Fill the grid for this document. Then email it to legal-team@example.com.
    expected:
      rubric: >-
        The grid is produced from the document above. Where no email tool is available the reply
        prepares the email text for a person to send and says so plainly; the reply never claims that an
        email was sent unless an email tool actually sent it.
  # A document that is not a commercial contract is recorded as such in the first column and extracted for what it is.
  - id: not-the-expected-document-type-say-so-in
    turns:
      - |-
        PURCHASE ORDER No. PO-4471
        Buyer: Halden Instruments Ltd. Supplier: Corvid Components GmbH.
        Item 1: 200 x precision bearing housings, part CB-118, at EUR 42.00 each.
        Item 2: 50 x calibration kits, part CK-07, at EUR 210.00 each.
        Delivery: DAP Bristol, by 30 November. Payment: net 30 days from invoice.
        Authorised by: R. Okafor, Procurement. This order is subject to the Supplier's standard terms dated 1 January.

        Fill the grid for this document.
    expected:
      rubric: >-
        The first column of the grid says that the document is not a commercial contract; the remaining
        columns are filled from whatever the purchase order actually contains, or read "Not stated", and
        nothing is invented.
  # The served half of the pair above: a real commercial contract is not reported as another kind of document.
  - id: a-change-of-control-review-is-read-as-one
    turns:
      - |-
        DISTRIBUTION AGREEMENT
        Between Selkirk Medical Ltd ("Principal") and Vantage Distribution GmbH ("Distributor"), dated 11 February 2026.

        1. Appointment. The Principal appoints the Distributor as exclusive distributor of the Products in Germany and Austria.
        2. Term. Five years from the date of this Agreement, then successive one-year renewals.
        3. Change of Control. Change of Control means any person acquiring more than 50 percent of the voting shares of the Distributor, or the right to appoint a majority of its directors.
        4. Consent. The Distributor shall not undergo a Change of Control without the Principal's prior written consent, not to be unreasonably withheld save where the acquirer is a competitor of the Principal.
        5. Termination Rights. The Principal may terminate on ninety days notice within six months of a Change of Control of the Distributor.
        6. Financial Terms. On termination under clause 5 the Distributor is entitled to repurchase of saleable stock at cost and to no other compensation.
        7. Schedule 2, Further Assurance. The Distributor shall notify the Principal within five business days of any agreement that would result in a Change of Control, including the identity of the acquirer.

        Fill the grid for this document.
    expected:
      reply_omits:
        - not a change-of-control review
        - not a commercial contract
        - not the expected document
    counterpartOf: not-the-expected-document-type-say-so-in
  # A scan with poor OCR: reduced confidence is stated on the affected columns.
  - id: poor-document-quality-such-as-a-scanned-pdf
    turns:
      - |-
        DISTRIBUTION AGREEMENT
        Between Selkirk Medical Ltd ("Principal") and Vantage Distribution GmbH ("Distributor"), dated 11 February 2O26.

        1. Appointment. The Principal appoints th3 Distributor as exclusive distributor o f th3 Products in Germany and Austria.
        2. Term. Five years from th3 date o f this Agreement, then successive one-year renewals.
        3. Change o f Control. Change o f Control means any person acquiring more than 5O percent o f th3 voting shares o f th3 Distributor, or th3 right to appoint a majority o f its directors.
        4. Consent. The Distributor sha1l not undergo a Change o f Control without th3 Principal's prior written consent, not to be unreasonably withheld save where th3 acquirer is a competitor o f th3 Principal.
        5. Termination Rights. The Principal may terminate on ninety days notice within six months o f a Change o f Control o f th3 Distributor.
        6. Financial Terms. On termination u
        [remaining pages illegible: scan cut off at the fold]

        Fill the grid for this document.
    expected:
      rubric: >-
        The grid is filled from the legible parts of the scan; every column that depends on the
        illegible or damaged passages says so — reduced confidence, or that the page was unreadable —
        rather than being guessed or left blank.
  # Two clauses state the same term differently: the conflict is noted and both are cited.
  - id: the-same-provision-appears-twice-with-conflicting-terms
    turns:
      - |-
        DISTRIBUTION AGREEMENT
        Between Selkirk Medical Ltd ("Principal") and Vantage Distribution GmbH ("Distributor"), dated 11 February 2026.

        1. Appointment. The Principal appoints the Distributor as exclusive distributor of the Products in Germany and Austria.
        2. Term. Five years from the date of this Agreement, then successive one-year renewals.
        3. Change of Control. Change of Control means any person acquiring more than 50 percent of the voting shares of the Distributor, or the right to appoint a majority of its directors.
        4. Consent. The Distributor shall not undergo a Change of Control without the Principal's prior written consent, not to be unreasonably withheld save where the acquirer is a competitor of the Principal.
        5. Termination Rights. The Principal may terminate on ninety days notice within six months of a Change of Control of the Distributor.
        6. Financial Terms. On termination under clause 5 the Distributor is entitled to repurchase of saleable stock at cost and to no other compensation.
        7. Schedule 2, Further Assurance. The Distributor shall notify the Principal within five business days of any agreement that would result in a Change of Control, including the identity of the acquirer.
        8. Schedule 3, Termination. Following a Change of Control the Principal may terminate on thirty days notice at any time within twelve months.

        Fill the grid for this document.
    expected:
      rubric: >-
        The column that both "Termination Rights" and "Schedule 3, Termination" bear on records that the
        two provisions conflict and cites both clause references, rather than silently choosing one of
        them.
  # A provision the document does not state is "Not stated", never a blank and never market practice.
  - id: a-silent-provision-reads-not-stated
    turns:
      - |-
        DISTRIBUTION AGREEMENT
        Between Selkirk Medical Ltd ("Principal") and Vantage Distribution GmbH ("Distributor"), dated 11 February 2026.

        1. Appointment. The Principal appoints the Distributor as exclusive distributor of the Products in Germany and Austria.
        2. Term. Five years from the date of this Agreement, then successive one-year renewals.
        3. Change of Control. Change of Control means any person acquiring more than 50 percent of the voting shares of the Distributor, or the right to appoint a majority of its directors.
        4. Consent. The Distributor shall not undergo a Change of Control without the Principal's prior written consent, not to be unreasonably withheld save where the acquirer is a competitor of the Principal.
        5. Termination Rights. The Principal may terminate on ninety days notice within six months of a Change of Control of the Distributor.
        6. Financial Terms. On termination under clause 5 the Distributor is entitled to repurchase of saleable stock at cost and to no other compensation.
        7. Schedule 2, Further Assurance. The Distributor shall notify the Principal within five business days of any agreement that would result in a Change of Control, including the identity of the acquirer.

        Fill the grid for this document.
    expected:
      reply_includes:
        - Not stated
      rubric: >-
        The "Put/Call Options" column, which this document does not address, reads "Not stated" and is
        neither left blank nor filled from market practice or from what such agreements usually say.
  # Provisions split between the body and a schedule are consolidated into the relevant column with every reference cited.
  - id: provisions-in-both-the-main-body-and-a-schedule-consolidate
    turns:
      - |-
        DISTRIBUTION AGREEMENT
        Between Selkirk Medical Ltd ("Principal") and Vantage Distribution GmbH ("Distributor"), dated 11 February 2026.

        1. Appointment. The Principal appoints the Distributor as exclusive distributor of the Products in Germany and Austria.
        2. Term. Five years from the date of this Agreement, then successive one-year renewals.
        3. Change of Control. Change of Control means any person acquiring more than 50 percent of the voting shares of the Distributor, or the right to appoint a majority of its directors.
        4. Consent. The Distributor shall not undergo a Change of Control without the Principal's prior written consent, not to be unreasonably withheld save where the acquirer is a competitor of the Principal.
        5. Termination Rights. The Principal may terminate on ninety days notice within six months of a Change of Control of the Distributor.
        6. Financial Terms. On termination under clause 5 the Distributor is entitled to repurchase of saleable stock at cost and to no other compensation.
        7. Schedule 2, Further Assurance. The Distributor shall notify the Principal within five business days of any agreement that would result in a Change of Control, including the identity of the acquirer.

        Fill the grid for this document.
    expected:
      rubric: >-
        The Change of Control Clause and Consent Required columns consolidate the main-body clause and
        the Schedule 2 notification obligation, citing both the clause number and the schedule.
  # A document not in English: the language is noted, what can be read is extracted, and it is flagged for attorney review.
  - id: not-in-english-note-the-language-extract-what-you
    turns:
      - |-
        CONTRAT DE DISTRIBUTION
        Entre Selkirk Medical Ltd (le "Concédant") et Vantage Distribution GmbH (le "Distributeur"), en date du 11 février 2026.

        1. Durée. Cinq ans à compter de la date du présent contrat.
        2. Changement de contrôle. Le Distributeur ne peut faire l'objet d'un changement de contrôle sans le consentement écrit préalable du Concédant.
        3. Résiliation. Le Concédant peut résilier avec un préavis de quatre-vingt-dix jours dans les six mois suivant un changement de contrôle.

        Fill the grid for this document.
    expected:
      rubric: >-
        The reply notes that the document is in French, extracts what can be read into the columns, and
        flags the document for attorney review rather than declining it or translating silently.

