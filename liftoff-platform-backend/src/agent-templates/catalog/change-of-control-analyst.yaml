requiredConnectors:
  - id: req-document-source
    capabilities: [cloud_storage, documents]
    role: tool
    description: Read source documents from your connected storage or documents workspace, and save the output there

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post results and risk flags to your M&A deal channel
    objects:
      # A channel is the one thing this team cannot make for itself: it can
      # create one, but it cannot put the deal team in it. Without the pick it
      # matches the channel list against its own prose on every run, and
      # "#ma-deals", "#ma" and "#deal-team" are all plausible hits.
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where change of control findings should be posted"
        fallback: your deal channel
    prose:
      whenBound: "Post to {{pick:alert-channel}}"
      whenUnbound: "Open a chat thread with the review"
  - id: opt-email
    capability: email_communication
    role: tool
    description: Email the completed change of control review grid to the deal team.

defaultAgentType: agent
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: file.created
  # A contract arrives as a Drive file or as a Notion page, and this team reads
  # either. Each bound connector delivers only the topic it emits.
  eventTopics: [file.created, document.created]

extractionSchema:
  - index: 0
    name: Parties
    format: bulleted_list
    prompt: "Identify all parties to this agreement. For each party state their full legal name and their role (e.g. counterparty, licensor, lender, supplier)."
  - index: 1
    name: Date
    format: date
    prompt: "What is the date of this agreement? If a commencement date differs from the signing date, state both."
  - index: 2
    name: Term
    format: text
    prompt: "What is the term or duration of this agreement? State the start and end dates or the length of the term."
  - index: 3
    name: Change of Control Clause
    format: text
    prompt: "Identify and summarize the change of control clause(s) in this document. Quote the exact triggering language and specify what constitutes a 'change of control'."
  - index: 4
    name: Consent Required
    format: text
    prompt: "Does a change of control require prior consent from any party? Identify who must consent, the notice period, and any conditions."
  - index: 5
    name: Termination Rights
    format: text
    prompt: "What termination rights arise upon a change of control? Who can terminate, and what are the notice requirements?"
  - index: 6
    name: Put/Call Options
    format: text
    prompt: "Are there any put or call options triggered by a change of control? Summarize the terms, pricing, and exercise period."
  - index: 7
    name: Financial Implications
    format: text
    prompt: "What are the financial implications of a change of control? Include any fees, payments, accelerated obligations, or pricing adjustments."
