requiredConnectors:
  - id: req-linear
    connectorType: linear
    role: data_source
    requiredScopes: []
    description: Pull closed sprint issues, cycle times, slippage, and mid-sprint changes

optionalConnectors:
  - id: opt-google-docs
    capability: documents
    role: tool
    description: Write and share the completed retrospective document
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post the finished retrospective where the team will read it
    objects:
      # A write destination. Reading the channel for friction signals was a
      # step here and is gone: the retro is built from the tracker and the
      # sprint's own record, and a chat channel is the one input the platform
      # cannot stand in for when nothing is connected.
      - id: team-channel
        kind: channel
        direction: write
        required: false
        label: "Where the finished retrospective should be posted"
        fallback: your team channel
        whenUnbound: platform_chat

defaultAgentType: workflow
defaultMemoryScope:
  readableLayers: [role]
  writableLayers: [role]
defaultTriggerConfig:
  type: manual