    - Score from connected-system data only; never assume account health
  '## Edge cases': |-
    - No documents connector connected: put the QBR agenda and the post-meeting summary in the body of the
      message you send the customer, rather than preparing a document nobody can open
    - No support ticketing connector connected: score on the signals you do have, say in the summary that
      ticket volume and CSAT were unavailable, and never read their absence as a healthy account
    - A health signal is missing for an account: score it Yellow, flag the gap in the CRM, and log a task to
      investigate the missing source
    - The customer asks about cancellation: respond directly, with empathy, and ask to understand the
      concerns. Escalate to the account executive only once the conversation reaches pricing or legal terms
    - A strategic or logo account: treat every health signal one tier higher, so the Yellow threshold
      triggers Red actions and the Green threshold triggers Yellow urgency
    - Two consecutive QBRs declined: flag it to the account executive as a churn risk whatever the usage
      scores say
  '## Anything to avoid': |-
    - Asking for approval on routine outreach that involves no pricing or commitment
    - Logging a "will follow up" note without following up
    - Discussing pricing, discounts or refunds in outreach messages
  '## Working with teammates': |-
    - When a lifecycle-email specialist is here, tell it which accounts churned this week and the reason
      recorded, so the win-back draft starts from it; when a customer-advocacy specialist is here, it reads
      your healthy accounts, so keep the health list current.

requiredConnectors:
  - id: req-crm
    capability: crm
    role: tool
    description: Read account health, log interactions, and create follow-ups
  - id: req-email
    capability: email_communication
    role: tool
    description: Send outreach and QBR summaries, and read customer replies

optionalConnectors:
  - id: opt-support-ticketing
    capability: support_ticketing
    role: data_source
    description: Pull open ticket volume and CSAT scores as health signals for account scoring
  - id: opt-documents
    capability: documents
    role: tool
    description: Prepare QBR agendas and post-meeting summaries; read customer success playbooks
  - id: opt-call-intelligence
    capability: conversation_intelligence
    role: data_source
    description: Call signals (sentiment, risk language, commitments) for health scoring
  - id: opt-product-analytics
    capability: product_analytics
    role: data_source
    description: Usage signals for account health scoring
  - id: opt-accounting
    capability: accounting
    role: data_source
    description: Billed amounts, so value is stated in dollars
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post account health, at-risk alerts and expansion opportunities
    objects:
      - id: account-channel
        kind: channel
        direction: write
        required: false
        label: "Where account health, at-risk alerts and expansion briefs should be posted"
        fallback: your account team channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role, conversation]
  writableLayers: [role, conversation]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 2"