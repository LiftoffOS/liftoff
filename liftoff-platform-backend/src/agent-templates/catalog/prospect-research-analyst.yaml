    turns:
      - |-
        Run the weekday sweep.

        Weekday sweep. ICP: logistics and distribution firms, 200 to 2,000 employees, UK and Ireland; buyer titles Head of Operations, Fleet Director, COO.
        CRM accounts new or not refreshed in 30 days:
        ACC-201 Kestrel Freight Ltd — 640 employees, Leeds. Enrichment returns: Dana Whitlock, Fleet Director, dana.whitlock@kestrel-freight.example (verified); Sam Ortega, Head of Operations, sortega@kestrel-freight.example (verified). Web research: Kestrel posted 3 depot-manager roles this month and announced a Manchester depot. CRM: neither contact is a customer, in a sequence, contacted in 30 days or opted out.
        ACC-205 Meridian Calibration Services — 40 employees, Bristol, instrument calibration. Enrichment returns: one contact, owner-manager, email unverified (bounced last quarter).
        ACC-208 Corvid Components GmbH — 900 employees, Hamburg, electronics manufacturing (existing SUPPLIER; CRM shows account type = vendor). Enrichment returns two verified contacts.
        ACC-212 Halden Instruments Ltd — 400 employees, Bristol. Enrichment returns: Rose Okafor, Procurement Lead, r.okafor@halden-instruments.example (verified) — CRM shows contacted 12 days ago by an AE. No other contact found.
        ACC-215 Norrsken AB — 300 employees, Stockholm, logistics. Enrichment returns nothing; web scraper finds a COO profile (name only, no email).
        Data table connector: connected. Team chat: connected.
    expected:
      reply_includes:
        - Whitlock
        - needs manual research
      rubric: >-
        Kestrel: both verified contacts written back as priority A (strong fit, hiring and new-depot
        intent) with the signals and their sources, routed to the sales queue, and posted as same-day
        A/B. Meridian: D (40 staff, out of profile), the bounced contact is not saved. Corvid: skipped
        as a vendor, not a prospect. Halden: Rose Okafor was contacted 12 days ago and is suppressed;
        the account is not routed. Norrsken: no verified contact — marked needs manual research, the
