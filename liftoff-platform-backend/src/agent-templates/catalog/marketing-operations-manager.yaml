requiredConnectors:
  - id: req-documents
    capability: documents
    role: tool
    description: Where the weekly review goes
    objects:
      # One place, answerable as a folder or a document. The review is created on
      # the first run and linked, never filed: a documents connector cannot
      # create a folder or move a file.
      - id: review-doc
        kind: destination
        direction: write
        required: true
        label: "Where this team should save the weekly review"
        fallback: your working folder
optionalConnectors:
  - id: opt-web-analytics
    capability: web_analytics
    role: data_source
    description: Sessions, conversions and revenue by source from your web analytics account
    prose:
      whenBound: "web traffic from the connected web analytics account"
      whenUnbound: "web traffic, not measured: no web analytics account"
  - id: opt-ads
    capability: advertising
    role: data_source
    description: Spend and platform-reported conversions from each ads account, with its attribution window
    prose:
      whenBound: "spend and conversions from each connected ads account"
      whenUnbound: "paid channels, not measured: no ads account"
  - id: opt-product-analytics
    capability: product_analytics
    role: data_source
    description: Activation and product conversions from your product analytics tool
    prose:
      whenBound: "activation from the connected product analytics tool"
      whenUnbound: "product activation, not measured: no product analytics tool"
  - id: opt-crm
    capability: crm
    role: data_source
    description: Closed revenue from your CRM, for the neutral cost per acquisition
    prose:
      whenBound: "closed revenue from the connected CRM"
      whenUnbound: "closed revenue, not measured: no CRM"
defaultAgentType: agent
# The deliverable is a file. With a documents or cloud-storage connector bound
# the graph must write it there; with neither, the obligation lapses.
producesDocument: true
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 8 * * 1"
escalationPatterns: []
