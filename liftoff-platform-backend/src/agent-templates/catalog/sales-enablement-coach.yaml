requiredConnectors:
  - id: req-conversation-intelligence
    capability: conversation_intelligence
    role: data_source
    requiredScopes: []
    description: Pull call transcripts to score against the scorecards
optionalConnectors:
  - id: opt-crm
    capability: crm
    role: data_source
    requiredScopes: []
    description: Tie scored calls to the rep and deal for trend tracking
  - id: opt-documents
    capability: documents
    role: tool
    requiredScopes: []
    description: Hold the scorecards the team corrects, and the score history the trend is read from
  - id: opt-team-chat
    capability: team_chat
    role: tool
    requiredScopes: []
    description: Share scores and the chunk-to-drill with the rep and manager
    objects:
      - id: coaching-channel
        kind: channel
        direction: write
        required: false
        label: "Where call scores and the chunk to drill should be posted"
        fallback: your sales coaching channel
    prose:
      whenBound: "Post to {{pick:coaching-channel}}"
      whenUnbound: "Open a chat thread carrying"
defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: meeting.notes_available
escalationPatterns: []
