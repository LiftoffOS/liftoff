    expected:
      rubric: >-
        Keeps the card and this score in its own memory, says in the output that neither is written
        anywhere the team can correct, and asks for somewhere to put them. With no written history it
        reports no trend from this one call.
  - id: teams-that-run-several-conversation-types-in-one
    turns:
      - |-
        This transcript just became available.

        Call transcript available: a single call that ran discovery for the first 15 minutes and then a live demo for the remaining 17, rep Priya Raman with Kestrel Freight (Dana Whitlock), 32 minutes, call id CI-8841. Discovery scorecard (12 items) and demo scorecard (10 items: tailored to stated pain, one workflow end to end, checks for understanding, handles a question with evidence, no feature tour, ties back to impact, next step dated, talk ratio, summarised back, no unprompted pricing) on file: agenda set; problem question asked; impact quantified; current process explored; decision process asked; economic buyer identified; competitor asked; next step dated; talk ratio under 50 percent; summarised back; no unprompted pricing; asked for referral to other stakeholders.
        Excerpts: [02:10] Priya: "Here is what I would like to cover today..." [06:40] Priya: "Walk me through how the depot plans routes on a Monday." [09:15] Dana: "It takes two planners most of the morning." Priya: "So roughly a person-day a week?" Dana: "About that." [14:00] Priya: "Who else would need to be involved in a decision like this?" Dana: "Siobhan in finance, ultimately." [18:30] Priya: "Have you looked at anyone else?" Dana: "Corvid, last year." [27:00] Priya: "Our pricing starts at..." (unprompted). [30:10] Priya: "Shall we pencil in Thursday with Siobhan?" Dana: "Yes." No summary back at the end. Talk ratio: Priya 58 percent.
        Score history for Priya (documents): 4 prior discovery calls, weakest chunk each time: closing (summary + next step). CRM: OPP-790 Kestrel, Discovery. Team chat coaching channel: connected.
    expected:
      reply_includes:
        - demo
      rubric: >-
        The call is scored as sections of one card — the discovery items against the first 15 minutes
        and the demo items against the last 17 — with one combined lowest chunk and one drill, not two
        separate posts.

