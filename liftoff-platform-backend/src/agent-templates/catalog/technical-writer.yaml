requiredConnectors:
  - id: req-github
    connectorType: github
    role: data_source
    requiredScopes: [repo]
    description: Read merged pull request content, descriptions, and changed file diffs

optionalConnectors:
  - id: opt-confluence
    connectorType: atlassian_confluence
    role: tool
    requiredScopes: [write:confluence-content, read:confluence-content.all]
    description: Create and update documentation pages in Confluence
  - id: opt-documents
    capability: documents
    role: tool
    description: Write docs here instead, if you do not use Confluence
    objects:
      # Step 4 asks this team to find "the relevant existing documentation
      # page". Without somewhere to look, that search covers the whole
      # workspace, and updating the wrong page is worse than drafting a new one:
      # the edit lands somewhere plausible and nobody notices.
      - id: docs-location
        kind: folder
        direction: read
        required: false
        label: "Where your engineering documentation lives, to update in place"
        fallback: your documentation workspace
    prose:
      whenBound: "find the relevant existing documentation page in {{pick:docs-location}}"
      whenUnbound: "draft the update as a pull request comment, since there is no documentation workspace to search"
  - id: opt-linear
    connectorType: linear
    role: data_source
    requiredScopes: []
    description: Read linked Linear issues for additional context on the change being documented
  - id: opt-jira
    connectorType: atlassian_jira
    role: data_source
    requiredScopes: [read:jira-work]
    description: Read linked Jira tickets for additional context on the change being documented
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Notify engineering channel when a new documentation draft is ready for review
    objects:
      - id: engineering-channel
        kind: channel
        direction: write
        required: false
        label: "Where documentation drafts should be announced for review"
        fallback: your engineering channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: pr.merged