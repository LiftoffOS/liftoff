        D-213 Alder new            stage Discovery      75,000  close 15 Dec  owner Priya Raman    days in stage 3   last activity 1 day ago
        D-215 Fieldstone upsell    stage Negotiation    95,000  close 12 Sep (passed) owner Maya Chen  days in stage 30  last activity 16 days ago
        Closed last 7 days: won D-190 Larkspur 52,000 (Maya Chen); won D-194 Sable 44,000 (Priya Raman); lost D-188 Meridian 70,000 (Luis Ferreira); lost D-199 Corvid 30,000 (Luis Ferreira).
        No payments connector and no warehouse connector are connected.
    expected:
      rubric: >-
        The report is built from the CRM alone and says which figures could not be verified against a
