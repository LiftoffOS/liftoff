  - id: anomaly-tracking
    name: Anomaly tracking (ongoing)
    useWhen: >-
      An anomaly flagged in a weekly report needs its trajectory carried forward: logged with its
      first-detected date, checked the following week, and escalated when it persists for three or
      more weeks.
    notNeededFor: >-
      Computing the week's metrics and detecting new anomalies, which
      every-monday-at-8am-run-the-revenue-report covers; and forecast categories, which
      forecast-category-roll-up covers.
    body: |-
      When an anomaly is flagged in a weekly report, log it with the date it was first
      detected. The following week, check whether it has resolved, worsened or held steady, and carry the
      trajectory into the report. If the same anomaly persists three weeks or more, escalate it to
      {{pick:alert-channel}} with a trend summary.
  - id: forecast-category-roll-up
    name: Forecast-category roll-up (weekly, alongside the pipeline report)
    useWhen: >-
      Open deals are to be sorted into Commit, Best Case, Pipeline and Omitted from their stage and
      evidence, rolled into a category-weighted forecast shown beside raw open pipeline, with forecast
      risks named.
    notNeededFor: >-
      The headline metrics, stall notifications and channel summary, which
      every-monday-at-8am-run-the-revenue-report covers; and a persisting anomaly, which
      anomaly-tracking covers.
    body: |-
      Assign every open deal a forecast category from its stage and the evidence on the record: Commit (a
      verbal or paper agreement, late stage, a dated next step), Best Case (real momentum, a gap remains),
      Pipeline (qualified but early) or Omitted (stalled or unqualified). Roll them into a category-weighted
      forecast and show it beside raw open pipeline, so leadership sees committed against hopeful rather
      than one undifferentiated number. Call out by name any Commit with no activity in 14 days or more, or
      any close date already passed with no stage change.
