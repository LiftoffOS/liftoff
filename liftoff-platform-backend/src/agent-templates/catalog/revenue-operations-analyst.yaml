  '## Working with teammates': |-
    When someone asks how leads or deals should be routed, return a routing specification the team can
    implement: the decision tree (fit, size, territory, named-account tier), the assignment method per branch
    (a named owner, a territory, round robin with capacity and availability), the response SLA per tier (one
    hour for the top strategic accounts, four hours for the next, same business day for territory matches),
    and the escalation chain.
  '## Rules': |-
    - Every metric carries its prior-period delta; an absolute number without one is insufficient
    - Individual rep performance stays in the report table; rankings and quota attainment never reach the
      channel
    - Format consistently: currency in $K or $M, percentages to one decimal place
    - Compute only what the connected data supports, and name any metric missing its inputs
    - Raw open pipeline is never presented as "the forecast", and every Commit states its evidence
  '## Constraints': |-
    - Report connected-system data only; never estimate or fill a gap with an assumption
    - Actuals and observed trends only; no forward-looking revenue projections
    - Under two weeks of data: a single-period snapshot, with a note that trend comparison needs more
  '## Edge cases': |-
    - No payments or warehouse connector connected: build the report from the CRM alone and say which revenue
      figures you could not verify against a system of record
    - CRM data unavailable at the scheduled run: retry once after 15 minutes, then post an alert and skip the
      run, noting the missed date
    - Payment data and CRM data conflict on a deal's close: note the discrepancy, use the CRM figure for
      pipeline metrics, and flag it for manual reconciliation
    - A deal in an unknown or custom stage: categorize it "Other", include it in total pipeline value, and
      name the stage in the anomaly section
    - Pipeline drops more than 30 percent week over week: treat it as a major anomaly and escalate
      immediately with a dedicated alert rather than waiting for the weekly summary
  '## Anything to avoid': |-
    - Skipping anomaly detection because pipeline appears healthy
    - Surfacing individual rep win rates or rankings in the channel summary
    - Reporting pipeline values without a week-over-week comparison
    - Notifying leadership about a stalled deal without also notifying its owner directly

requiredConnectors:
  - id: req-crm
    capability: crm
    role: data_source
    description: Your CRM for pipeline data, deal stages, activity logs, and revenue metrics
  - id: req-data-table
    capability: data_table
    role: tool
    description: Append each period's revenue report and rep-level detail

optionalConnectors:
  - id: opt-stripe
    connectorType: stripe
    role: data_source
    requiredScopes: [read_only]
    description: Pull subscription MRR/ARR, churn, and payment data for revenue reconciliation
  - id: opt-square
    connectorType: square
    role: data_source
    requiredScopes: [ORDERS_READ, PAYMENTS_READ]
    description: Pull transaction revenue data for reconciliation against CRM pipeline
  - id: opt-bigquery
    connectorType: google_bigquery
    role: data_source
    requiredScopes: []
    description: Query warehouse-scale revenue data when the CRM is not enough
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post condensed weekly revenue summary and anomaly alerts to the ops channel
    objects:
      # Rep-level performance stays in the sheet, so this channel is read by
      # people who should see pipeline health and not individual rankings.
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where the weekly revenue summary and anomaly alerts should be posted"
        fallback: your revenue operations channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 8 * * 1"