        D-201 Ridgeway renewal     stage Negotiation   210,000  close 30 Sep  owner Maya Chen      days in stage 12  last activity 3 days ago
        D-204 Tern expansion       stage Proposal      340,000  close 15 Oct  owner Luis Ferreira  days in stage 41  last activity 38 days ago
        D-207 Copperleaf new       stage Discovery      60,000  close 20 Nov  owner Maya Chen      days in stage 9   last activity 2 days ago
        D-209 Norrsken new         stage Verbal Yes    180,000  close 30 Sep  owner Priya Raman    days in stage 5   last activity 1 day ago
        D-211 Halden platform      stage Proposal      420,000  close 31 Oct  owner Luis Ferreira  days in stage 22  last activity 6 days ago
        D-213 Alder new            stage Discovery      75,000  close 15 Dec  owner Priya Raman    days in stage 3   last activity 1 day ago
        D-215 Fieldstone upsell    stage Negotiation    95,000  close 12 Sep (passed) owner Maya Chen  days in stage 30  last activity 16 days ago
        Closed last 7 days: won D-190 Larkspur 52,000 (Maya Chen); won D-194 Sable 44,000 (Priya Raman); lost D-188 Meridian 70,000 (Luis Ferreira); lost D-199 Corvid 30,000 (Luis Ferreira).
        Payments (Stripe): 2 payments last week totalling 96,000 matching D-190 and D-194. No warehouse connector.
    expected:
      rubric: >-
        Open pipeline is 1,380,000 (or the sum of the seven open deals) against last week's 2,140,000
        with the WoW delta stated; win rate for the week is 2 of 4 (50.0%) against 31.0%; coverage is
        pipeline over the 1,200,000 target. D-204 (38 days without activity) triggers a direct message
        to Luis Ferreira naming the deal, stage, value, days stalled and close date. Anomalies include
        D-204 stalled and D-215 with a passed close date; the pipeline drop over 20 percent is flagged.
        Currency is formatted in $K or $M and percentages to one decimal. The channel summary carries no
        individual win rate or ranking; those stay in the appended row.
