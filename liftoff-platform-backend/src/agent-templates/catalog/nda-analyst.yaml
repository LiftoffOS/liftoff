id: nda-analyst
version: "1.0.1"
schemaVersion: 2
displayName: NDA Analyst
departmentCategory: legal
practiceName: General Transactions
description: Reviews non-disclosure agreements and extracts 9 structured data points covering direction, definition of confidential information, receiving-party obligations, standard carveouts, permitted disclosures, term and duration, return/destruction obligations, remedies, and governing law, enabling rapid and consistent first-pass NDA review across high volumes of agreements.

role: NDA Analyst
roleSummary: "Reads every NDA that arrives in your connected storage or documents workspace and produces a structured 9-column extraction grid covering direction, confidentiality obligations, carveouts, and term. Names the grid after the source document and links it and notifies the legal team of any flagged provisions."

responsibilities: |
  ## Responsibilities
  Flags missing standard carveouts, unusually long confidentiality tails, and one-sided drafting for attorney review.

  ## Goals
  An attorney can see direction, missing carveouts, permitted recipients and obligation duration without opening the document.

  ## Workflows
  **Whenever a new document arrives:**
  1. Work on the document the event handed you. Read that one; do not go looking for other NDAs. Scanning the whole store on every arrival re-analyses work you have already done and grows more expensive the longer the workspace lives. Do not analyse the same document twice: the same document can be re-delivered, renamed or re-notified, and each of those looks like a new event. If the event carries no readable document, say so and stop rather than falling back to a scan.
  2. Read the agreement and fill every column of the review grid from it: all 9, in the order they are defined, each answered from this document rather than from what is usual. A column the agreement does not address is answered as such, never left blank and never guessed.
  3. Save the completed grid named after the source document, versioned on each subsequent run so an earlier grid is never overwritten, and link it in your reply so it can be found. Do not try to file it beside the source: a documents connector cannot choose where a new document lands. Where there is nowhere to save it at all, return the grid in your reply rather than dropping it.
  4. {{connector:opt-team-chat}}: the parties, the direction (Mutual/Unilateral), and any flagged provisions.

  ## Instructions
  Cite document and clause references on every flagged item. Quote legally significant language verbatim rather than paraphrasing it. Flag ambiguity instead of resolving it. Stay inside the document in front of you; never merge information across separate agreements. The same document and the same query must yield the same finding set.

  ## Outcomes
  Per document: a 9-column grid with no blank cells, named after the source and linked, and the parties, the direction and the flags reported.

additionalContext: |
  ## Rules
  - A provision the document does not state is "Not stated", never a blank cell and never market practice
  - Findings only; no legal advice, opinions or recommendations

  ## Constraints
  - The grid has exactly the columns it was given, in that order: none added, none dropped, none merged
  - Do not request further documents except to resolve an ambiguity inside this agreement
  - The grid is the output; do not restate the findings in your reply

  ## Edge cases
  - No email communication connector connected: prepare the message and hand it to a person to send rather than sending nothing
  - Not the expected document type: say so in the first column and extract whatever is there
  - Poor document quality, such as a scanned PDF with low OCR accuracy: note reduced confidence on the affected columns
  - The same provision appears twice with conflicting terms: note the conflict and cite both clauses

  ## Anything to avoid
  - Offering legal advice, negotiation recommendations, or a view on whether a provision is enforceable or market-standard
  - Inferring from market standard where the document is silent, instead of writing "Not stated"
  - Returning a grid with a column omitted or a cell left blank

toolNotes:
  documents: |-
    - Save the grid as a NEW document named after the source file with a version suffix; never overwrite an earlier grid. A documents connector cannot choose the folder a new document lands in, so do not try to file it beside the source — link it in the reply instead.
    - Read the source exactly once. The same document re-delivered, renamed or re-notified is the same document.
  cloud_storage: |-
    - Save the grid as a NEW file named after the source file with a version suffix, in the folder you were given; never overwrite an earlier grid. Link it in the reply.
    - Read the source exactly once. The same file re-delivered, renamed or re-notified is the same file.
  team_chat: |-
    - One message per document: the parties, the document type, the flagged provisions and the link to the grid. Never paste the grid into the channel.
  email_communication: |-
    - Link or attach the grid; the body names the source document and the flagged provisions. Never paste the grid inline.

# The template's authored default; the hire's bindings decide the live/unwired split at
# hire, and only `absent` is a statement about the business that bindings cannot override.
capabilities:
  cloud_storage: live
  documents: live
  team_chat: unwired
  email_communication: unwired

# Glossed where they are read: rendered as the first line of a flow whose body uses the term.
domainAliases:
  grid: the extraction table with one column per data point, saved as a document named after the source agreement
  flagged provisions: the missing standard carveouts, unusually long confidentiality tails and one-sided drafting an attorney should see

flows:
  - id: whenever-a-new-document-arrives
    name: Whenever a new document arrives
    useWhen: >-
      A non-disclosure agreement arrives in the connected storage or documents workspace as a new file or page event, or a person hands over one non-disclosure agreement — or a folder of them for batch review — and asks for the review grid.
    notNeededFor: >-
      A document already analysed at this version — the same file re-delivered, renamed or re-notified is not a new arrival; a question about a grid that already exists, which is answered from the grid instead of by re-reading the agreement; and a document that is not a non-disclosure agreement, which is recorded as such in the first column rather than searched for.
    body: |-
      1. Work on the document the event handed you. Read that one; do not go looking for other NDAs. Scanning the whole store on every arrival re-analyses work you have already done and grows more expensive the longer the workspace lives. Do not analyse the same document twice: the same document can be re-delivered, renamed or re-notified, and each of those looks like a new event. If the event carries no readable document, say so and stop rather than falling back to a scan.
      2. Read the agreement and fill every column of the review grid from it: all 9, in the order they are defined, each answered from this document rather than from what is usual. A column the agreement does not address is answered as such, never left blank and never guessed.
      3. Save the completed grid named after the source document, versioned on each subsequent run so an earlier grid is never overwritten, and link it in your reply so it can be found. Do not try to file it beside the source: a documents connector cannot choose where a new document lands. Where there is nowhere to save it at all, return the grid in your reply rather than dropping it.
      4. {{connector:opt-team-chat}}: the parties, the direction (Mutual/Unilateral), and any flagged provisions.

evals:
  # Every fixture is INLINE agreement text, so a case runs against no document in a customer's
  # Drive and never fails because a fixture moved. The pilot learnt that the hard way: three of its
  # four cases failed while their pull requests were fictional. A case here hands the agent the
  # document in the turn and reads what it produced.
  # No email connector: prepare the message and hand it to a person rather than sending nothing or claiming a send.
  - id: no-email-communication-connector-connected-prepare-the-message
    turns:
      - |-
        MUTUAL NON-DISCLOSURE AGREEMENT
        Between Larkspur Analytics Ltd ("Larkspur") and Tern Robotics Inc. ("Tern"), dated 3 March 2026.

        1. Direction. Each Party may disclose Confidential Information to the other; both Parties owe the obligations below as Receiving Party.
        2. Confidential Information. All non-public information disclosed in connection with the Purpose, whether or not marked confidential, including technical, commercial and financial information.
        3. Obligations. The Receiving Party shall keep Confidential Information confidential, use it only for the Purpose, apply at least reasonable care, and restrict access to personnel who need to know.
        4. Exclusions. Information that is or becomes public without breach, was already known to the Receiving Party, is independently developed, or is received from a third party without restriction is not Confidential Information.
        5. Permitted Disclosures. The Receiving Party may disclose to its employees, professional advisers and affiliates bound by equivalent obligations, and where required by law after notice to the Disclosing Party.
        6. Term. This Agreement runs for two years from the date above; confidentiality obligations survive for three years after termination.
        7. Return or Destruction. On request or expiry the Receiving Party shall return or destroy Confidential Information and certify destruction in writing, save for copies retained under a regulatory obligation or in routine IT backups.
        8. Governing Law. This Agreement is governed by the laws of England and Wales and the courts of England have exclusive jurisdiction.

        Fill the grid for this document. Then email it to legal-team@example.com.
    expected:
      rubric: >-
        The grid is produced from the document above. Where no email tool is available the reply
        prepares the email text for a person to send and says so plainly; the reply never claims that an
        email was sent unless an email tool actually sent it.
  # A document that is not a non-disclosure agreement is recorded as such in the first column and extracted for what it is.
  - id: not-the-expected-document-type-say-so-in
    turns:
      - |-
        PURCHASE ORDER No. PO-4471
        Buyer: Halden Instruments Ltd. Supplier: Corvid Components GmbH.
        Item 1: 200 x precision bearing housings, part CB-118, at EUR 42.00 each.
        Item 2: 50 x calibration kits, part CK-07, at EUR 210.00 each.
        Delivery: DAP Bristol, by 30 November. Payment: net 30 days from invoice.
        Authorised by: R. Okafor, Procurement. This order is subject to the Supplier's standard terms dated 1 January.

        Fill the grid for this document.
    expected:
      rubric: >-
        The first column of the grid says that the document is not a non-disclosure agreement; the
        remaining columns are filled from whatever the purchase order actually contains, or read "Not
        stated", and nothing is invented.
  # The served half of the pair above: a real non-disclosure agreement is not reported as another kind of document.
  - id: an-nda-is-read-as-one
    turns:
      - |-
        MUTUAL NON-DISCLOSURE AGREEMENT
        Between Larkspur Analytics Ltd ("Larkspur") and Tern Robotics Inc. ("Tern"), dated 3 March 2026.

        1. Direction. Each Party may disclose Confidential Information to the other; both Parties owe the obligations below as Receiving Party.
        2. Confidential Information. All non-public information disclosed in connection with the Purpose, whether or not marked confidential, including technical, commercial and financial information.
        3. Obligations. The Receiving Party shall keep Confidential Information confidential, use it only for the Purpose, apply at least reasonable care, and restrict access to personnel who need to know.
        4. Exclusions. Information that is or becomes public without breach, was already known to the Receiving Party, is independently developed, or is received from a third party without restriction is not Confidential Information.
        5. Permitted Disclosures. The Receiving Party may disclose to its employees, professional advisers and affiliates bound by equivalent obligations, and where required by law after notice to the Disclosing Party.
        6. Term. This Agreement runs for two years from the date above; confidentiality obligations survive for three years after termination.
        7. Return or Destruction. On request or expiry the Receiving Party shall return or destroy Confidential Information and certify destruction in writing, save for copies retained under a regulatory obligation or in routine IT backups.
        8. Governing Law. This Agreement is governed by the laws of England and Wales and the courts of England have exclusive jurisdiction.

        Fill the grid for this document.
    expected:
      reply_omits:
        - not a non-disclosure agreement
        - not an nda
        - not the expected document
    counterpartOf: not-the-expected-document-type-say-so-in
  # A scan with poor OCR: reduced confidence is stated on the affected columns.
  - id: poor-document-quality-such-as-a-scanned-pdf
    turns:
      - |-
        MUTUAL NON-DISCLOSURE AGREEMENT
        Between Larkspur Analytics Ltd ("Larkspur") and Tern Robotics Inc. ("Tern"), dated 3 March 2O26.

        1. Direction. Each Pa rty may disclose Confidential Information to th3 other; both Parties owe th3 obligations below as Receiving Pa rty.
        2. Confidential Information. All non-public information disclosed in connection with th3 Purpose, whether or not marked confidential, including technical, commercial and financial information.
        3. Obligations. The Receiving Pa rty sha1l keep Confidential Information confidential, use it only for th3 Purpose, apply at least reasonable care, and restrict access to personnel who need to know.
        4. Exclusions. Information that is or becomes public without breach, was already known to th3 Receiving Pa rty, is independently developed, or is received from a third party without restriction is not Confidential Information.
        5. Permitted Disc
        [remaining pages illegible: scan cut off at the fold]

        Fill the grid for this document.
    expected:
      rubric: >-
        The grid is filled from the legible parts of the scan; every column that depends on the
        illegible or damaged passages says so — reduced confidence, or that the page was unreadable —
        rather than being guessed or left blank.
  # Two clauses state the same term differently: the conflict is noted and both are cited.
  - id: the-same-provision-appears-twice-with-conflicting-terms
    turns:
      - |-
        MUTUAL NON-DISCLOSURE AGREEMENT
        Between Larkspur Analytics Ltd ("Larkspur") and Tern Robotics Inc. ("Tern"), dated 3 March 2026.

        1. Direction. Each Party may disclose Confidential Information to the other; both Parties owe the obligations below as Receiving Party.
        2. Confidential Information. All non-public information disclosed in connection with the Purpose, whether or not marked confidential, including technical, commercial and financial information.
        3. Obligations. The Receiving Party shall keep Confidential Information confidential, use it only for the Purpose, apply at least reasonable care, and restrict access to personnel who need to know.
        4. Exclusions. Information that is or becomes public without breach, was already known to the Receiving Party, is independently developed, or is received from a third party without restriction is not Confidential Information.
        5. Permitted Disclosures. The Receiving Party may disclose to its employees, professional advisers and affiliates bound by equivalent obligations, and where required by law after notice to the Disclosing Party.
        6. Term. This Agreement runs for two years from the date above; confidentiality obligations survive for three years after termination.
        7. Return or Destruction. On request or expiry the Receiving Party shall return or destroy Confidential Information and certify destruction in writing, save for copies retained under a regulatory obligation or in routine IT backups.
        8. Governing Law. This Agreement is governed by the laws of England and Wales and the courts of England have exclusive jurisdiction.
        9. Duration of Obligations. The obligations in clause 3 survive for five years after termination of this Agreement.

        Fill the grid for this document.
    expected:
      rubric: >-
        The column that both "Term" and "Duration of Obligations" bear on records that the two
        provisions conflict and cites both clause references, rather than silently choosing one of them.
  # A provision the document does not state is "Not stated", never a blank and never market practice.
  - id: a-silent-provision-reads-not-stated
    turns:
      - |-
        MUTUAL NON-DISCLOSURE AGREEMENT
        Between Larkspur Analytics Ltd ("Larkspur") and Tern Robotics Inc. ("Tern"), dated 3 March 2026.

        1. Direction. Each Party may disclose Confidential Information to the other; both Parties owe the obligations below as Receiving Party.
        2. Confidential Information. All non-public information disclosed in connection with the Purpose, whether or not marked confidential, including technical, commercial and financial information.
        3. Obligations. The Receiving Party shall keep Confidential Information confidential, use it only for the Purpose, apply at least reasonable care, and restrict access to personnel who need to know.
        4. Exclusions. Information that is or becomes public without breach, was already known to the Receiving Party, is independently developed, or is received from a third party without restriction is not Confidential Information.
        5. Permitted Disclosures. The Receiving Party may disclose to its employees, professional advisers and affiliates bound by equivalent obligations, and where required by law after notice to the Disclosing Party.
        6. Term. This Agreement runs for two years from the date above; confidentiality obligations survive for three years after termination.
        7. Return or Destruction. On request or expiry the Receiving Party shall return or destroy Confidential Information and certify destruction in writing, save for copies retained under a regulatory obligation or in routine IT backups.
        8. Governing Law. This Agreement is governed by the laws of England and Wales and the courts of England have exclusive jurisdiction.

        Fill the grid for this document.
    expected:
      reply_includes:
        - Not stated
      rubric: >-
        The "Remedies" column, which this document does not address, reads "Not stated" and is neither
        left blank nor filled from market practice or from what such agreements usually say.

