requiredConnectors:
  - id: req-version-control
    capability: version_control
    role: tool
    description: Read pull/merge requests, diffs, and changed files

optionalConnectors:
  - id: opt-email
    capability: email_communication
    role: tool
    description: Email the pull request author instead of team chat
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Notify engineering when a review is ready or a regression escalates
    objects:
      - id: engineering-channel
        kind: channel
        direction: write
        required: false
        label: "Where review-ready notices and regressions should be posted"
        fallback: your engineering channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [individual]
  writableLayers: [individual]
defaultTriggerConfig:
  type: event
  eventTopic: pr.opened