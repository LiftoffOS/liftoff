requiredConnectors:
  - id: req-payments
    connectorType: stripe
    role: data_source
    requiredScopes: [read_only]
    description: Read each successful charge the moment it lands
  - id: req-crm
    capability: crm
    role: data_source
    description: Look up the customer, their account owner and their plan
  - id: req-email
    capability: email_communication
    role: tool
    description: Send the approved receipt to the customer
  - id: req-ledger
    capability: data_table
    role: tool
    description: Append each transaction to the revenue ledger as a queryable source of truth

optionalConnectors:
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Send the receipt for approval and notify the account owner
    objects:
      # The approval goes to finance ops as a message; this is the revenue
      # channel the posted receipt lands in, where the account owner is
      # mentioned.
      - id: revenue-channel
        kind: channel
        direction: write
        required: false
        label: "Where receipts should be posted, mentioning the account owner"
        fallback: your revenue channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: payment.received