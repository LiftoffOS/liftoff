requiredConnectors:
  - id: req-accounting
    capability: accounting
    role: tool
    description: Your accounting platform, for bills, payments and AP aging
  - id: req-email
    capability: email_communication
    role: tool
    description: Receive vendor invoices and send payment confirmations

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post payment runs and approval alerts to your finance channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where payment runs, aging summaries and approval alerts should be posted"
        fallback: your finance channel
    prose:
      whenBound: "post to {{pick:alert-channel}}"
      whenUnbound: "email the finance approver"

defaultAgentType: agent
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [role, individual, conversation]
  writableLayers: [role, individual, conversation]
defaultTriggerConfig:
  type: event
  eventTopic: email.received
  # Invoice intake rides the mail event. The payment run and the aging report are
  # calendar work: no invoice arrives on a Thursday to start a payment run, and a
  # weekly report promised with only a mail trigger behind it never runs.
  companionCrons:
    - label: weekly-payment-run
      cronExpr: "0 9 * * 4"
      objective: "Run the weekly payment run: pull every approved unpaid bill due within 7 days, group by payment method and vendor, post the run summary to the alert channel with the total, the vendor count and the bill list, record payment for bills below the approval threshold, send each vendor a confirmation naming the amount, the bills covered and the method, and log every payment with its timestamp and confirmation number."
    - label: weekly-ap-aging-report
      cronExpr: "0 9 * * 1"
      objective: "Produce the AP aging report: pull all open bills, bucket them Current, 31-60, 61-90 and 90-plus days, total each bucket and overall, identify what is past due or at risk this week, post the summary with the five oldest outstanding bills, and email every vendor in the 90-plus bucket to confirm the bill is still outstanding and verify banking details."