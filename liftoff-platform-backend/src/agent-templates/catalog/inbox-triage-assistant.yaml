requiredConnectors:
  - id: req-email
    capability: email_communication
    role: tool
    description: Read incoming mail, draft replies, and archive noise

optionalConnectors:
  - id: opt-calendar
    capability: calendar
    role: tool
    description: Read open time slots to draft scheduling replies for the user to approve
  - id: opt-tasks
    capability: project_management
    role: tool
    description: Create follow-up tasks with due dates
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Triage direct messages and mentions the same way
  - id: opt-digest
    capability: documents
    role: tool
    description: Append each triaged email to a running daily inbox digest

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [individual, role, conversation]
  writableLayers: [individual, conversation]
defaultTriggerConfig:
  type: event
  eventTopic: email.received
  # Triage is per-message, so it rides the mail event. The end-of-day digest is
  # not: nothing arrives at 6pm to trigger it, and a summary promised in the
  # responsibilities with no schedule behind it is a summary nobody ever gets.
  companionCrons:
    - label: close-daily-digest
      cronExpr: "0 18 * * 1-5"
      objective: "Close today's inbox digest: order the day's entries act-now first, then can-wait, then FYI, state what is still waiting on the user, and send them the closed digest."