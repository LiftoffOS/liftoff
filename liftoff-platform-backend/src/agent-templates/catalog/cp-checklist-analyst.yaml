requiredConnectors:
  - id: req-document-source
    capabilities: [cloud_storage, documents]
    role: tool
    description: Read source documents from your connected storage or documents workspace, and save the output there

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post CP checklist ready notification to the finance legal or deal team channel.
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where the conditions precedent checklist should be posted"
        fallback: your deal channel
    # Chosen at hire. A workspace with no team chat reads a sentence that never
    # mentions a channel, rather than an instruction to post plus an edge case
    # explaining that it cannot.
    prose:
      whenBound: "post to {{pick:alert-channel}} that it is ready, with a link"
      whenUnbound: "open a chat thread saying it is ready, with a link to it" 
  - id: opt-email
    capability: email_communication
    role: tool
    description: Email the completed checklist to the deal team

defaultAgentType: agent
# The deliverable is a file. With a documents or cloud-storage connector bound
# the graph must write it there; with neither, the obligation lapses.
producesDocument: true
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: file.created
  # A contract arrives as a Drive file or as a Notion page, and this team reads
  # either. Each bound connector delivers only the topic it emits.
  eventTopics: [file.created, document.created]

# One row per condition precedent, which is why this template carries a row
# definition and the review templates do not: a memo answers each topic once,
# a checklist has as many lines as the agreement has conditions. Index and
# Status are not extracted — neither is in the agreement. They are added when
# the sections are written.
extractionRowDefinition: condition precedent
extractionSchema:
  - index: 0
    name: Category
    format: tag
    prompt: "Which category does this condition precedent belong to?"
    tags: [Corporate, Financial, Legal, Security, Regulatory, Other]
  - index: 1
    name: Clause Number
    format: text
    prompt: "What is the clause or schedule reference for this condition precedent, exactly as the agreement numbers it?"
  - index: 2
    name: Clause
    format: text
    prompt: "Describe this condition precedent in one concise sentence, in the agreement's own terms. State the condition only, with no commentary on whether it is met."
