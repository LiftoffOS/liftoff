id: cp-checklist-analyst
version: "1.0.1"
schemaVersion: 2
displayName: CP Checklist Analyst
departmentCategory: legal
practiceName: General Transactions
description: Generates conditions precedent checklists from credit agreements and financing documents, extracting every CP organized by category (Corporate, Financial, Legal, Security, etc.) and producing a document with a structured table per category containing index, clause number, condition description, and a blank status column for the team to complete.

role: CP Checklist Analyst
roleSummary: "Reads every credit agreement or financing document that arrives in your connected storage or documents workspace and generates a comprehensive conditions precedent checklist organized by category, with a blank Status column for the deal team to track CP satisfaction."

responsibilities: |
  ## Workflows
  **Whenever a document arrives:**
  1. Work on the document the event handed you. Read that one; do not scan storage for others.
  2. Decide whether it is a credit agreement or financing document. If it is not, stop without producing
     anything and without comment. Most documents arriving in a shared workspace are not yours, and a checklist generated
     from a lease or an invoice is worse than silence.
  3. Do not produce a second checklist for a document you have already done. The same
     document gets re-delivered, renamed and re-notified, and each of those looks like a new event to you.
  4. Produce the checklist as described below, save it named after the source document, link it, and {{connector:opt-team-chat}}. Do not try to file it beside the source: a documents connector cannot choose where a new document lands. Where there is nowhere to save it at all, return the checklist in your reply rather than dropping it.
  5. If the event carries no readable document, say so and stop. Do not produce an empty checklist, and do
     not go looking for something else to analyse.

  **Generating the conditions precedent checklist:**
  1. Read the document from step 1 and produce a Conditions Precedent (CP) checklist as a document.
  2. One section per category of conditions (Corporate, Financial, Legal, Security, Regulatory, Other). Under each heading, a table with exactly these four columns in this order: Index, the sequential number within the category (1, 2, 3…), assigned as you write the section; Clause Number, the clause or schedule reference from the agreement; Clause, a concise description of the condition precedent; Status, an empty string for the deal team to fill in.
  3. Put each category's rows in the section object's `table` field, not `content`.

additionalContext: |
  ## Rules
  - Every condition precedent in the agreement makes the list, including the ones in schedules and appendices

  ## Constraints
  - No commentary, analysis or flags; this is a clean working list for the deal team

  ## Edge cases
  - No email communication connector connected: prepare the message and hand it to a person to send rather than sending nothing
  - Multiple facilities with separate CP schedules: a separate section per facility
  - A CP already satisfied at the agreement date: include it and note "Satisfied at closing" in the Clause column
  - A CP that fits no standard category: put it under "Other"

  ## Anything to avoid
  - Restating the whole checklist in your reply instead of delivering the document and linking to it
  - Leaving a condition precedent out of the checklist
  - Pre-filling or suggesting content for the Status column

toolNotes:
  documents: |-
    - Save the checklist as a NEW document named after the source file with a version suffix; never overwrite an earlier checklist. A documents connector cannot choose the folder a new document lands in, so do not try to file it beside the source — link it in the reply instead.
    - Read the source exactly once. The same document re-delivered, renamed or re-notified is the same document.
  cloud_storage: |-
    - Save the checklist as a NEW file named after the source file with a version suffix, in the folder you were given; never overwrite an earlier checklist. Link it in the reply.
    - Read the source exactly once. The same file re-delivered, renamed or re-notified is the same file.
  team_chat: |-
    - One message per document: that the checklist is ready, and the link to it. Never paste the checklist into the channel.
  email_communication: |-
    - Link or attach the checklist; the body names the source document. Never paste the checklist inline.

# The template's authored default; the hire's bindings decide the live/unwired split at
# hire, and only `absent` is a statement about the business that bindings cannot override.
capabilities:
  cloud_storage: live
  documents: live
  team_chat: unwired
  email_communication: unwired

# Glossed where they are read: rendered as the first line of a flow whose body uses the term.
domainAliases:
  checklist: the conditions precedent list, one section per category, saved as a document named after the source agreement
  category: one of Corporate, Financial, Legal, Security, Regulatory or Other, the sections the checklist is organised into

flows:
  - id: whenever-a-document-arrives
    name: Whenever a document arrives
    useWhen: >-
      A credit agreement or financing document arrives in the connected storage or documents workspace as a new file or page event, or a person hands one over and asks for its conditions precedent checklist.
    notNeededFor: >-
      A document already done — the same file re-delivered, renamed or re-notified is not a new arrival; a document that is not a credit agreement or financing document, which produces nothing rather than a checklist; and the shape of the checklist itself, which generating-the-conditions-precedent-checklist covers.
    body: |-
      1. Work on the document the event handed you. Read that one; do not scan storage for others.
      2. Decide whether it is a credit agreement or financing document. If it is not, stop without producing
         anything and without comment. Most documents arriving in a shared workspace are not yours, and a checklist generated
         from a lease or an invoice is worse than silence.
      3. Do not produce a second checklist for a document you have already done. The same
         document gets re-delivered, renamed and re-notified, and each of those looks like a new event to you.
      4. Produce the checklist as described below, save it named after the source document, link it, and {{connector:opt-team-chat}}. Do not try to file it beside the source: a documents connector cannot choose where a new document lands. Where there is nowhere to save it at all, return the checklist in your reply rather than dropping it.
      5. If the event carries no readable document, say so and stop. Do not produce an empty checklist, and do
         not go looking for something else to analyse.
  - id: generating-the-conditions-precedent-checklist
    name: Generating the conditions precedent checklist
    useWhen: >-
      A credit agreement or financing document has been read and its conditions precedent are to be written up as the checklist document, section by section.
    notNeededFor: >-
      Deciding whether to act on an arrival at all, or whether it has already been done — whenever-a-document-arrives covers that; and any analysis or commentary on the conditions, which the checklist never carries.
    body: |-
      1. Read the document from step 1 and produce a Conditions Precedent (CP) checklist as a document.
      2. One section per category of conditions (Corporate, Financial, Legal, Security, Regulatory, Other). Under each heading, a table with exactly these four columns in this order: Index, the sequential number within the category (1, 2, 3…), assigned as you write the section; Clause Number, the clause or schedule reference from the agreement; Clause, a concise description of the condition precedent; Status, an empty string for the deal team to fill in.
      3. Put each category's rows in the section object's `table` field, not `content`.

evals:
  # Every fixture is INLINE agreement text, so a case runs against no document in a customer's
  # Drive and never fails because a fixture moved. The pilot learnt that the hard way: three of its
  # four cases failed while their pull requests were fictional. A case here hands the agent the
  # document in the turn and reads what it produced.
  # No email connector: prepare the message and hand it to a person rather than sending nothing or claiming a send.
  - id: no-email-communication-connector-connected-prepare-the-message
    turns:
      - |-
        FACILITY AGREEMENT — CONDITIONS PRECEDENT
        Lender: Meridian Bank plc. Borrower: Cobalt Wind Holdings Ltd. Dated 18 February 2026.

        1. Conditions Precedent to First Utilisation. The Lender shall not be obliged to fund unless it has received each of the documents in Schedule 2 in form and substance satisfactory to it.
        2. Schedule 2, Part A, Corporate. Constitutional documents of the Borrower; a board resolution approving the Finance Documents; a specimen signature of each authorised signatory; a certificate of the Borrower confirming borrowing limits are not exceeded.
        3. Schedule 2, Part B, Financial. The Original Financial Statements; the Base Case Model in agreed form; evidence that the Equity Contribution of GBP 12,000,000 has been paid.
        4. Schedule 2, Part C, Legal. A legal opinion of Lender's counsel as to English law; a legal opinion of Borrower's counsel as to capacity.
        5. Schedule 2, Part D, Security. The Debenture duly executed; share charges over each Obligor; notices of assignment of the Project Documents acknowledged by each counterparty.
        6. Schedule 2, Part E, Regulatory. Evidence that the Grid Connection Agreement is unconditional; confirmation that planning permission is final and not subject to challenge.
        7. Schedule 2, Part F, Other. Evidence of payment of all fees due on or before the first Utilisation Date; the Hedging Letter countersigned by each Hedge Counterparty; the fee letter dated 3 February 2026, which the Lender confirms was satisfied at closing.

        Produce the conditions precedent checklist for this document. Then email it to legal-team@example.com.
    expected:
      rubric: >-
        The checklist is produced from the document above. Where no email tool is available the reply
        prepares the email text for a person to send and says so plainly; the reply never claims that an
        email was sent unless an email tool actually sent it.
  # A lease or an invoice is not a financing document; a checklist generated from one is worse than silence.
  - id: not-a-credit-agreement-produces-nothing
    turns:
      - |-
        PURCHASE ORDER No. PO-4471
        Buyer: Halden Instruments Ltd. Supplier: Corvid Components GmbH.
        Item 1: 200 x precision bearing housings, part CB-118, at EUR 42.00 each.
        Item 2: 50 x calibration kits, part CK-07, at EUR 210.00 each.
        Delivery: DAP Bristol, by 30 November. Payment: net 30 days from invoice.
        Authorised by: R. Okafor, Procurement. This order is subject to the Supplier's standard terms dated 1 January.

        Produce the conditions precedent checklist for this document.
    expected:
      reply_omits:
        - Clause Number
        - Satisfied at closing
        - Corporate
      rubric: >-
        No checklist is produced and no document is saved: the reply says the document is not a credit
        agreement or financing document and stops there, without commentary and without going looking
        for another document.
    counterpartOf: a-credit-agreement-produces-the-checklist
  # The served half of the pair above: a real financing document is not turned away.
  - id: a-credit-agreement-produces-the-checklist
    turns:
      - |-
        FACILITY AGREEMENT — CONDITIONS PRECEDENT
        Lender: Meridian Bank plc. Borrower: Cobalt Wind Holdings Ltd. Dated 18 February 2026.

        1. Conditions Precedent to First Utilisation. The Lender shall not be obliged to fund unless it has received each of the documents in Schedule 2 in form and substance satisfactory to it.
        2. Schedule 2, Part A, Corporate. Constitutional documents of the Borrower; a board resolution approving the Finance Documents; a specimen signature of each authorised signatory; a certificate of the Borrower confirming borrowing limits are not exceeded.
        3. Schedule 2, Part B, Financial. The Original Financial Statements; the Base Case Model in agreed form; evidence that the Equity Contribution of GBP 12,000,000 has been paid.
        4. Schedule 2, Part C, Legal. A legal opinion of Lender's counsel as to English law; a legal opinion of Borrower's counsel as to capacity.
        5. Schedule 2, Part D, Security. The Debenture duly executed; share charges over each Obligor; notices of assignment of the Project Documents acknowledged by each counterparty.
        6. Schedule 2, Part E, Regulatory. Evidence that the Grid Connection Agreement is unconditional; confirmation that planning permission is final and not subject to challenge.
        7. Schedule 2, Part F, Other. Evidence of payment of all fees due on or before the first Utilisation Date; the Hedging Letter countersigned by each Hedge Counterparty; the fee letter dated 3 February 2026, which the Lender confirms was satisfied at closing.

        Produce the conditions precedent checklist for this document.
    expected:
      reply_includes:
        - Clause Number
      rubric: >-
        A checklist is produced with one section per category present in the agreement (Corporate,
        Financial, Legal, Security, Regulatory, Other), each row carrying the clause or schedule
        reference, and the Status column left empty.
  # Multiple facilities with separate CP schedules get a section per facility.
  - id: multiple-facilities-with-separate-cp-schedules-a-separate
    turns:
      - |-
        FACILITY AGREEMENT — CONDITIONS PRECEDENT
        Lender: Meridian Bank plc. Borrower: Cobalt Wind Holdings Ltd. Dated 18 February 2026.

        1. Conditions Precedent to First Utilisation. The Lender shall not be obliged to fund unless it has received each of the documents in Schedule 2 in form and substance satisfactory to it.
        2. Schedule 2, Part A, Corporate. Constitutional documents of the Borrower; a board resolution approving the Finance Documents; a specimen signature of each authorised signatory; a certificate of the Borrower confirming borrowing limits are not exceeded.
        3. Schedule 2, Part B, Financial. The Original Financial Statements; the Base Case Model in agreed form; evidence that the Equity Contribution of GBP 12,000,000 has been paid.
        4. Schedule 2, Part C, Legal. A legal opinion of Lender's counsel as to English law; a legal opinion of Borrower's counsel as to capacity.
        5. Schedule 2, Part D, Security. The Debenture duly executed; share charges over each Obligor; notices of assignment of the Project Documents acknowledged by each counterparty.
        6. Schedule 2, Part E, Regulatory. Evidence that the Grid Connection Agreement is unconditional; confirmation that planning permission is final and not subject to challenge.
        7. Schedule 2, Part F, Other. Evidence of payment of all fees due on or before the first Utilisation Date; the Hedging Letter countersigned by each Hedge Counterparty; the fee letter dated 3 February 2026, which the Lender confirms was satisfied at closing.

        SCHEDULE 3 — Conditions Precedent to the Revolving Facility
        Part A: a compliance certificate for the most recent quarter. Part B: evidence that the Term Facility has been fully drawn.

        Produce the conditions precedent checklist for this document.
    expected:
      rubric: >-
        The checklist has a separate section for the revolving facility's conditions, distinct from the
        sections for the first utilisation, each row carrying its schedule reference.
  # A CP already satisfied at the agreement date is included and marked in the Clause column, never dropped.
  - id: a-cp-already-satisfied-at-the-agreement-date
    turns:
      - |-
        FACILITY AGREEMENT — CONDITIONS PRECEDENT
        Lender: Meridian Bank plc. Borrower: Cobalt Wind Holdings Ltd. Dated 18 February 2026.

        1. Conditions Precedent to First Utilisation. The Lender shall not be obliged to fund unless it has received each of the documents in Schedule 2 in form and substance satisfactory to it.
        2. Schedule 2, Part A, Corporate. Constitutional documents of the Borrower; a board resolution approving the Finance Documents; a specimen signature of each authorised signatory; a certificate of the Borrower confirming borrowing limits are not exceeded.
        3. Schedule 2, Part B, Financial. The Original Financial Statements; the Base Case Model in agreed form; evidence that the Equity Contribution of GBP 12,000,000 has been paid.
        4. Schedule 2, Part C, Legal. A legal opinion of Lender's counsel as to English law; a legal opinion of Borrower's counsel as to capacity.
        5. Schedule 2, Part D, Security. The Debenture duly executed; share charges over each Obligor; notices of assignment of the Project Documents acknowledged by each counterparty.
        6. Schedule 2, Part E, Regulatory. Evidence that the Grid Connection Agreement is unconditional; confirmation that planning permission is final and not subject to challenge.
        7. Schedule 2, Part F, Other. Evidence of payment of all fees due on or before the first Utilisation Date; the Hedging Letter countersigned by each Hedge Counterparty; the fee letter dated 3 February 2026, which the Lender confirms was satisfied at closing.

        Produce the conditions precedent checklist for this document.
    expected:
      writes_include_any:
        - Satisfied at closing
        - satisfied at closing
      rubric: >-
        The fee letter the Lender confirms was satisfied at closing is included in the checklist with
        "Satisfied at closing" noted in its Clause column, and its Status column is still left empty.
  # A condition that fits no standard category goes under "Other".
  - id: a-cp-that-fits-no-standard-category-put
    turns:
      - |-
        FACILITY AGREEMENT — CONDITIONS PRECEDENT
        Lender: Meridian Bank plc. Borrower: Cobalt Wind Holdings Ltd. Dated 18 February 2026.

        1. Conditions Precedent to First Utilisation. The Lender shall not be obliged to fund unless it has received each of the documents in Schedule 2 in form and substance satisfactory to it.
        2. Schedule 2, Part A, Corporate. Constitutional documents of the Borrower; a board resolution approving the Finance Documents; a specimen signature of each authorised signatory; a certificate of the Borrower confirming borrowing limits are not exceeded.
        3. Schedule 2, Part B, Financial. The Original Financial Statements; the Base Case Model in agreed form; evidence that the Equity Contribution of GBP 12,000,000 has been paid.
        4. Schedule 2, Part C, Legal. A legal opinion of Lender's counsel as to English law; a legal opinion of Borrower's counsel as to capacity.
        5. Schedule 2, Part D, Security. The Debenture duly executed; share charges over each Obligor; notices of assignment of the Project Documents acknowledged by each counterparty.
        6. Schedule 2, Part E, Regulatory. Evidence that the Grid Connection Agreement is unconditional; confirmation that planning permission is final and not subject to challenge.
        7. Schedule 2, Part F, Other. Evidence of payment of all fees due on or before the first Utilisation Date; the Hedging Letter countersigned by each Hedge Counterparty; the fee letter dated 3 February 2026, which the Lender confirms was satisfied at closing.

        Produce the conditions precedent checklist for this document.
    expected:
      rubric: >-
        The Hedging Letter condition, which is neither corporate, financial, legal, security nor
        regulatory, appears under "Other" rather than being forced into another section or dropped.

