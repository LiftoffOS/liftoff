        5. Service Charge. A fair proportion o f th3 Landlord's costs o f maintaining th3 common parts, capped at GBP 12,OOO per annum in th3 first year.
        6. Insurance. The Landlord insures th3 building; th3 Tenant reimburses th3 premium and insures its own contents.
        7. Permitted Use. Light industrial use within Class E(g)(iii) and ancillary offices; no other use without consent.
        8. Repair. The Tenant
        [remaining pages illegible: scan cut off at the fold]

        Fill the grid for this document.
    expected:
      rubric: >-
        The grid is filled from the legible parts of the scan; every column that depends on the
        illegible or damaged passages says so — reduced confidence, or that the page was unreadable —
        rather than being guessed or left blank.
