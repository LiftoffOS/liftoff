requiredConnectors:
  - id: req-docusign
    connectorType: docusign
    role: tool
    requiredScopes: [signature, impersonation]
    description: Read incoming contracts and add review comments
  - id: req-documents
    capability: documents
    role: tool
    description: Where they read the clause library and save reviews
    objects:
      # One place to work. Reviews and executed copies both go here, with the
      # contract type LEADING each file's name rather than sorted into
      # subfolders: a documents connector cannot create one, and a type matched
      # against folder names somebody else chose is worse than no sorting at
      # all, because "Vendor Contracts", "Vendors" and "Suppliers" all read as
      # the same shelf and filing to the wrong one hides the contract.
      - id: working-folder
        kind: destination
        direction: write
        required: true
        label: "Where this team should save its work"
        fallback: your working folder
  - id: req-email
    capability: email_communication
    role: tool
    description: Send review summaries and renewal alerts to the legal team
  - id: req-data-table
    capability: data_table
    role: tool
    description: "Your contract database: executed contracts and renewal dates"

  # Its own requirement, because it is a different question. Asked on one
  # tree with the destination, a row was routed by what it WAS — so naming a
  # document as the save location answered THIS instead, and the team was
  # hired with nowhere to work.
  - id: req-clause-library
    capability: documents
    role: data_source
    description: What they check incoming contracts against
    objects:
      # Every clause check is measured against this library. Which document it
      # is, is a fact only the legal team holds, and guessing it wrong means
      # every review that follows is graded against the wrong standard.
      - id: clause-library
        kind: file
        direction: read
        required: false
        label: "Your standard clause library, to check incoming contracts against"
        fallback: your standard clause library
optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post review alerts, escalations and renewal warnings to legal
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where review alerts, escalations and renewal warnings should be posted"
        fallback: your legal channel
    prose:
      whenBound: "post to {{pick:alert-channel}}"
      whenUnbound: "open a chat thread with"
  - id: opt-google-drive
    connectorType: google_drive
    role: tool
    requiredScopes:
      - https://www.googleapis.com/auth/drive.file
    description: Upload executed contract PDFs alongside the reviews

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: document.sent
  # Two events, because the responsibilities describe two arrivals: an envelope
  # sent for review, and the same envelope coming back executed. Filing was
  # written against the second and subscribed to neither.
  eventTopics: [document.sent, document.signed]
  # Renewal tracking and the database audit are calendar work: no envelope
  # arrives on a Monday to start them, and the 60-day alert is the whole point
  # of the role.
  companionCrons:
    - label: weekly-renewal-tracking
      cronExpr: "0 9 * * 1"
      objective: "Pull the contract database from the connected data table and work every contract expiring within 90 days: remind on the 60-to-90-day band with the contract name, party, expiry and auto-renewal status and email the legal team; flag the 30-days-or-less band urgently and confirm the attorney has been told; and call out prominently any auto-renewing contract whose opt-out window is approaching."
    - label: quarterly-database-audit
      cronExpr: "0 9 1 1,4,7,10 *"
      objective: "Audit the contract database for records missing an expiration date, a contract value or a filing link, and email the gaps to the legal team."