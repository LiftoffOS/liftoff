requiredConnectors:
  - id: req-documents
    capability: documents
    role: tool
    description: Where this team's work goes
    objects:
      # ONE place, answerable either way. A folder means "work in here"; a
      # document means "this IS the deliverable, keep it current", and anything
      # else gets LINKED from it. Not filed beside it: a documents connector
      # cannot create a folder or move a file, and the instruction to do so is
      # how thirteen documents ended up loose in a customer's Drive.
      - id: working-folder
        kind: destination
        direction: write
        required: true
        label: "Where this team should save its work"
        fallback: your working folder
optionalConnectors:
  - id: opt-crm
    capability: crm
    role: data_source
    description: See which competitors appear in open deals to prioritize coverage
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post material competitor alerts to the team channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where material competitor alerts should be posted"
        fallback: your team channel
    prose:
      whenBound: "alert the team in {{pick:alert-channel}}"
      whenUnbound: "lead the digest with the alert and open a chat thread carrying it"
defaultAgentType: agent
# The deliverable is a file. With a documents or cloud-storage connector bound
# the graph must write it there; with neither, the obligation lapses.
producesDocument: true
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 8 * * 1"