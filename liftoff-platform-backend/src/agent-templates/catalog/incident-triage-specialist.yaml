requiredConnectors:
  - id: req-incident-management
    capability: incident_management
    role: tool
    description: Your incident platform, for reading, acknowledging and routing incidents as they fire

optionalConnectors:
  - id: opt-github
    connectorType: github
    role: data_source
    requiredScopes: [repo]
    description: Read recent deployments and commits for incident correlation
  - id: opt-documents
    capability: documents
    role: data_source
    description: Read runbooks and incident response procedures
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post incident summaries and create incident threads
    objects:
      # A brief posted two minutes after an alert is only useful in the channel
      # the on-call actually watches. "#incidents" was a guess this team made
      # every time from the channel list.
      - id: incident-channel
        kind: channel
        direction: write
        required: false
        label: "Where incident briefs and threads should be posted"
        fallback: your incident channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: incident.triggered