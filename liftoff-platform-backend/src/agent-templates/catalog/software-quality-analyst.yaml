requiredConnectors:
  - id: req-sentry
    connectorType: sentry
    role: data_source
    requiredScopes: [event:read, project:read]
    description: Read error events, stack traces, and issue metadata
  - id: req-github
    connectorType: github
    role: tool
    requiredScopes: [repo]
    description: Create and assign issues; read existing issues for deduplication

optionalConnectors:
  - id: opt-linear
    connectorType: linear
    role: tool
    requiredScopes: []
    description: Create issues in Linear as an alternative to GitHub Issues
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Notify engineering of critical bugs and triage summaries
    objects:
      - id: engineering-channel
        kind: channel
        direction: write
        required: false
        label: "Where critical bugs and triage summaries should be posted"
        fallback: your engineering channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: issue.created