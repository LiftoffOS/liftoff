requiredConnectors:
  - id: req-accounting
    capability: accounting
    role: tool
    description: Your accounting platform, for invoices and payments
  - id: req-email
    capability: email_communication
    role: tool
    description: Send reminders and receipts, and read customer replies

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post AR aging and collections alerts to your finance channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where AR aging summaries and collections alerts should be posted"
        fallback: your finance channel
    prose:
      whenBound: "post to {{pick:alert-channel}}"
      whenUnbound: "email the finance team"
  - id: opt-crm
    capability: crm
    role: data_source
    description: Your CRM for customer account context and relationship history

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [role, global, conversation]
  writableLayers: [role, individual, conversation]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 8 * * 1-5"
  # The morning review is the cron. Applying a payment "the moment it is
  # identified" and answering a dispute on the reply are not: both arrive in the
  # mailbox, and on the cron alone the fastest either could happen was the next
  # weekday morning, which the Instructions explicitly rule out.
  reactiveSubscriptions:
    - label: on-customer-mail
      source:
        kind: system_event
        topic: email.received
      objective: "A customer email arrived. Where it is a payment notification or remittance, match it to the open invoice by amount, customer and invoice number, apply it, and send a receipt; on a partial payment log the balance and say so. Where it disputes an invoice, flag that invoice In Dispute at once, stop its reminders, and answer with the specific facts. Where it is neither, do nothing and leave it for the morning review."