requiredConnectors:
  - id: req-document-source
    capabilities: [cloud_storage, documents]
    role: tool
    description: Read source documents from your connected storage or documents workspace, and save the output there

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post the batch roll-up and privilege count to your channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where batch roll-ups and privilege counts should be posted"
        fallback: your legal channel
    prose:
      whenBound: "Post to {{pick:alert-channel}}"
      whenUnbound: "Open a chat thread with the review"
  - id: opt-email
    capability: email_communication
    role: tool
    description: Email the extraction roll-up to the litigation team.

defaultAgentType: agent
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: file.created
  # A contract arrives as a Drive file or as a Notion page, and this team reads
  # either. Each bound connector delivers only the topic it emits.
  eventTopics: [file.created, document.created]

extractionSchema:
  - index: 0
    name: Date
    format: date
    prompt: "What is the date of this document? For emails or correspondence, use the date sent. For other documents, use the date of creation, signature, or the most prominent date shown."
  - index: 1
    name: Type of Document
    format: text
    prompt: "What type of document is this? (e.g. email, memorandum, letter, contract, report, meeting minutes, text message, invoice, presentation). Be specific."
  - index: 2
    name: Sender
    format: text
    prompt: "Who is the sender or author of this document? State their full name, title, and organisation where identifiable."
  - index: 3
    name: Recipient(s)
    format: bulleted_list
    prompt: "Who are the recipients of this document? List all To, CC, and BCC recipients where identifiable. State their full name, title, and organisation for each. Note whether they appear in To, CC, or BCC fields."
  - index: 4
    name: Summary
    format: text
    prompt: "Provide a concise factual summary of the content of this document in 2 to 4 sentences. Focus on the key subject matter, any decisions made, actions requested, or information conveyed. Do not include legal conclusions."
  - index: 5
    name: Persons Mentioned
    format: bulleted_list
    prompt: "List all individuals mentioned in this document (other than the sender and recipients already identified). For each person, state their name and, if discernible, their role or organisation."
  - index: 6
    name: Privileged?
    format: yes_no
    prompt: "Does this document appear to be legally privileged? Answer Yes if it appears to be a communication between a lawyer and client made for the dominant purpose of obtaining or giving legal advice, or created for the dominant purpose of litigation. Answer No otherwise. If uncertain, note the basis for uncertainty."
