    notNeededFor: >-
      Deciding whether to act on an arrival at all, or whether it has already been done — whenever-a-document-arrives covers that; and any advice or opinion on enforceability or whether to sign, which the memo never carries.
    body: |-
      Read the document from step 1 and answer all 15 topics below from it, then write them up as a legal memo. Per section: the key provisions, the clause reference quoted, and a bold **[FLAG]** before any sentence describing an unusual, onerous or non-market provision. All 15 sections appear, in this order; a topic the agreement does not address says so rather than being dropped.

      1. **Parties & Shareholdings**: Full legal names, roles, share classes held, and percentage interests (on a fully diluted basis if stated)
