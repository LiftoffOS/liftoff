      7. **Right of First Refusal / Pre-emption on Transfer**: Trigger, procedure, pricing mechanics, and any exceptions
      8. **Drag-Along Rights**: Who holds the right, threshold to trigger, conditions (e.g. minimum price, independent valuation), and minority protections
      9. **Tag-Along Rights**: Who holds the right, triggering threshold, exercise procedure, and price terms
      10. **Anti-Dilution Protections**: Type (full ratchet, weighted average), trigger events, calculation mechanics, and exceptions
      11. **Dividend Policy**: Any obligation or target to pay dividends, preferential dividend rights, and restrictions on distributions
      12. **Exit & Liquidity**: Agreed exit routes (trade sale, IPO, drag sale), timelines, and liquidation preferences on exit
      13. **Deadlock**: Deadlock definition, escalation and resolution mechanisms (e.g. Russian roulette, put/call options), and consequences if unresolved
      14. **Non-Compete & Non-Solicitation**: Who is bound, scope of activities and geography, duration, and carve-outs
      15. **Governing Law & Dispute Resolution**: Applicable law, forum, arbitration or litigation, and any mandatory escalation steps

evals:
  # Every fixture is INLINE document text, so a case runs against no document in a customer's
  # Drive and never fails because a fixture moved. A case here hands the agent the document in
  # the turn and reads what it produced.
  # No email connector: prepare the message and hand it to a person rather than sending nothing or claiming a send.
  - id: no-email-communication-connector-connected-prepare-the-message
    turns:
      - |-
        SHAREHOLDERS AGREEMENT RELATING TO KESTREL DIAGNOSTICS LTD
        Between Kestrel Diagnostics Ltd (the "Company"), Dr Amara Osei, Lukas Berg and Fjord Ventures I LP (together the "Shareholders"), dated 9 March 2026.

        1. Share Capital. 1,000,000 ordinary shares of GBP 0.01 and 250,000 series A preferred shares of GBP 0.01.
        2. Shareholdings. Osei 40 percent, Berg 35 percent, Fjord 25 percent on a fully diluted basis.
        3. Board. Five directors: two appointed by the founders, one by Fjord, the chief executive, and an independent chair approved by Fjord.
        4. Reserved Matters. Issuing shares, incurring debt over GBP 500,000, changing the business, and disposing of material assets require Fjord's consent.
        5. Pre-emption. Each Shareholder may take up new shares pro rata to its holding before any issue to a third party.
        6. Transfers. No transfer for three years save to permitted transferees; thereafter a right of first refusal in favour of the other Shareholders at the proposed price.
        7. Drag-Along. Shareholders holding 75 percent may require the others to sell on the same terms to a bona fide purchaser.
        8. Tag-Along. If Shareholders holding 50 percent or more sell, the others may sell on the same terms.
        9. Dividends. No dividends before the third anniversary; thereafter as the Board recommends, subject to the preferred dividend of 6 percent.
        10. Exit. The Shareholders shall use reasonable endeavours to achieve an exit within seven years.
        11. Deadlock. A deadlock is referred to the chief executives of the founders and Fjord, then to mediation.
        12. Restrictive Covenants. Each founder shall not compete or solicit employees for twelve months after ceasing to hold shares.
        13. Confidentiality. Each party keeps the Company's information confidential during and for two years after the term.
        14. Warranties. The founders warrant the accuracy of the disclosure letter and the cap table.
        15. Governing Law and Disputes. English law; disputes to the courts of England.

        Write the shareholder agreement memo for this document. Then email it to finance-counsel@example.com.
    expected:
      rubric: >-
        The memo is produced from the document above. Where no email tool is available the reply
        prepares the email text for a person to send and says so plainly; the reply never claims that an
        email was sent unless an email tool actually sent it.
  # The quiet path: a document that is not a shareholder agreement produces nothing — no memo, no sections, no flags.
  - id: not-a-shareholder-agreement-produces-nothing
    turns:
      - |-
        PURCHASE ORDER No. PO-4471
        Buyer: Halden Instruments Ltd. Supplier: Corvid Components GmbH.
        Item 1: 200 x precision bearing housings, part CB-118, at EUR 42.00 each.
        Item 2: 50 x calibration kits, part CK-07, at EUR 210.00 each.
        Delivery: DAP Bristol, by 30 November. Payment: net 30 days from invoice.
        Authorised by: R. Okafor, Procurement. This order is subject to the Supplier's standard terms dated 1 January.

        Write the shareholder agreement memo for this document.
    expected:
      reply_omits:
        - '[FLAG]'
        - Reserved Matters
        - Drag-Along Rights
        - Tag-Along Rights
      rubric: >-
        No memo is produced and no document is saved: the reply says the document is not a shareholder
        agreement and stops there, without commentary and without going looking for another document.
    counterpartOf: a-shareholder-agreement-produces-the-memo
  # The served half of the pair above: a real agreement gets its memo.
  - id: a-shareholder-agreement-produces-the-memo
    turns:
      - |-
        SHAREHOLDERS AGREEMENT RELATING TO KESTREL DIAGNOSTICS LTD
        Between Kestrel Diagnostics Ltd (the "Company"), Dr Amara Osei, Lukas Berg and Fjord Ventures I LP (together the "Shareholders"), dated 9 March 2026.

