requiredConnectors:
  - id: req-document-source
    capabilities: [cloud_storage, documents]
    role: tool
    description: Read source documents from your connected storage or documents workspace, and save the output there

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post the memo and flagged provisions to your legal channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where the memo and flagged provisions should be posted"
        fallback: your legal channel
    prose:
      whenBound: "post to {{pick:alert-channel}} that it is ready"
      whenUnbound: "open a chat thread saying it is ready"
  - id: opt-email
    capability: email_communication
    role: tool
    description: Email the completed SHA memo to the corporate legal team.

defaultAgentType: agent
# The deliverable is a file. With a documents or cloud-storage connector bound
# the graph must write it there; with neither, the obligation lapses.
producesDocument: true
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: file.created
  # A contract arrives as a Drive file or as a Notion page, and this team reads
  # either. Each bound connector delivers only the topic it emits.
  eventTopics: [file.created, document.created]

# The 15 topics the description sells, as a contract rather than a paragraph.
#
# The memo is a narrative and the Analyst's output is a grid, but the EXTRACTION
# underneath is the same shape: one answer per topic, per document. Declaring it
# here is what compiles the "15 topic areas" promise into a step; without it a
# memo missing four topics reads exactly like one that has them all.
extractionSchema:
  - index: 0
    name: Parties and Shareholdings
    format: text
    prompt: "Who are the parties? Give each full legal name, role, share classes held, and percentage interest, on a fully diluted basis where the agreement states one."
  - index: 1
    name: Share Classes and Rights
    format: text
    prompt: "What share classes exist and what rights attach to each? For every class, state voting rights, dividend rights, liquidation preference, and any conversion or redemption features."
  - index: 2
    name: Board Composition and Governance
    format: text
    prompt: "How is the board composed and governed? State board size, director appointment rights and the shareholding thresholds required to maintain them, quorum, and whether there is a casting vote."
  - index: 3
    name: Reserved Matters
    format: bulleted_list
    prompt: "Which decisions require a special majority, unanimity, or a specific shareholder's consent? For each, state the threshold and whose consent is required."
  - index: 4
    name: Pre-emption on New Shares
    format: text
    prompt: "Who holds pre-emption rights on new share issues? State the procedure, the timeline, and any carve-outs such as employee option schemes."
  - index: 5
    name: Transfer Restrictions
    format: text
    prompt: "What restricts a transfer of shares? State lock-up periods, prohibited transfers, permitted transfers such as those to affiliates, and any board or shareholder approval requirement."
  - index: 6
    name: Right of First Refusal
    format: text
    prompt: "Is there a right of first refusal or pre-emption on transfer? State the trigger, the procedure, the pricing mechanics, and any exceptions."
  - index: 7
    name: Drag-Along Rights
    format: text
    prompt: "Who holds drag-along rights? State the threshold that triggers them, the conditions such as a minimum price or independent valuation, and any minority protections."
  - index: 8
    name: Tag-Along Rights
    format: text
    prompt: "Who holds tag-along rights? State the triggering threshold, the exercise procedure, and the price terms."
  - index: 9
