requiredConnectors:
  - id: req-store
    capability: e_commerce
    role: tool
    description: Receive new orders, update order status to hold
  - id: req-accounting
    capability: accounting
    role: tool
    description: Create the invoice for each passed order
  - id: req-email
    capability: email_communication
    role: tool
    description: Send order confirmations, holding replies, and refund notices to the customer

optionalConnectors:
  - id: opt-project-management
    capability: project_management
    role: tool
    description: Raise a fulfillment task where the store cannot ship the order itself
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Alert on held orders, and post order summaries
    objects:
      - id: ops-channel
        kind: channel
        direction: write
        required: false
        label: "Where order summaries and held-order alerts should be posted"
        fallback: your ops channel
        whenUnbound: platform_chat

defaultAgentType: workflow
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "*/5 * * * *"