requiredConnectors:
  - id: req-ads
    capability: advertising
    role: tool
    description: Read each live ad's figures and stage replacement iterations as paused entities
optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post each proposal to the team channel and read the approval there
    objects:
      - id: ads-channel
        kind: channel
        direction: write
        required: false
        label: "Where creative-refresh proposals should be posted"
        fallback: your team channel
        whenUnbound: platform_chat
defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
# The agent may only write beside a record this run has actually read. An
# obligation rather than prose: the tenant runtime's write gate reads the flag.
writesRequireProvenance: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 */3 * *"
escalationPatterns: []
