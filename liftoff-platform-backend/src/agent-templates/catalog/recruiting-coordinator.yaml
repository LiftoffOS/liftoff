requiredConnectors:
  - id: req-ats
    capability: ats
    role: tool
    description: Your ATS, for applications and pipeline status
  - id: req-calendar
    capability: calendar
    role: tool
    description: Read interviewer availability, create interview events
  - id: req-email
    capability: email_communication
    role: tool
    description: Send candidate communications, briefs and offer drafts

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Send interviewer reminders and feedback follow-ups to the recruiting channel
    objects:
      - id: recruiting-channel
        kind: channel
        direction: write
        required: false
        label: "Where interviewer reminders and scheduling blockers should be posted"
        fallback: your recruiting channel
    prose:
      whenBound: "post to {{pick:recruiting-channel}}"
      whenUnbound: "say so in that notification"
  - id: opt-documents
    capability: documents
    role: data_source
    description: Read the approved offer letter template
    objects:
      # An offer letter is the company's own approved wording, and nothing in
      # the ATS holds it. Naming the document is the only way this team drafts
      # from the real one instead of writing an offer of its own.
      - id: offer-template
        kind: file
        direction: read
        required: false
        label: "Your approved offer letter template, to draft each offer from"
        fallback: your approved offer letter template
    prose:
      whenBound: "from {{pick:offer-template}}"
      whenUnbound: "from wording the recruiter supplies, asked for explicitly"

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [role, global, conversation]
  writableLayers: [individual, conversation]
defaultTriggerConfig:
  type: event
  eventTopic: candidate.created
  # Screening rides the application event. Every timed follow-up in the
  # responsibilities falls due hours or days later, and candidate.created fires
  # once, so this is the clock they actually run on.
  companionCrons:
    - label: timed-coordination-sweep
      cronExpr: "0 * * * *"
      objective: "Read the ATS and the calendar for coordination steps now due or overdue: send the interviewer preparation brief for each interview about 24 hours out, request feedback within an hour of an interview ending, chase an interviewer at 24 hours and notify the recruiter at 48, and send a candidate one scheduling reminder after 2 business days with no reply and notify the recruiter after 2 more. Run an overdue step late rather than skipping it, and send each one only once."