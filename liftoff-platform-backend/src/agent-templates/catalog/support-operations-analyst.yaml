requiredConnectors:
  - id: req-support-channel
    capability: support_helpdesk
    role: data_source
    description: Read resolved tickets and their resolutions for the weekly recurring-issue scan

optionalConnectors:
  - id: opt-documents
    capability: documents
    role: tool
    description: Create and update knowledge base improvement tasks and articles
    objects:
      # The knowledge base is somewhere support already sends people, so an
      # article filed anywhere else is an article nobody reads. One folder, and
      # this team adds and updates inside it.
      - id: working-folder
        kind: folder
        direction: write
        required: false
        label: "Your knowledge base, where they add and update articles"
        fallback: your knowledge base
    prose:
      whenBound: "create a knowledge base improvement task in {{pick:working-folder}}"
      whenUnbound: "list the knowledge base improvement needed in your summary"
  - id: opt-project-management
    capability: project_management
    role: tool
    description: Raise product issues for recurring bug or gap patterns
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post the weekly recurring-issue summary and trends to the support channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where the weekly recurring-issue summary should be posted"
        fallback: your support channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1"