requiredConnectors:
  - id: req-documents
    capability: documents
    role: tool
    description: Where the research document goes
    objects:
      # One place, answerable as a folder or a document; a document per request
      # is created there and linked from the reply, never filed elsewhere.
      - id: research-doc
        kind: destination
        direction: write
        required: true
        label: "Where this team should save the research document"
        fallback: your working folder
optionalConnectors:
  - id: opt-social
    capability: social_media
    role: data_source
    description: Read community posts and comments about the product and its alternatives
    prose:
      whenBound: "through the connected social media account"
      whenUnbound: "with your own web tools"
  - id: opt-scrape
    capability: web_scraping
    role: data_source
    description: Fetch review pages and forum threads as text
    prose:
      whenBound: "through the connected web scraper"
      whenUnbound: "with your own web tools"
defaultAgentType: agent
# The deliverable is a file: the research document. The documents connector is
# required so the graph always has somewhere to write it.
producesDocument: true
defaultMemoryScope:
  readableLayers: [conversation]
  writableLayers: [conversation]
defaultTriggerConfig:
  type: manual
escalationPatterns: []
