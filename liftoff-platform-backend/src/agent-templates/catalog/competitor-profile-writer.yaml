requiredConnectors:
  - id: req-documents
    capability: documents
    role: tool
    description: Where the profile documents and the cross-competitor summary go
    objects:
      # One place, answerable as a folder or a document. Every profile is
      # linked from the summary rather than filed beside it, because a
      # documents connector cannot create a folder or move a file.
      - id: profiles-folder
        kind: destination
        direction: write
        required: true
        label: "Where this team should save its work"
        fallback: your working folder
optionalConnectors:
  - id: opt-seo
    capability: seo
    role: data_source
    description: Domain authority, backlinks, ranking keywords and traffic for each competitor's domain
    prose:
      whenBound: "from the connected SEO data source"
      whenUnbound: "as not measured, since no SEO data source is connected"
  - id: opt-scrape
    capability: web_scraping
    role: data_source
    description: Fetch each competitor's public pages and review pages as text
    prose:
      whenBound: "through the connected web scraper"
      whenUnbound: "with your own web tools"
defaultAgentType: agent
# The deliverable is a file. With a documents or cloud-storage connector bound
# the graph must write it there; with neither, the obligation lapses.
producesDocument: true
defaultMemoryScope:
  readableLayers: [conversation]
  writableLayers: [conversation]
defaultTriggerConfig:
  type: manual
escalationPatterns: []
