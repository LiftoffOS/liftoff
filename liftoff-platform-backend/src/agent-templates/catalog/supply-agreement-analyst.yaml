        4. Delivery. DAP Buyer's Leeds plant within ten business days o f a purchase order; time o f delivery is o f th3 essence.
        5. Quality. Products conform to Schedule 1 and to EU food-contact regulations; th3 Buyer may reject non-conforming Products within fifteen days o f delivery.
        6. Warranties. The Supplier warrants title, conformity for twelve months from delivery, and that th3 Products are free from defects in materials and workmanship.
        7. Limitation o f Liability. The Supp
        [remaining pages illegible: scan cut off at the fold]

        Fill the grid for this document.
    expected:
      rubric: >-
        The grid is filled from the legible parts of the scan; every column that depends on the
        illegible or damaged passages says so — reduced confidence, or that the page was unreadable —
        rather than being guessed or left blank.
  # Two clauses state the same term differently: the conflict is noted and both are cited.
  - id: the-same-provision-appears-twice-with-conflicting-terms
    turns:
      - |-
        SUPPLY AGREEMENT
        Between Ashworth Beverages Ltd ("Buyer") and Glasshouse Packaging S.A. ("Supplier"), effective 1 March 2026.

        1. Products. Glass bottles in the sizes and specifications set out in Schedule 1, and closures compatible with them.
        2. Term. Three years from the Effective Date.
        3. Renewal. Renews for successive two-year periods unless either party gives six months notice before the end of the then-current term.
        4. Delivery. DAP Buyer's Leeds plant within ten business days of a purchase order; time of delivery is of the essence.
        5. Quality. Products conform to Schedule 1 and to EU food-contact regulations; the Buyer may reject non-conforming Products within fifteen days of delivery.
        6. Warranties. The Supplier warrants title, conformity for twelve months from delivery, and that the Products are free from defects in materials and workmanship.
        7. Limitation of Liability. The Supplier's aggregate liability is capped at 100 percent of the amounts paid in the preceding twelve months; neither party is liable for loss of profit.
        8. Force Majeure. Neither party is liable for failure caused by events beyond its reasonable control; if such an event continues for sixty days either party may terminate.
        9. Termination. Either party may terminate for material breach unremedied within thirty days, or on insolvency.
        10. Governing Law and Disputes. English law; disputes to arbitration in London under the ICC Rules.
        11. Schedule 2, Commercial Terms. Initial Term: five years from the Effective Date.

        Fill the grid for this document.
    expected:
      rubric: >-
        The column that both "Term" and "Schedule 2, Commercial Terms" bear on records that the two
        provisions conflict and cites both clause references, rather than silently choosing one of them.
  # A provision the document does not state is "Not stated", never a blank and never market practice.
  - id: a-silent-provision-reads-not-stated
    turns:
      - |-
        SUPPLY AGREEMENT
        Between Ashworth Beverages Ltd ("Buyer") and Glasshouse Packaging S.A. ("Supplier"), effective 1 March 2026.

        1. Products. Glass bottles in the sizes and specifications set out in Schedule 1, and closures compatible with them.
        2. Term. Three years from the Effective Date.
        3. Renewal. Renews for successive two-year periods unless either party gives six months notice before the end of the then-current term.
        4. Delivery. DAP Buyer's Leeds plant within ten business days of a purchase order; time of delivery is of the essence.
        5. Quality. Products conform to Schedule 1 and to EU food-contact regulations; the Buyer may reject non-conforming Products within fifteen days of delivery.
        6. Warranties. The Supplier warrants title, conformity for twelve months from delivery, and that the Products are free from defects in materials and workmanship.
        7. Limitation of Liability. The Supplier's aggregate liability is capped at 100 percent of the amounts paid in the preceding twelve months; neither party is liable for loss of profit.
        8. Force Majeure. Neither party is liable for failure caused by events beyond its reasonable control; if such an event continues for sixty days either party may terminate.
        9. Termination. Either party may terminate for material breach unremedied within thirty days, or on insolvency.
        10. Governing Law and Disputes. English law; disputes to arbitration in London under the ICC Rules.

        Fill the grid for this document.
    expected:
      reply_includes:
        - Not stated
      rubric: >-
        The "Liquidated Damages" column, which this document does not address, reads "Not stated" and is
        neither left blank nor filled from market practice or from what such agreements usually say.

