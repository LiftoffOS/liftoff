requiredConnectors:
  - id: req-documents
    capability: documents
    role: tool
    description: Where they read from and save drafts for review
    objects:
      # One folder to work in. The page and its brief are both this team's own
      # output, so they go where it works and get linked, rather than each
      # asking the person hiring for a destination.
      - id: working-folder
        kind: destination
        direction: write
        required: true
        label: "Where this team should save its work"
        fallback: your working folder
  # Its own requirement, because it is a different question. Asked on one
  # tree with the destination, a row was routed by what it WAS — so naming a
  # document as the save location answered THIS instead, and the team was
  # hired with nowhere to work.
  - id: req-positioning
    capability: documents
    role: data_source
    description: What they argue their own side from
    objects:
      # Half of a comparison is your own side, and it lives in a document
      # somebody already wrote. Asking which one is a ten-second question with
      # an exact answer; the alternative was six lines telling the team how to
      # search for it, how to tell a cold index from a real absence, and what to
      # do when the hunt fails. Pointing at the file removes the hunt.
      - id: positioning-source
        kind: file
        direction: read
        required: false
        label: "Your positioning or messaging document, to argue your own side from"
        fallback: your positioning document
optionalConnectors:
  - id: opt-data-table
    capability: data_table
    role: tool
    description: Hold the backlog of comparison pages still to be written
defaultAgentType: agent
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: manual
escalationPatterns: []
