requiredConnectors:
  - id: req-version-control
    capability: version_control
    role: tool
    description: Read and write pull/merge requests, branches, commits

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Notify the engineering channel when a PR is opened, blocked on review, or landed
    objects:
      - id: engineering-channel
        kind: channel
        direction: write
        required: false
        label: "Where PR opened, blocked and landed notices should be posted"
        fallback: your engineering channel
    prose:
      whenBound: "Post to {{pick:engineering-channel}}"
      whenUnbound: "Say so in the pull request itself"

defaultAgentType: agent
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [individual]
  writableLayers: [individual]
defaultTriggerConfig:
  type: event
  eventTopic: issue.created