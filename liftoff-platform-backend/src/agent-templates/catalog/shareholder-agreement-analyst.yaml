        4. Reserved Matters. Issuing shares, incurring debt over GBP 500,000, changing the business, and disposing of material assets require Fjord's consent.
        5. Pre-emption. Each Shareholder may take up new shares pro rata to its holding before any issue to a third party.
        6. Transfers. No transfer for three years save to permitted transferees; thereafter a right of first refusal in favour of the other Shareholders at the proposed price.
        7. Drag-Along. Shareholders holding 75 percent may require the others to sell on the same terms to a bona fide purchaser.
        8. Tag-Along. If Shareholders holding 50 percent or more sell, the others may sell on the same terms.
        9. Dividends. No dividends before the third anniversary; thereafter as the Board recommends, subject to the preferred dividend of 6 percent.
        10. Exit. The Shareholders shall use reasonable endeavours to achieve an exit within seven years.
        11. Deadlock. A deadlock is referred to the chief executives of the founders and Fjord, then to mediation.
        12. Restrictive Covenants. Each founder shall not compete or solicit employees for twelve months after ceasing to hold shares.
        13. Confidentiality. Each party keeps the Company's information confidential during and for two years after the term.
        14. Warranties. The founders warrant the accuracy of the disclosure letter and the cap table.
        15. Governing Law and Disputes. English law; disputes to the courts of England.

        Fill the grid for this document.
    expected:
      reply_omits:
        - not a shareholder agreement
        - not the expected document
    counterpartOf: not-the-expected-document-type-say-so-in
  # A scan with poor OCR: reduced confidence is stated on the affected columns.
  - id: poor-document-quality-such-as-a-scanned-pdf
