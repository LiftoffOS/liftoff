requiredConnectors:
  - id: req-crm
    capability: crm
    role: tool
    description: Open and track escalation records, log outcomes, and read account context
  - id: req-email
    capability: email_communication
    role: tool
    description: Send acknowledgements and status updates, and read replies

optionalConnectors:
  - id: opt-support-ticketing
    capability: support_ticketing
    role: data_source
    description: Read the critical support tickets behind an escalation for full context
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post escalation alerts and daily summaries to the account channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where escalation alerts and the daily open-escalation summary should be posted"
        fallback: your account team channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role, conversation]
  writableLayers: [role, conversation]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1-5"