requiredConnectors:
  - id: req-documents
    capability: documents
    role: tool
    description: Where the audit document goes
    objects:
      # One place, answerable as a folder or a document; one audit document per
      # request is created there and linked from the reply.
      - id: audit-doc
        kind: destination
        direction: write
        required: true
        label: "Where this team should save each audit"
        fallback: your working folder
optionalConnectors:
  - id: opt-scrape
    capability: web_scraping
    role: data_source
    description: Fetch the page as rendered text and raw HTML, and the site's robots rules
    prose:
      whenBound: "through the connected web scraper, as text and as raw HTML"
      whenUnbound: "with your own web tools, as text"
  - id: opt-seo
    capability: seo
    role: data_source
    description: The keywords the page ranks for and the gap against the target keyword
    prose:
      whenBound: "from the connected SEO data source"
      whenUnbound: "where an SEO data source is connected, else say rank data was not read"
defaultAgentType: agent
# The deliverable is a file: the audit. The documents connector is required so
# the graph always has somewhere to write it.
producesDocument: true
defaultMemoryScope:
  readableLayers: [conversation]
  writableLayers: [conversation]
defaultTriggerConfig:
  type: manual
escalationPatterns: []
