        CRM: dana.whitlock → Dana Whitlock, Fleet Director, account Kestrel Freight Ltd, open opportunity OPP-790 "Kestrel platform" (Discovery, 96,000, close 30 Nov); tom.reid → NO contact record; kestrel-freight.example is on BOTH the prospect account "Kestrel Freight Ltd" and the existing customer account "Kestrel Freight (Ireland) Ltd". No activity exists yet for this meeting on OPP-790.
        Transcript: Dana: "The depot planners spend most of Monday on routes." Priya: "I'll send the security review by Wednesday." Dana: "We'll review internally with Siobhan next week." Tom: "Can we get the API docs?" Priya: "Yes, I can get you those tomorrow." Dana: "This sounds really promising. Let's book the follow-up for the 24th." Sentiment: positive. No budget or signing date mentioned.
        Email connector: connected. Project management: connected. Team chat: connected.
    expected:
      rubric: >-
        The ambiguity between the prospect and the customer account on the same domain is flagged in the
        summary and both records are linked; it is not resolved unilaterally and no contact is filed
        against the wrong account without saying so.
  - id: stage-signal-is-present-but-ambiguous-record-the
    turns:
      - |-
        These meeting notes just became available.

        meeting.notes_available — "Kestrel Freight — route scoring walkthrough", 14 Sep 10:00-10:45, organiser priya.raman@demo.example
        Attendees: priya.raman@demo.example, dana.whitlock@kestrel-freight.example, tom.reid@kestrel-freight.example
        CRM: dana.whitlock → Dana Whitlock, Fleet Director, account Kestrel Freight Ltd, open opportunity OPP-790 "Kestrel platform" (Discovery, 96,000, close 30 Nov); tom.reid → NO contact record. No activity exists yet for this meeting on OPP-790.
        Transcript: Dana: "The depot planners spend most of Monday on routes." Priya: "I'll send the security review by Wednesday." Dana: "We'll review internally with Siobhan next week." Tom: "Can we get the API docs?" Priya: "Yes, I can get you those tomorrow." Dana: "We're leaning towards moving forward, I think. Let's book the follow-up for the 24th." Sentiment: positive. No budget or signing date mentioned.
        Email connector: connected. Project management: connected. Team chat: connected.
    expected:
      reply_includes:
        - leaning towards
      rubric: >-
        "We're leaning towards moving forward" is recorded verbatim in the activity body under a Signals
        detected heading; the stage is not advanced, and the summary says a signal was detected but not
