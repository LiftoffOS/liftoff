requiredConnectors:
  - id: req-crm
    capability: crm
    role: tool
    description: Read lead and account context, and log every qualification touch
  - id: req-email
    capability: email_communication
    role: tool
    description: Send personalized inbound follow-ups and read replies
  - id: req-calendar
    capability: calendar
    role: tool
    description: Book discovery calls with Account Executives when a lead qualifies

optionalConnectors:
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post qualified-lead alerts and AE hand-off notifications to the sales channel
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where qualified-lead alerts and AE hand-offs should be posted"
        fallback: your sales channel
    prose:
      whenBound: "post a one-line summary to {{pick:alert-channel}}"
      whenUnbound: "record a one-line summary on the CRM deal"
  - id: opt-enrichment
    capability: enrichment
    role: data_source
    description: Fill in company size, industry and seniority the form omits
  - id: opt-form-intake
    connectorType: google_sheets
    role: data_source
    requiredScopes:
      - https://www.googleapis.com/auth/spreadsheets.readonly
    description: Read new submissions from your form's response sheet
    objects:
      # Which spreadsheet holds the form's responses is a fact only the person
      # who built the form has. A workspace holds dozens of sheets and the
      # wrong one qualifies leads that never wrote in.
      - id: response-sheet
        kind: table
        direction: read
        required: false
        label: "Your form's response sheet, where new submissions land"
        fallback: your form's response sheet
    prose:
      whenBound: "in {{pick:response-sheet}}"
      whenUnbound: "the trigger delivered"

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [individual, role, conversation]
  writableLayers: [individual, role, conversation]
defaultTriggerConfig:
  type: event
  eventTopic: lead.created