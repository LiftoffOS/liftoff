requiredConnectors:
  - id: req-analytics
    capabilities: [web_analytics, product_analytics]
    role: data_source
    description: List the tracked goals and key events and read when each last fired
optionalConnectors:
  - id: opt-ads
    capability: advertising
    role: data_source
    description: List the conversion actions in your ads account and when each last recorded a conversion
    prose:
      whenBound: "and the connected ads account's conversion actions"
      whenUnbound: "without ads conversion actions, since no ads account is connected"
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post the monthly tracking report to the team channel
    objects:
      - id: tracking-channel
        kind: channel
        direction: write
        required: false
        label: "Where the monthly tracking report should be posted"
        fallback: your team channel
        whenUnbound: platform_chat
defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 1 * *"
escalationPatterns: []
