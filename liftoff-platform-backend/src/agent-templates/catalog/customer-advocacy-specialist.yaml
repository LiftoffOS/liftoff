requiredConnectors:
  - id: req-crm
    capability: crm
    role: data_source
    description: Read renewals, expansions, promoter scores, the referral field and the at-risk flag
  # Required, not optional, because the record of prior asks has to live
  # somewhere this role may write. The CRM is a store type the series-write
  # obligation counts, and this role never writes to it, so with the CRM as the
  # only bound store no graph could satisfy `comparesWithLastRun` and the hire
  # could not converge.
  - id: req-documents
    capability: documents
    role: tool
    description: Where the month's list, its drafts and the record of asks are kept
    objects:
      # One place, answerable as a folder or a document. The record of asks is
      # created on the first run and updated in place; everything else is
      # linked from the post, never filed.
      - id: advocacy-doc
        kind: destination
        direction: write
        required: true
        label: "Where this team should save the monthly list and the record of asks"
        fallback: your working folder
optionalConnectors:
  - id: opt-support
    capability: support_helpdesk
    role: data_source
    description: Read closed tickets with thanks as a satisfaction signal
  - id: opt-partner
    capability: partner_management
    role: data_source
    description: Read who has already referred through your partner platform
    prose:
      whenBound: "read the connected partner platform"
      whenUnbound: "read the CRM's referral field"
  - id: opt-team-chat
    capability: team_chat
    role: tool
    description: Post the month's list to the team channel
    objects:
      - id: advocacy-channel
        kind: channel
        direction: write
        required: false
        label: "Where the monthly list of customers to ask should be posted"
        fallback: your team channel
        whenUnbound: platform_chat
defaultAgentType: agent
# The deliverable is a file: the month's list, and the record of asks the next
# run reads. With the documents connector bound the graph must write it there.
producesDocument: true
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 1 * *"
escalationPatterns: []
