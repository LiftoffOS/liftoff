requiredConnectors:
  - id: req-github
    connectorType: github
    role: tool
    requiredScopes: [repo]
    description: Read merged PRs and issues; create release tags and release notes

optionalConnectors:
  - id: opt-linear
    connectorType: linear
    role: data_source
    requiredScopes: []
    description: Read issue completion status and release milestone progress
  - id: opt-jira
    connectorType: atlassian_jira
    role: data_source
    requiredScopes: [read:jira-work]
    description: Alternative issue tracker for reading sprint completion and fix version status
  - id: opt-google-docs
    capability: documents
    role: tool
    description: Draft and store release notes for review before publishing
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post blocker summaries, draft release notes, and release announcements
    objects:
      - id: release-channel
        kind: channel
        direction: write
        required: false
        label: "Where blocker summaries, draft notes and release announcements should be posted"
        fallback: your engineering channel
        whenUnbound: platform_chat

defaultAgentType: agent
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: manual