    - Closing an onboarding record before the 90-day feedback is collected

requiredConnectors:
  - id: req-hris
    capability: hris
    role: tool
    description: Your HR system, for new hire records and onboarding progress
  - id: req-email
    capability: email_communication
    role: tool
    description: Send welcome emails and check-ins, and read new hire replies

optionalConnectors:
  - id: opt-documents
    capability: documents
    role: tool
    description: Read the onboarding template, and build each new hire's page
    objects:
      # Every new hire's page is built from a page somebody already designed.
      # Which one it is, is a fact only HR holds, and the alternative to asking
      # is a search of the whole workspace where last year's draft looks exactly
      # as much like the template as the template does.
      - id: onboarding-template
        kind: file
        direction: read
        required: false
        label: "Your onboarding page template, to build each new hire's page from"
        fallback: your onboarding page template
    prose:
      whenBound: "Create the new hire's onboarding page from {{pick:onboarding-template}}"
      whenUnbound: "Build the new hire's onboarding page from the checklist you just created, and say in the hiring manager's brief that it was written from scratch"
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post introductions, blockers and milestones; notify IT and HR
    objects:
      # The day-0 introduction goes to the new hire's own department channel,
      # which is read off their record and differs per hire. This names the
      # standing one: where blockers, milestones and the IT notice land.
      - id: hr-channel
        kind: channel
        direction: write
        required: false
        label: "Where blockers, milestones and provisioning notices should be posted"
        fallback: your HR channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role, conversation]
  writableLayers: [individual, conversation]
defaultTriggerConfig:
  type: event
  eventTopic: employee.created
  # The hire event opens the file. It cannot deliver day 1, week 1, day 14, day
  # 30, day 60, day 90 or a 24-hourly blocker chase, because it fires once and
  # every one of those falls due later. This is the clock those milestones run on.
  companionCrons:
    - label: daily-onboarding-sweep
      cronExpr: "0 9 * * 1-5"
      objective: "Read the onboarding schedules in the HR system and work every in-flight hire whose milestone is due today or overdue: the day-1, week-1, day-14, day-30, day-60 and day-90 check-ins and their manager summaries, running a late milestone rather than skipping it and naming the lateness. On the same pass, re-check every open blocker, follow up with the responsible party where it is still open, and leave it open until the new hire confirms it is resolved."