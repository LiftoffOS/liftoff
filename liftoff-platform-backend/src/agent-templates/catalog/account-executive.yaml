        CRM:
        - j.okafor@ridgeway-logistics.example → Joseph Okafor, Head of Operations, account Ridgeway Logistics plc
        - s.byrne@ridgeway-logistics.example → NO contact record
        - Ridgeway Logistics plc open opportunities: OPP-771 "Platform renewal" Negotiation, 210,000, 12 days in stage, next step 2 Sep (passed); OPP-780 "Fleet analytics add-on" Proposal, 60,000, 8 days in stage, next step 20 Sep
        - Last 5 activities: 3 days ago email from J. Okafor re pricing; 9 days ago call (notes: "asked whether Corvid's tool does route scoring"); 15 days ago meeting; 22 days ago email; 30 days ago email
        - Open tasks tagged source: meeting-coordinator: "Send security review to Ridgeway" due 5 Sep, owner Maya Chen
        Email connector: connected, last 30 days with J. Okafor: thread "Pricing for renewal" (4 messages, latest asks for a 3-year option). Meeting notes connector: connected, last call 9 days ago: Okafor wants route scoring by Q1; Byrne to join the next call as the budget holder.
    expected:
      reply_includes:
        - OPP-771
        - OPP-780
        - s.byrne
      rubric: >-
        One brief, sent to Maya Chen as a direct message, carrying Meeting, Deal status (both OPP-771
        and OPP-780, with a flag that more than one is active), Last touchpoint, Recent email and call
        context (the 3-year option ask; route scoring by Q1 and Byrne as budget holder), Open action
