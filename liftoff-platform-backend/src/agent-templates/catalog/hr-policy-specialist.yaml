requiredConnectors:
  - id: req-hris
    capability: hris
    role: data_source
    description: Your HR system, for employee records and PTO balances
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Watch your HR channels, answer in thread, and flag gaps to HR

optionalConnectors:
  - id: opt-documents
    capability: documents
    role: data_source
    description: Read policy documents and employee handbook for policy lookups
    objects:
      # A folder, not a file: the answer depends on the question, so searching
      # within the library is the job. Naming the library is what stops the
      # search starting from the whole drive, where a stale handbook copy or
      # somebody's draft is as findable as the real policy.
      - id: policy-library
        kind: folder
        direction: read
        required: false
        label: "Where your policy documents and employee handbook live"
        fallback: your policy library
    prose:
      whenBound: "search {{pick:policy-library}} for the relevant section"
      whenUnbound: "look for the relevant section in the HR records you can reach"

defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: event
  eventTopic: chat.message
  # Answering rides the message event. The monthly gap report does not: nothing
  # arrives on the first Monday to trigger it, and a report promised in the
  # responsibilities with no schedule behind it is a report nobody ever gets.
  companionCrons:
    - label: monthly-policy-gap-report
      cronExpr: "0 9 1-7 * 1"
      objective: "Compile the policy gaps logged over the past 30 days, group them by policy area (leave, benefits, expense, workplace procedures, other), rank the topics by frequency, and post the gap report to the HR channel with suggested new or updated policy sections and the departments most affected, anonymized."