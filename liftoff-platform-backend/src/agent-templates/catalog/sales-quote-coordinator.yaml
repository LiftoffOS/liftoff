requiredConnectors:
  - id: req-crm
    capability: crm
    role: tool
    description: Detect the deal reaching the quote stage, pull deal data
  - id: req-accounting
    capability: accounting
    role: tool
    description: Create the matching invoice from the approved line items once the buyer signs

optionalConnectors:
  - id: opt-esign
    capability: e_sign
    role: tool
    description: Send proposals for signature and track their status
  - id: opt-documents
    capability: documents
    role: tool
    description: Build the proposal from a branded template
    objects:
      # Every quote a buyer sees is the company's branded proposal, and which
      # document that is, is a fact only the rep's own team holds. Picking the
      # wrong one sends a buyer a proposal that looks like somebody else's.
      - id: proposal-template
        kind: file
        direction: read
        required: false
        label: "Your proposal template, to build each quote from"
        fallback: your proposal template
    prose:
      whenBound: "build the proposal from {{pick:proposal-template}}, with this deal's numbers"
      whenUnbound: "write a plain proposal carrying this deal's line items, and tell the rep it was written without your branded template"
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Send the quote to the rep for approval, and post when it goes
    objects:
      # The approval goes to the rep as a message; this names the deals channel
      # the sent-quote post lands in, where the owner is mentioned.
      - id: deals-channel
        kind: channel
        direction: write
        required: false
        label: "Where sent quotes should be posted, mentioning the deal owner"
        fallback: your deals channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role, conversation]
  writableLayers: [role, conversation]
defaultTriggerConfig:
  type: event
  eventTopic: deal.updated