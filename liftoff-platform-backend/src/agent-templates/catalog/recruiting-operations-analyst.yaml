requiredConnectors:
  - id: req-ats
    capability: ats
    role: data_source
    description: Read the hiring pipeline, stage history, and timestamps for weekly metrics

optionalConnectors:
  - id: opt-data-table
    capability: data_table
    role: tool
    description: Hold the running pipeline history each week is appended to and compared against
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post the weekly pipeline analytics report to the recruiting channel
    objects:
      - id: recruiting-channel
        kind: channel
        direction: write
        required: false
        label: "Where the weekly pipeline analytics report should be posted"
        fallback: your recruiting channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1"