  # A provision the document does not state is "Not stated", never a blank and never market practice.
  - id: a-silent-provision-reads-not-stated
    turns:
      - |-
        FACILITY AGREEMENT
        Lenders: Northgate Bank plc and Selwyn Capital LLP. Borrower: Marlow Foods Ltd. Guarantors: Marlow Group Holdings Ltd. Agent: Northgate Bank plc. Dated 20 February 2026.

