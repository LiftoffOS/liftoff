requiredConnectors:
  # The cycle itself lives here, not in the responses table. Step 1 derives the
  # current cycle from review dates, step 2 needs who is due, and the 360 list
  # is an org chart -- "their peers, their manager, and their direct reports".
  # All three are HR data. Without this the first instruction in Workflows reads
  # a system the agent has no connector to, and every later step hangs off it.
  - id: req-hris
    capability: hris
    role: data_source
    description: Read review dates, who is due this cycle, and the reporting relationships the 360 list is built from
  - id: req-responses-table
    capability: data_table
    role: tool
    description: Hold the 360 responses, one row per reviewer per employee per cycle
  - id: req-email
    capability: email_communication
    role: tool
    description: Send the form link and reminders, and read responses
  - id: req-documents
    capability: documents
    role: tool
    description: Read the review template, and publish each finalized review
    objects:
      # A published review has to look like every other published review, so it
      # is built from the page the team already uses. Only HR knows which page
      # that is, and a review published off the wrong one is read by the
      # employee before anyone notices.
      - id: review-template
        kind: file
        direction: read
        required: false
        label: "Your review template, to publish each finalized review from"
        fallback: your review template
  - id: req-calendar
    capability: calendar
    role: tool
    description: Book the 1:1 between manager and employee and schedule the day-before reminder

optionalConnectors:
  - id: opt-typeform
    connectorType: typeform
    role: tool
    description: Send and collect the 360 form when you use Typeform
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Send the draft to the manager, and post status to HR
    objects:
      # The draft goes to the manager as a message. This names where cycle
      # status is posted, which is a standing HR channel rather than anywhere
      # a review draft could be read by the wrong people.
      - id: hr-channel
        kind: channel
        direction: write
        required: false
        label: "Where cycle status should be posted for HR"
        fallback: your HR channel
        whenUnbound: platform_chat

inputs:
  - id: feedback_form_url
    label: 360 feedback form link
    type: url
    required: false
    placeholder: https://forms.example.com/360-review
    hint: The standing form reviewers fill in, so a new one is not built each cycle
defaultAgentType: agent
# This role is told to confirm it has not already acted. Declared so the graph
# must carry the step that checks, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 1 */3 *"
  # The quarterly run opens a cycle. Everything that happens inside one -- a
  # response arriving, a window closing, a non-responder to chase, a manager to
  # remind, a 1:1 the day after tomorrow -- falls between two firings of it.
  companionCrons:
    - label: daily-cycle-sweep
      cronExpr: "0 9 * * 1-5"
      objective: "Read the open review cycle and the responses table, and do what is now due: collect responses that have arrived, close a response window that has passed and synthesize the draft for that employee's manager, send one mid-window reminder to reviewers who have not responded, remind a manager once where a finalized review is overdue against the cycle close date, and send the day-before reminder for any 1:1 scheduled tomorrow. Do a missed step late rather than skipping it, and send each reminder only once."