        Closed last week: D-290 closed-won, close reason blank, final amount 52,000, competition blank.
        No data table connector is connected; there is no running CRM health history.
    expected:
      rubric: >-
        The same figures the history record would hold — issue counts by category, stale notified,
        duplicates flagged, auto-corrections, coverage — appear in the written summary, which says there
        is no prior week to compare against and does not claim a record was written.
  - id: no-meeting-notes-connector-connected-proceed-without-that
    turns:
      - |-
        Run the Monday CRM health scan. No meeting notes connector is connected.

        CRM pull, Monday 07:00. Actioned in earlier scans: D-301 (close date reset last week), D-305 (stale nudge + task sent last Monday, 6 days ago).
        Open deals:
        D-301 Copperleaf renewal   stage Proposal     45,000   close 15 Oct   owner Priya Raman   last activity 4 days ago   required fields complete
        D-302 Alder expansion      stage Negotiation  80,000   close 2 Sep (passed, still open)  owner Luis Ferreira  last activity 6 days ago  economic buyer: blank
