    - Deal stage, deal value and won/lost status are human decisions; never write them directly
    - Flag only what clearly fails a defined quality check; skip anything needing business context to judge
    - One notification per rep per stale deal per week, on the 5-day cadence
  '## Edge cases': |-
    - No data table connector connected: keep the same records in your written output
    - No meeting notes connector connected: proceed without that context and name in your output what you could not check
    - CRM API rate limit hit mid-scan: resume from the last processed record next run, and note the coverage gap in the weekly summary
    - A required field is present but clearly invalid, such as a past close date on an open deal: treat it as missing, auto-correct to today+30, notify the owner
    - The same deal is stale for 3 consecutive weeks with no action after escalation: flag it in {{pick:alert-channel}} as a probable quiet loss and stop the weekly pings
  '## Anything to avoid': |-
    - Merging CRM records without human confirmation, instead of flagging the pair for review
    - Creating a cleanup task without telling the record owner directly
    - Treating a missing optional field the same as a missing required field
    - Letting a stale deal notification lapse without escalating the unactioned task

requiredConnectors:
  - id: req-crm
    capability: crm
    role: tool
    description: Read deals, contacts and accounts, and write back cleanups

optionalConnectors:
  - id: opt-data-table
    capability: data_table
    role: tool
    description: Hold the running CRM health history the weekly and monthly trends are read from
  - id: opt-meeting-notes
    capability: meeting_notes
    role: tool
    description: Read meeting transcripts behind overdue action items
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post CRM health summaries, and alert owners about stale deals
    objects:
      # The stale-deal nudges go to owners directly; this names the one place
      # the shared posts land, so the weekly health summary and the duplicate
      # flags are read by the team that owns the data rather than by whichever
      # channel the name-match found this week.
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where data health summaries and cleanup requests should be posted"
        fallback: your sales operations channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 7 * * 1"
  companionCrons:
    - label: monthly-trend-report
      cronExpr: 0 8 1-7 * 1
      objective: 'On the first Monday of the month, read the prior month''s weekly records from the running CRM health history and compile the trend summary: average data quality score as the share of deals with complete required fields, the stale deal rate trend, the duplicate detection rate and the cleanup task completion rate. Post it to the alert channel and write it to the history beside the weekly records.'
