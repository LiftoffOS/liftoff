      1. Confirm which deals and owners you have already actioned in an earlier scan, and exclude them from the updates and messages below. A stale deal stays stale between runs, so treating the whole list as new resets the same close date, sends the same owner the same nudge, and assigns them the same task again every Monday. Pull all open pipeline deals; identify those missing required fields: close date, stage, deal value, primary contact
      2. For deals with past close dates and still-open status: update the close date to 30 days from today and add a note flagging it as auto-updated; notify the deal owner via the team-chat tool that their close date was reset
      3. Scan contacts and accounts for duplicates: match on email domain + company name similarity; flag probable pairs (do not merge); post each flagged pair to {{pick:alert-channel}} for human review
      4. Identify stale deals: no logged activity (email, call, meeting, task) in the past 30 days while stage is not Closed
      5. For each stale deal: post a team-chat message to the deal owner directly noting the deal name, days since last activity, and current stage; assign a CRM task to the owner with a 5-day deadline to log an update or move the deal
      6. For deals stale > 90 days: post an escalation to {{pick:alert-channel}}; flag as probable lost deal
      7. Identify closed-won or closed-lost deals missing outcome fields (close reason, final amount, competition); post to {{pick:alert-channel}} with links and a cleanup request
      8. Flag deals that skipped a stage (qualified to proposal without discovery), deals sitting in a stage past twice the average time, and close-date pushes without a reason
      9. Run a pipeline coverage check: calculate total open pipeline value, count of deals per stage, and average deal age
      10. Read last week's record from the running CRM health history, then post the weekly data health summary to {{pick:alert-channel}}: issue counts by category, stale deals notified, duplicates flagged, auto-corrections made, pipeline coverage metrics, and the change against that record. With nothing on record yet, report this week's figures and say plainly that there is no prior week to compare against
      11. Write this week's figures to the running CRM health history, on every run including an uneventful one. The next comparison reads this record, and a week skipped for being dull breaks the following week's trend rather than this one's
  - id: follow-up-on-open-cleanup-tasks
    name: Follow-up on open cleanup tasks (ongoing)
    useWhen: >-
      Cleanup tasks assigned in the last fortnight need chasing: a reminder to the owner at five days
      without action, an escalation to the alert channel at ten, and completed tasks logged for the
      next summary. Meeting action-item tasks ride the same cadence with their meeting context.
    notNeededFor: >-
      Finding new issues and assigning new tasks, which every-monday-at-7am-run-the-crm-health covers;
      and the monthly trend, which monthly-pipeline-health-trend-report covers.
    body: |-
      1. Twice per week: check all open cleanup tasks assigned in the last 14 days
      2. For tasks with no action after 5 days: send the deal owner a team-chat reminder
      3. For tasks with no action after 10 days: escalate to {{pick:alert-channel}} with the specific record, issue, and days outstanding
      4. When a task is completed: log the resolution in the weekly health summary for the next run

      **Meeting action item follow-up:** CRM tasks tagged source: meeting-coordinator ride the same 5-day and 10-day cadence. Surface an overdue one with its meeting context pulled from the linked CRM activity: the date and the exact commitment ("You committed to sending the security review in your 4/15 call with Acme").

      **Stage-gated field governance (inside the weekly scan):** each stage has its own required fields, not just the globally-required ones. A deal in Negotiation needs a close date, an amount, a dated next step and a named economic buyer. Flag any deal that advanced past the stage where a field should have been filled, and assign the fix to the record owner.
  - id: monthly-pipeline-health-trend-report
    name: Monthly pipeline health trend report
    useWhen: >-
      The first Monday of the month, or a request for the trend: the prior month's weekly records are
      compiled into data quality score, stale rate, duplicate rate and cleanup completion trends,
      posted and written to the history.
    notNeededFor: >-
      The weekly scan itself, which every-monday-at-7am-run-the-crm-health covers; and chasing
      individual tasks, which follow-up-on-open-cleanup-tasks covers.
    body: |-
      1. On the first Monday of each month: read the prior month's weekly records from the running CRM health history and compile them into a trend summary
      2. Report: average data quality score (% of deals with complete required fields), stale deal rate trend, duplicate detection rate, cleanup task completion rate
      3. Post the trend report to {{pick:alert-channel}}, and write it to the running CRM health history alongside the weekly records
    companionCron: monthly-trend-report

evals:
  # Every fixture is INLINE: the event, the CRM extract or the request is handed over in the turn, so a
  # case runs against no record in a customer's systems and never fails because a fixture moved.
  # The served case: the dividing line is judgement. A past close date is corrected; a duplicate
  # pair, a missing outcome field and a stale deal each get an owner, a deadline and a link; the
  # already-actioned deals are left alone.
  - id: the-weekly-scan-fixes-the-unambiguous-and-assigns-the-rest
    turns:
      - |-
        Run the Monday CRM health scan.

        CRM pull, Monday 07:00. Actioned in earlier scans: D-301 (close date reset last week), D-305 (stale nudge + task sent last Monday, 6 days ago).
        Open deals:
        D-301 Copperleaf renewal   stage Proposal     45,000   close 15 Oct   owner Priya Raman   last activity 4 days ago   required fields complete
        D-302 Alder expansion      stage Negotiation  80,000   close 2 Sep (passed, still open)  owner Luis Ferreira  last activity 6 days ago  economic buyer: blank
        D-305 Tern platform        stage Discovery    30,000   close 30 Nov   owner Maya Chen     last activity 37 days ago  required fields complete
        D-307 Halden add-on        stage Proposal     22,000   close 10 Oct   owner Priya Raman   last activity 2 days ago   deal value: blank on the stage-required set? no — value present; primary contact: blank
        D-309 Norrsken pilot       stage Negotiation  15,000   close 20 Sep   owner Maya Chen     last activity 95 days ago  required fields complete
        Contacts: "Ridgeway Logistics plc" and "Ridgeway Logistics" both at ridgeway-logistics.example with overlapping contacts.
        Closed last week: D-290 closed-won, close reason blank, final amount 52,000, competition blank.
        Running CRM health history (data table): last week: 4 issues, 2 stale notified, 1 duplicate flagged, 1 auto-correction; pipeline 190,000 across 5 deals.
    expected:
      reply_includes:
        - D-302
        - D-309
      rubric: >-
        D-302's passed close date is reset to today plus 30 with an auto-updated note and Luis Ferreira
        told directly; its blank economic buyer in Negotiation is flagged and assigned, not invented.
        The Ridgeway pair is posted to the alert channel for review and not merged. D-309 (95 days
        stale) gets a direct message to Maya Chen naming deal, days and stage, a 5-day task, and an
        escalation as a probable lost deal. D-305 gets no second nudge (actioned 6 days ago). D-307's
        blank primary contact is assigned to Priya Raman. D-290's missing close reason and competition
        are posted with links. The summary posts issue counts, coverage (total value, deals per stage,
        average age) and the change against last week's record, and this week's figures are written to
        the history.
  - id: a-required-field-is-present-but-clearly-invalid
    turns:
      - |-
        Run the Monday CRM health scan.

