      for required fields and past close dates, duplicates flagged, stale deals sent to their owners
      with a task, closed deals checked for outcome fields, coverage computed, and the weekly summary
      posted and recorded against last week.
    notNeededFor: >-
      A deal or owner already actioned in an earlier scan, which is excluded from this week's updates
      and messages; chasing the cleanup tasks the scan assigned, which follow-up-on-open-cleanup-tasks
      covers; and the month's trend across weekly records, which monthly-pipeline-health-trend-report
      covers.
