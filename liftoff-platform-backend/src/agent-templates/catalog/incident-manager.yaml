requiredConnectors:
  - id: req-error-tracking
    capability: error_tracking
    role: data_source
    description: Your error monitoring platform, for events and stack traces
  - id: req-linear
    connectorType: linear
    role: tool
    requiredScopes: []
    description: Open and update structured incident tickets as the source of truth
  - id: req-github
    connectorType: github
    role: data_source
    requiredScopes: [repo]
    description: Match error onset to recent commits and deploys

optionalConnectors:
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Run the incident thread with live status updates and a resolution summary
    objects:
      # The thread lives wherever it is opened, so this names where it opens.
      # An incident thread in a channel the responders do not watch is the one
      # failure this team cannot recover from later.
      - id: incident-channel
        kind: channel
        direction: write
        required: false
        label: "Where the incident thread should be opened and updated"
        fallback: your incident channel
        whenUnbound: platform_chat

defaultAgentType: agent
defaultMemoryScope:
  readableLayers: [role]
  writableLayers: [role]
defaultTriggerConfig:
  type: manual