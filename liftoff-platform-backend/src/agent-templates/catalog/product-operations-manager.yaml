requiredConnectors:
  - id: req-email
    capability: email_communication
    role: tool
    description: Read customer feedback email threads; follow up with reporters for clarification
  - id: req-docs
    capability: documents
    role: tool
    description: Create the weekly feedback summary document
    objects:
      # A weekly document is only useful where people already look, and this
      # team writes one every Monday for as long as it runs. One folder, named
      # once at hire, rather than a destination asked for again each week.
      - id: working-folder
        kind: folder
        direction: write
        required: true
        label: "Which folder the weekly feedback summaries should be written to"
        fallback: your product folder

optionalConnectors:
  - id: opt-project-management
    capability: project_management
    role: tool
    description: Create and track the product feedback issues this team files
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Read feedback from your channels, and post weekly summaries
    objects:
      # Feedback is gathered from every channel the connection can see, which
      # is deliberately plural. This names the single one the weekly summary
      # and the tracking-issue links are posted back to.
      - id: summary-channel
        kind: channel
        direction: write
        required: false
        label: "Where the weekly summary and issue links should be posted"
        fallback: your product channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1"
  timezone: America/Los_Angeles