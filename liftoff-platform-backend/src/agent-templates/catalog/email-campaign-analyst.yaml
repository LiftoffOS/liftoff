    description: Hold the performance history each week is appended to and compared against
  - id: req-team-chat
    capability: team_chat
    role: tool
    description: Post underperformance alerts, summaries and test proposals
    objects:
      - id: alert-channel
        kind: channel
        direction: write
        required: false
        label: "Where campaign alerts and weekly summaries should be posted"
        fallback: your marketing channel
        whenUnbound: platform_chat

defaultAgentType: agent
# This role reports a change against a previous run, so the graph must write
# this run's record as well as read the last one. A skipped write breaks the
# NEXT comparison, not its own.
comparesWithLastRun: true
# This role has a trigger that re-delivers. Declared so the graph must carry the
# step that checks it has not already acted, rather than the prose hoping it does.
requiresIdempotencyCheck: true
defaultMemoryScope:
  readableLayers: [global, role]
  writableLayers: [role]
defaultTriggerConfig:
  type: cron
  cronExpr: "0 9 * * 1"
  timezone: America/Los_Angeles
  # The weekly analysis is Monday. The deliverability rules are not: a bounce
  # spike on a Tuesday threatens sender reputation for six days before a
  # Monday-only run sees it, which is the damage the Goals say this role exists
  # to prevent.
  companionCrons:
    - label: daily-threshold-check
      cronExpr: "0 9 * * 2-5"
      objective: "Check active campaigns against the deliverability thresholds only: pause any campaign whose bounce rate is above 5% or unsubscribe rate above 1%, log the metric and threshold that triggered it, and alert the marketing channel now. Where every key metric is declining at once, alert and flag it for review before any further sends. Take no other action and write no summary; the weekly analysis is Monday's run."