name: 'Authenticate npm to Artifact Registry'
description: |
  Fetches a WIF access token from GCP and exports it as ARTIFACT_REGISTRY_TOKEN.
  The checked-in .npmrc uses that variable to authenticate @liftoffos/* pulls
  from us-west1-npm.pkg.dev. The calling job must declare
  `permissions: { id-token: write, contents: read }` at the job level.

runs:
  using: composite
  steps:
    - id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
        service_account: YOUR_SERVICE_ACCOUNT@YOUR_PROJECT.iam.gserviceaccount.com
        token_format: access_token
        access_token_lifetime: 600s
        access_token_scopes: https://www.googleapis.com/auth/cloud-platform

    - name: Export ARTIFACT_REGISTRY_TOKEN for npm
      shell: bash
      run: echo "ARTIFACT_REGISTRY_TOKEN=${{ steps.auth.outputs.access_token }}" >> "$GITHUB_ENV"
