# Liftoff Switch — upstream drift canary.
#
# Installs the LATEST release of each supported source weekly, generates the
# scripted installation, and runs detect + inventory against it. A parse failure
# or an unrecognised new field alerts before a user's machine finds it, and
# answers when a new pinned fixture is due.
#
# This is not optional hygiene. Upstream velocity on both products is extreme
# (Hermes landed roughly 1,400 commits in ten days during its plugin-architecture
# pivot; OpenClaw ships monthly at a size larger than the other evaluated
# harnesses combined), so a pinned fixture goes stale fast. The committed
# generation script is what keeps a revision bump a re-run rather than an act of
# archaeology.
#
# It NEVER fails the build for the whole repo: drift is information about
# upstream, not a defect in this checkout. It opens/updates an issue instead.

name: switch-drift-canary

on:
  schedule:
    # Mondays 06:00 UTC — early enough in the week that a new fixture can be
    # harvested before the sprint fills up.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'Limit to one source (openclaw|hermes). Empty runs both.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    strategy:
      # Each source is independent: one adapter breaking must not hide the
      # other's result.
      fail-fast: false
      matrix:
        source: [openclaw, hermes]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI
        run: npm run build --workspace=packages/liftoff-cli

      - name: Harvest against upstream latest
        id: harvest
        continue-on-error: true
        env:
          # No model key in CI: the canary only needs configuration-produced
          # state to answer "can we still parse this installation?". Execution
          # state is a harvest-time concern, not a drift concern.
          HARVEST_MODEL_KEY: ''
        run: |
          set -o pipefail
          ./scripts/switch-harvest/harvest.sh "${{ matrix.source }}" latest 2>&1 | tee harvest.log

      - name: Run detect and inventory against it
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          node ./scripts/switch-harvest/probe-latest.js "${{ matrix.source }}" 2>&1 | tee probe.log

      - name: Summarise
        if: always()
        run: |
          echo "### Switch drift canary — ${{ matrix.source }}" >> "$GITHUB_STEP_SUMMARY"
          echo "harvest: ${{ steps.harvest.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "probe:   ${{ steps.probe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f probe.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -40 probe.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update a drift issue
        if: steps.harvest.outcome == 'failure' || steps.probe.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const source = '${{ matrix.source }}';
            const title = `Switch adapter drift: ${source}`;
            const body = [
              `The weekly drift canary could not read a fresh **${source}** installation at upstream latest.`,
              '',
              `harvest: \`${{ steps.harvest.outcome }}\`, probe: \`${{ steps.probe.outcome }}\``,
              '',
              `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'This means the adapter is likely broken against current upstream, even though the',
              'pinned-fixture tests still pass. The fix is usually: harvest a NEW fixture',
              'generation at the current revision, update the adapter against it, and bump the',
              'pinned revision in `scripts/switch-harvest/harvest.sh`.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'switch-drift',
            });
            const match = existing.data.find((i) => i.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['switch-drift'],
              });
            }
