name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  buf:
    name: buf lint + breaking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs history

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: true
          # Run breaking check against the base of the current branch.
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"
          # We publish generated stubs to GCP Artifact Registry, not buf.build.
          push: false

  generate:
    name: buf generate + tsc
    runs-on: ubuntu-latest
    needs: buf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install deps
        run: npm ci

      - name: Generate stubs
        run: buf generate

      - name: Verify no uncommitted gen diff
        run: |
          if ! git diff --quiet gen/; then
            echo "Generated stubs are out of date. Run 'buf generate' locally and commit."
            git diff gen/
            exit 1
          fi

      - name: Compile TypeScript
        run: npm run build
