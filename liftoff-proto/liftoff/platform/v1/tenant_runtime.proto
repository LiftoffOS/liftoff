syntax = "proto3";

// Platform-backend → TenantRuntime RPC surface. Codifies the existing
// REST calls that today live in src/connectors/tenant-runtime-client.ts,
// so both sides have a typed contract.
package liftoff.platform.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "liftoff/event/v1/common.proto";
import "liftoff/governance/v1/types.proto";

service TenantRuntimeService {
  // HITL dashboard — list pending approvals for a tenant.
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);

  // Resolve a pending HITL approval (approve / reject with reason).
  rpc ResolveApproval(ResolveApprovalRequest) returns (ResolveApprovalResponse);

  // Send late feedback after a decision has already fired. Triggers
  // reflection and updates the action ledger's override trail.
  rpc SendLateFeedback(SendLateFeedbackRequest) returns (SendLateFeedbackResponse);

  // Per-connector invocation stats for insights dashboards.
  rpc GetInvocationStats(GetInvocationStatsRequest) returns (GetInvocationStatsResponse);

  // Agent cost entries for billing attribution.
  rpc GetAgentCosts(GetAgentCostsRequest) returns (GetAgentCostsResponse);

  // Usage dashboard summary — credits consumed, top agents, top connectors.
  rpc GetUsageDashboard(GetUsageDashboardRequest) returns (GetUsageDashboardResponse);

  // Live connector health — staleness, error rates, consecutive failures.
  rpc GetConnectorHealth(GetConnectorHealthRequest) returns (GetConnectorHealthResponse);

  // Tool catalog — which connector functions are registered for a tenant.
  rpc GetToolCatalog(GetToolCatalogRequest) returns (GetToolCatalogResponse);

  // Per-action cost breakdown — LLM + connector costs per governance action.
  // Powers the cost attribution ingester in platform-backend.
  rpc GetActionCosts(GetActionCostsRequest) returns (GetActionCostsResponse);

  // Operator response to a pending agent clarification question. Routes by
  // clarification source: recovery_llm → resume Cloud Task; anchor_intervention
  // → forward to Anchor's /agent/respond-to-human-intervention.
  rpc RespondToClarification(RespondToClarificationRequest) returns (RespondToClarificationResponse);
}

// ── HITL approvals ────────────────────────────────────────────────────

message ListApprovalsRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
  liftoff.governance.v1.ApprovalStatus status_filter = 2;
  liftoff.event.v1.Pagination pagination = 3;
}

message ListApprovalsResponse {
  repeated liftoff.governance.v1.HitlApprovalRequest approvals = 1;
  string next_page_token = 2;
  repeated PendingClarification clarifications = 3;
}

message PendingClarification {
  string id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  string thread_id = 4;
  string question = 5;
  string source = 6;                  // "recovery_llm" | "anchor_intervention"
  string vendor_request_id = 7;       // present only for anchor_intervention
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message RespondToClarificationRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
  string clarification_id = 2;
  string response = 3;
  string resolved_by = 4;             // account id, for audit
}

message RespondToClarificationResponse {
  bool success = 1;
}

message ResolveApprovalRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
  string approval_id = 2;
  liftoff.governance.v1.ApprovalDecision decision = 3;
  string decided_by = 4;
  string decided_by_role = 5;
  string rejection_reason = 6;
  string rejection_category = 7;
  // If true, persist this decision as a standing policy so future tool calls
  // with the same (agent_id, gate_reason) are auto-resolved without gating.
  bool always_apply = 8;
  // Why the approver said yes, in their words. Optional.
  //
  // The counterpart to rejection_reason, and deliberately a separate field
  // rather than a shared one: a note explaining an approval written into
  // rejection_reason would read as a rejection everywhere that column is
  // surfaced. Only a rejection taught the agent anything before this; an
  // approval carried no explanation at all, so the standing policy an operator
  // set with always_apply had no recorded rationale behind it.
  string approval_note = 9;

  // Tool arguments the approver rewrote before saying yes, keyed by the id of
  // the pending tool call they replace. Empty for an ordinary approval.
  //
  // The decision stays APPROVED: a reviewer who fixes a price and sends is
  // approving, not doing a third thing, and a third enum value would fork
  // every binary branch that reads this decision for no gain. What changes is
  // only WHICH arguments get dispatched.
  //
  // Recorded separately from the original pending_tool_calls rather than
  // overwriting them, for two reasons. The approval carries a tamper hash over
  // the calls as proposed, so editing them in place fails verification. And an
  // audit that cannot show what the agent WANTED to send next to what a person
  // actually sent has lost the only interesting fact about the review.
  map<string, google.protobuf.Struct> edited_tool_inputs = 10;
}

message ResolveApprovalResponse {
  bool success = 1;
}

// ── Late feedback ─────────────────────────────────────────────────────

message SendLateFeedbackRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
  string feedback_id = 2;
  liftoff.governance.v1.ApprovalDecision decision = 3;
  string decided_by = 4;
  string decided_by_role = 5;
  string rejection_reason = 6;
  string tool_calls_hash = 7;
  repeated PendingToolCall pending_tool_calls = 8;
}

message SendLateFeedbackResponse {
  bool success = 1;
}

message PendingToolCall {
  string id = 1;
  string name = 2;
  // Serialised input (JSON). Using bytes rather than Struct because the
  // runtime-client carries this as a string already.
  bytes input_json = 3;
}

// ── Insights ──────────────────────────────────────────────────────────

message GetInvocationStatsRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
  google.protobuf.Timestamp since = 2;
}

message GetInvocationStatsResponse {
  int64 total_invocations = 1;
  int64 successful_invocations = 2;
  int64 failed_invocations = 3;
  int64 total_tool_calls = 4;
  double total_cost_usd = 5;
}

message GetAgentCostsRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
  google.protobuf.Timestamp since = 2;
}

message GetAgentCostsResponse {
  repeated AgentCostEntry entries = 1;
}

message AgentCostEntry {
  string agent_id = 1;
  double total_cost_usd = 2;
  int64 invocation_count = 3;
  // Token breakdown for audit and repricing.
  int64 total_input_tokens = 4;
  int64 total_output_tokens = 5;
  int64 total_cached_tokens = 6;
}

message GetUsageDashboardRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
  google.protobuf.Timestamp since = 2;
}

message GetUsageDashboardResponse {
  double total_cost_usd = 1;
  double remaining_credits_usd = 2;
  int32 active_agents = 3;
  repeated string top_agents_by_cost = 4;
  repeated string top_connectors_by_usage = 5;
}

// ── Connector health ──────────────────────────────────────────────────

message GetConnectorHealthRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
}

message GetConnectorHealthResponse {
  repeated ConnectorHealthEntry entries = 1;
}

message ConnectorHealthEntry {
  string connector_id = 1;
  string connector_type = 2;
  string status = 3;
  google.protobuf.Timestamp last_success_at = 4;
  int32 consecutive_failures = 5;
}

// ── Tool catalog ──────────────────────────────────────────────────────

message GetToolCatalogRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
}

message GetToolCatalogResponse {
  repeated ToolCatalogEntry tools = 1;
}

message ToolCatalogEntry {
  string connector_type = 1;
  string function_name = 2;
  string description = 3;
  repeated string categories = 4;
}

// ── GetActionCosts ────────────────────────────────────────────────────

message GetActionCostsRequest {
  liftoff.event.v1.TenantContext tenant_context = 1;
  // Optional: filter to a specific agent's actions.
  string agent_id = 2;
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
  // Pagination cursor (action ID of the last entry returned).
  string page_cursor = 5;
  int32 page_size = 6;
}

message GetActionCostsResponse {
  repeated ActionCostEntry entries = 1;
  string next_page_cursor = 2;
}

message ActionCostEntry {
  string action_id = 1;
  string agent_id = 2;
  string workflow_id = 3;
  string connector = 4;
  string action_type = 5;
  // LLM cost incurred during this action's invocation.
  double llm_cost_usd = 6;
  // Direct connector call cost (e.g. paid APIs).
  double connector_cost_usd = 7;
  int64 input_tokens = 8;
  int64 output_tokens = 9;
  int64 duration_ms = 10;
  google.protobuf.Timestamp occurred_at = 11;
}
