# Cloud Build pipeline for liftoff-developer-proxy.
# Phase 0e: SHA-only image tags, default machine type, 3600s timeout.
# Phase 0e SLSA-3: the binauthz sign-and-create step signs the image
# with the developer-proxy-attestor created by terraform/modules/developer-proxy/.

timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  dynamicSubstitutions: true
  substitutionOption: ALLOW_LOOSE

substitutions:
  _REGION: us-west1
  _ENV: dev  # overridden per-trigger
  # Every environment-specific value is set by the Cloud Build trigger
  # (terraform/projects/platform-ci/main.tf in liftoff-infrastructure-gcp).
  # The defaults below carry NO environment's URL on purpose: a dev URL here
  # ships to prod whenever the trigger does not override it, and a
  # developer's tool would be handed https://api-dev.example.com/proxy at
  # credential setup. Left empty, PLATFORM_BACKEND_URL and PROXY_BASE_URL are
  # derived from ENVIRONMENT by src/infrastructure/config.ts (which also
  # refuses the prod proxy URL in a non-prod environment), and CORS allows no
  # browser origin rather than a wrong one.
  _PLATFORM_BACKEND_URL: ''
  _CORS_ALLOWED_ORIGINS: ''
  _PROXY_BASE_URL: ''

steps:
  # Step 0: Cancel any older builds for this environment so only the newest runs.
  - id: cancel-stale-builds
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        # Skip when not started by a trigger (manual `gcloud builds submit`):
        # those builds carry no TRIGGER_NAME, and the filter would otherwise
        # match every other manual build in flight.
        if [ -z "${TRIGGER_NAME}" ]; then
          echo "Manual build (no TRIGGER_NAME); skipping stale-build cancellation."
          exit 0
        fi
        gcloud builds list \
          --project=${PROJECT_ID} \
          --region=${LOCATION} \
          --filter="status=WORKING OR status=QUEUED" \
          --format='value(id,substitutions.TRIGGER_NAME)' | \
          awk -v me="${BUILD_ID}" -v key="${TRIGGER_NAME}" '$$1!=me && $$2==key {print $$1}' | \
        while read OLD_ID; do
          echo "Cancelling stale build: $$OLD_ID"
          gcloud builds cancel "$$OLD_ID" --project=${PROJECT_ID} --region=${LOCATION} --quiet 2>/dev/null || true
        done
    waitFor: ['-']

  # 1. Get Artifact Registry token for @liftoffos/* private npm packages
  - id: ar-token
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - echo -n "$$( gcloud auth print-access-token )" > /workspace/ar_token

  # Step 0.5 (plan 0F): reproducible CI baseline — npm ci, lint, typecheck,
  # unit tests on a clean checkout BEFORE any image is built. A red gate here
  # stops the deploy. Needs the AR token (defined above) for @liftoffos/*
  # scoped packages (same .npmrc mechanism as the Docker builds).
  - id: ci-checks
    name: node:20
    waitFor: [ar-token]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export ARTIFACT_REGISTRY_TOKEN="$$(cat /workspace/ar_token)"
        npm ci
        npm run lint
        npm run typecheck
        npm test

  # 1. Build the runtime image (gated on green CI checks — plan 0F)
  - id: build-runtime
    name: gcr.io/cloud-builders/docker
    waitFor: [ci-checks, ar-token]
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          -f Dockerfile \
          --build-arg ARTIFACT_REGISTRY_TOKEN="$$(cat /workspace/ar_token)" \
          -t ${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy:${SHORT_SHA} \
          .

  # 2. Build the migrate image
  - id: build-migrate
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          -f Dockerfile.migrate \
          --build-arg ARTIFACT_REGISTRY_TOKEN="$$(cat /workspace/ar_token)" \
          -t ${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy-migrate:${SHORT_SHA} \
          .

  # 3. Push both
  - id: push-runtime
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy:${SHORT_SHA}"]
  - id: push-migrate
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy-migrate:${SHORT_SHA}"]

  # 5. Deploy/update the migrate Cloud Run Job (create-or-update)
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - developer-proxy-migrate-${_ENV}
      - --project=YOUR_GCP_PROJECT
      - --image=${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy-migrate:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=developer-proxy-${_ENV}@YOUR_GCP_PROJECT.iam.gserviceaccount.com
      - --set-env-vars=DB_INSTANCE_CONNECTION_NAME=YOUR_GCP_PROJECT:${_REGION}:control-plane-pg-${_ENV}
      - --set-secrets=DB_MIGRATE_PASSWORD=developer-proxy-pg-migrate-password:latest
      - --set-cloudsql-instances=YOUR_GCP_PROJECT:${_REGION}:control-plane-pg-${_ENV}
      - --network=vpc-${_ENV}
      - --subnet=subnet-${_REGION}-${_ENV}
  - id: migrate-execute
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - developer-proxy-migrate-${_ENV}
      - --project=YOUR_GCP_PROJECT
      - --region=${_REGION}
      - --wait

  # 6. Deploy/update the developer-proxy Cloud Run service
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - developer-proxy
      - --project=YOUR_GCP_PROJECT
      - --image=${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy:${SHORT_SHA}
      - --region=${_REGION}
      - --no-allow-unauthenticated
      # Request-based CPU: the instance bills only while a request is in
      # flight. Nothing runs between requests: the usage row is written before
      # the stream closes, the outbox is delivered by the hourly ingestion-feed
      # poll, and shutdown settles the rest (docs/invariants.md INV-DP-005).
      - --cpu=1
      - --cpu-throttling
      - --service-account=developer-proxy-${_ENV}@YOUR_GCP_PROJECT.iam.gserviceaccount.com
      # `^|^` makes "|" the list delimiter: CORS_ALLOWED_ORIGINS is itself a
      # comma-separated list of origins, and gcloud would
      # otherwise read the comma as the next KEY=VALUE.
      - --set-env-vars=^|^ENVIRONMENT=${_ENV}|GCP_PROJECT_ID=YOUR_GCP_PROJECT|GCP_REGION=${_REGION}|DB_INSTANCE_CONNECTION_NAME=YOUR_GCP_PROJECT:${_REGION}:control-plane-pg-${_ENV}|DB_NAME=developer_proxy|DB_USER=developer_proxy_app|DB_APP_PASSWORD_SECRET=developer-proxy-pg-password|PLATFORM_BACKEND_URL=${_PLATFORM_BACKEND_URL}|CONTROL_PLANE_API_URL=${_PLATFORM_BACKEND_URL}|CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}|TENANT_RUNTIME_SERVICE_TOKEN_SECRET=tenant-runtime-service-token|PROXY_BASE_URL=${_PROXY_BASE_URL}
      - --set-secrets=BYOK_WEBHOOK_TOKEN_SECRET=developer-proxy-webhook-token:latest
      - --set-cloudsql-instances=YOUR_GCP_PROJECT:${_REGION}:control-plane-pg-${_ENV}
      - --network=vpc-${_ENV}
      - --subnet=subnet-${_REGION}-${_ENV}
    waitFor: [migrate-execute, push-runtime]


  # Re-pin every Cloud Run Job of this service to the image just built.
  # Terraform ignores a job's image after creation and nothing else refreshes
  # it; the Docker registry deletes any version older than 30 days that is
  # not among the 20 newest, so a job left on an old digest fails "image not
  # found" on its next run.
  - id: update-jobs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        update_jobs() {
          IMAGE="$$1"; shift
          for JOB in "$$@"; do
            if gcloud run jobs describe "$$JOB" --project=YOUR_GCP_PROJECT --region=${_REGION} >/dev/null 2>&1; then
              echo "Updating $$JOB → $$IMAGE"
              gcloud run jobs update "$$JOB" --project=YOUR_GCP_PROJECT --region=${_REGION} --image="$$IMAGE" --quiet
            else
              echo "$$JOB not found — skipping"
            fi
          done
        }
        update_jobs ${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy:${SHORT_SHA} \
          developer-proxy-partitions-${_ENV} \
          developer-proxy-audit-anchor-${_ENV}
    waitFor: [deploy]

images:
  - ${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_GCP_PROJECT/developer-proxy-migrate:${SHORT_SHA}
